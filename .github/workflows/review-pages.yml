''', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old = '  <script src="./js/photo-store.js"></script>\n  <script src="./js/settings.js"></script>\n  <script src="./js/app.js"></script>'
          new = '  <script src="./js/photo-store.js"></script>\n  <script src="./js/settings.js"></script>\n  <script src="./js/shared-state.js"></script>\n  <script src="./js/app.js"></script>'
          if old not in index:
              raise SystemExit('index script marker not found')
          index = index.replace(old, new, 1)
          index = index.replace('id="settingsVersionText">v65.13<', 'id="settingsVersionText">v65.14<', 1)
          index_path.write_text(index, encoding='utf-8')

          settings_path = Path('js/settings.js')
          settings = settings_path.read_text(encoding='utf-8')
          if 'const APP_VERSION = "v65.13";' not in settings:
              raise SystemExit('settings source version mismatch')
          settings_path.write_text(settings.replace('const APP_VERSION = "v65.13";', 'const APP_VERSION = "v65.14";', 1), encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          if 'const CACHE_NAME = "electronic-board-camera-v65.13";' not in sw:
              raise SystemExit('service worker source version mismatch')
          sw = sw.replace('const CACHE_NAME = "electronic-board-camera-v65.13";', 'const CACHE_NAME = "electronic-board-camera-v65.14";', 1)
          sw = sw.replace('  "./js/settings.js",\n  "./js/app.js",', '  "./js/settings.js",\n  "./js/shared-state.js",\n  "./js/app.js",', 1)
          sw_path.write_text(sw, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8').replace('# 電子看板カメラ v65.13', '# 電子看板カメラ v65.14', 1)
          if '## v65.14 共有状態整理' not in readme:
              readme += '\n\n## v65.14 共有状態整理\n- 複数モジュールが直接参照する共有定数・共有DOM・共有実行状態を `js/shared-state.js` へ集約\n- 既存の変数名とclassic scriptの参照方法は維持し、機能側の呼び出し変更を回避\n- `app.js` は初期化・全体イベント・app専用UIへ責務を縮小\n- IndexedDB、写真形式、命名規則、UI、OneDrive連携仕様は変更なし\n'
          readme_path.write_text(readme, encoding='utf-8')

          Path('docs/v65.14-shared-state.md').write_text('''# v65.14 共有状態整理

## 目的
`app.js` に残っていた「複数モジュールが同じ名前で直接参照する宣言」を `shared-state.js` に集約し、起動処理と共有状態の責務を分離する。

## 設計
- classic scriptは継続し、既存モジュールの変数参照を書き換えない。
- `settings.js` → `shared-state.js` → `app.js` の順に読み込む。
- `photoQuality` 等の初期値ロードが `settings.js` に依存するため、この順序は変更しない。
- 単一モジュール所有の宣言は各担当モジュールに置く。
- app専用のDOM/状態（toast等）はapp.jsに残す。

## 非変更
撮影、看板、写真取込、IndexedDB、Base64保存、ファイル名、OneDrive、画面操作。
''', encoding='utf-8')
          PY

          for f in js/*.js; do node --check "$f"; done

          node - <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('js').filter(f => f.endsWith('.js')).map(f => `js/${f}`);
          const texts = Object.fromEntries(files.map(f => [f, fs.readFileSync(f, 'utf8')]));
          const all = Object.values(texts).join('\n');
          const app = texts['js/app.js'];
          const shared = texts['js/shared-state.js'];
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          const sharedNames = ['APP_DATA','STATUS_LIST','SECTION_PHOTO_TYPE','POINT_DISPLAY_DEFAULT','BOARD_TEXT_SIZE_MULTIPLIERS','PHOTO_QUALITY_SETTINGS','BOARD_POSITIONS','BOARD_POSITION_LABELS','captureFrame','boardWrap','photoBoard','boardEditOverlay','boardEditPhotoBackdrop','boardEditDoneButton','subjectText','addressText','roomNoInput','sampleNoInput','dateText','photoCount','previewOverlay','categoryToggleButton','currentStream','selectedStatus','isSectionMode','capturedPhotos','previewIndex','boardEditTargetPhotoId','photoQuality','boardTextSize','boardFieldTextSize','boardMode','activeSidePanel','isDateManuallyEdited','boardState'];
          for (const name of sharedNames) {
            const re = new RegExp(`^\\s*(?:const|let)\\s+${name}\\b`, 'm');
            if (!re.test(shared)) throw new Error(`${name} missing from shared-state.js`);
            if (re.test(app)) throw new Error(`${name} still declared in app.js`);
          }
          for (const name of ['cameraScreen','boardLayer','boardEditPhotoStage','boardEditHost','toast','toastTimer']) {
            const re = new RegExp(`^\\s*(?:const|let)\\s+${name}\\b`, 'm');
            if (!re.test(app)) throw new Error(`${name} must remain app-owned`);
          }
          const order = ['./js/photo-store.js','./js/settings.js','./js/shared-state.js','./js/app.js','./js/photo-utils.js','./js/board.js','./js/camera.js','./js/photo-import.js','./js/photo-viewer.js'];
          let last = -1;
          for (const src of order) {
            const at = html.indexOf(`src="${src}"`);
            if (at < 0 || at <= last) throw new Error(`script order mismatch: ${src}`);
            last = at;
          }
          if (!sw.includes('electronic-board-camera-v65.14') || !sw.includes('"./js/shared-state.js"')) throw new Error('SW v65.14 mismatch');
          if (!texts['js/settings.js'].includes('const APP_VERSION = "v65.14";')) throw new Error('APP_VERSION mismatch');
          if (!html.includes('id="settingsVersionText">v65.14<')) throw new Error('HTML version mismatch');
          const funcs = new Set([...all.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m => m[1]));
          const bodies = [...html.matchAll(/onclick="([^"]+)"/g)].map(m => m[1]);
          const calls = bodies.flatMap(body => [...body.matchAll(/(?:^|[;\s])([A-Za-z_$][\w$]*)\s*\(/g)].map(m => m[1]));
          const ignore = new Set(['if','return']);
          const missing = [...new Set(calls.filter(n => !ignore.has(n) && !funcs.has(n)))];
          if (missing.length) throw new Error(`missing onclick functions: ${missing.join(', ')}`);
          NODE

          cat > .github/workflows/review-pages.yml <<'YAML'
          name: Deploy review site to Pages

          on:
            push:
              branches: [ review/v65.1 ]

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: review-pages
                url: ${{ steps.deployment.outputs.page_url }}review/
              runs-on: ubuntu-latest
              steps:
                - name: Checkout production main
                  uses: actions/checkout@v4
                  with:
                    ref: main
                    path: main-src

                - name: Checkout review branch
                  uses: actions/checkout@v4
                  with:
                    ref: review/v65.1
                    path: review-src

                - name: Build combined Pages artifact
                  run: |
                    mkdir -p site/review
                    rsync -a --exclude '.git' --exclude '.github' main-src/ site/
                    rsync -a --exclude '.git' --exclude '.github' review-src/ site/review/

                    # Review PWA must not share the production cache namespace.
                    # Source version is detected automatically so this workflow does not need edits every release.
                    python - <<'PY'
                    from pathlib import Path
                    import json
                    import re

                    sw = Path('site/review/service-worker.js')
                    text = sw.read_text(encoding='utf-8')
                    match = re.search(r'const CACHE_NAME = "electronic-board-camera-(v[^"]+)";', text)
                    if not match:
                        raise SystemExit('review cache version could not be detected')

                    version = match.group(1)
                    text = text.replace(
                        f'const CACHE_NAME = "electronic-board-camera-{version}";',
                        f'const CACHE_NAME = "electronic-board-camera-review-{version}";',
                        1,
                    )
                    text = text.replace(
                        '.filter((key) => key !== CACHE_NAME)',
                        '.filter((key) => key.startsWith("electronic-board-camera-review-") && key !== CACHE_NAME)',
                        1,
                    )
                    sw.write_text(text, encoding='utf-8')

                    manifest = Path('site/review/manifest.json')
                    data = json.loads(manifest.read_text(encoding='utf-8'))
                    data['name'] = '電子看板カメラ REVIEW'
                    data['short_name'] = '看板カメラR'
                    data['start_url'] = f'./?v={version.removeprefix("v")}-review'
                    manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

                    index = Path('site/review/index.html')
                    html = index.read_text(encoding='utf-8')
                    html = html.replace('<title>電子看板カメラ</title>', '<title>電子看板カメラ REVIEW</title>', 1)
                    index.write_text(html, encoding='utf-8')
                    PY

                - name: Setup Pages
                  uses: actions/configure-pages@v5

                - name: Upload artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: site

                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

          rm -f .github/workflows/v65-14-shared-state.yml .v65.14-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.14 共有状態を分離 [v65.14-done]"
          git push origin HEAD:review/v65.1

  deploy:
    needs: refactor-v65-14
    environment:
      name: review-pages
      url: ${{ steps.deployment.outputs.page_url }}review/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
