          sw = Path('site/review/service-worker.js')
          text = sw.read_text(encoding='utf-8')
          match = re.search(r'const CACHE_NAME = "electronic-board-camera-(v[^"]+)";', text)
          if not match:
              raise SystemExit('review cache version could not be detected')
          version = match.group(1)
          text = text.replace(f'const CACHE_NAME = "electronic-board-camera-{version}";', f'const CACHE_NAME = "electronic-board-camera-review-{version}";', 1)
          text = text.replace('.filter((key) => key !== CACHE_NAME)', '.filter((key) => key.startsWith("electronic-board-camera-review-") && key !== CACHE_NAME)', 1)
          sw.write_text(text, encoding='utf-8')

          manifest = Path('site/review/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = '電子看板カメラ REVIEW'
          data['short_name'] = '看板カメラR'
          data['start_url'] = f'./?v={version.removeprefix("v")}-review'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('site/review/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('<title>電子看板カメラ</title>', '<title>電子看板カメラ REVIEW</title>', 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
