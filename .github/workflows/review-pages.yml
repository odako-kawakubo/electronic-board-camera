name: Deploy review site to Pages

on:
  push:
    branches: [ review/v65.1 ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: review-pages
      url: ${{ steps.deployment.outputs.page_url }}review/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/v65.1
          path: review-src

      - name: Build combined Pages artifact
        run: |
          mkdir -p site/review
          rsync -a --exclude '.git' --exclude '.github' main-src/ site/
          rsync -a --exclude '.git' --exclude '.github' review-src/ site/review/

          # Review PWA must not share the production cache namespace.
          # version.json is the version source, matching the app update mechanism.
          python - <<'PY'
          from pathlib import Path
          import json

          version_data = json.loads(Path('site/review/version.json').read_text(encoding='utf-8'))
          version = str(version_data.get('version', '')).strip()
          if not version:
              raise SystemExit('review version could not be detected from version.json')

          sw = Path('site/review/service-worker.js')
          text = sw.read_text(encoding='utf-8')
          production_cache = f'const APP_CACHE = "electronic-board-camera-v{version}-stable";'
          review_cache = f'const APP_CACHE = "electronic-board-camera-review-v{version}-stable";'
          if production_cache not in text:
              raise SystemExit('review app cache declaration could not be detected')
          text = text.replace(production_cache, review_cache, 1)
          text = text.replace(
              'const APP_CACHE_PREFIX = "electronic-board-camera-";',
              'const APP_CACHE_PREFIX = "electronic-board-camera-review-";',
              1,
          )
          sw.write_text(text, encoding='utf-8')

          manifest = Path('site/review/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = '看板カメラ REVIEW'
          data['short_name'] = '看板カメラR'
          data['start_url'] = f'./?v={version}-review'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('site/review/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('<title>看板カメラ</title>', '<title>看板カメラ REVIEW</title>', 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
