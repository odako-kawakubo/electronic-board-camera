name: Deploy review site to Pages

on:
  push:
    branches: [ review/v65.1 ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: review-pages
      url: ${{ steps.deployment.outputs.page_url }}review/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/v65.1
          fetch-depth: 0
          path: review-src

      - name: Run v65.22 case album and top update
        working-directory: review-src
        shell: bash
        run: |
          python scripts/v65_22_case_album_top.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/photo-album.js js/photo-viewer.js js/photo-import.js js/pwa-controller.js service-worker.js index.html styles/app.css README.md docs/v65.22-case-album-top.md
          git commit -m "v65.22 案件別アルバムとトップ導線を追加 [v65.22-done]"
          git push origin HEAD:review/v65.1

      - name: Build combined Pages artifact
        run: |
          mkdir -p site/review
          rsync -a --exclude '.git' --exclude '.github' main-src/ site/
          rsync -a --exclude '.git' --exclude '.github' review-src/ site/review/

          # Review PWA must not share the production cache namespace.
          # Source version is detected automatically so this workflow does not need edits every release.
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          sw = Path('site/review/service-worker.js')
          text = sw.read_text(encoding='utf-8')
          match = re.search(r'const CACHE_NAME = "electronic-board-camera-(v[^"]+)";', text)
          if not match:
              raise SystemExit('review cache version could not be detected')

          version = match.group(1)
          text = text.replace(
              f'const CACHE_NAME = "electronic-board-camera-{version}";',
              f'const CACHE_NAME = "electronic-board-camera-review-{version}";',
              1,
          )
          text = text.replace(
              '.filter((key) => key !== CACHE_NAME)',
              '.filter((key) => key.startsWith("electronic-board-camera-review-") && key !== CACHE_NAME)',
              1,
          )
          sw.write_text(text, encoding='utf-8')

          manifest = Path('site/review/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = '電子看板カメラ REVIEW'
          data['short_name'] = '看板カメラR'
          data['start_url'] = f'./?v={version.removeprefix("v")}-review'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('site/review/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('<title>電子看板カメラ</title>', '<title>電子看板カメラ REVIEW</title>', 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
