name: v65.1 review refactor

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.1-refactor-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Split current v64 and fix storage result handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          src = path.read_text(encoding='utf-8')

          # CSSを現行の最終状態のまま外出しする。
          style_open = src.index('  <style>')
          style_content_start = src.index('\n', style_open) + 1
          style_close = src.index('  </style>', style_content_start)
          css = src[style_content_start:style_close]

          # 最初の大きなscriptだけを外出しし、末尾のSW登録scriptはHTMLに残す。
          script_open = src.index('  <script>', style_close)
          script_content_start = src.index('\n', script_open) + 1
          script_close = src.index('  </script>', script_content_start)
          js = src[script_content_start:script_close]

          js = js.replace('const APP_VERSION = "v64";', 'const APP_VERSION = "v65.1";', 1)

          old_save = '''    async function savePhotoToIndexedDB(photo) {\n      try {\n        const db = await openPhotoDB();\n        if (!db) return;\n\n        await new Promise((resolve, reject) => {\n          const transaction = db.transaction(DB_STORE_NAME, "readwrite");\n          const store = transaction.objectStore(DB_STORE_NAME);\n          const request = store.put(photo);\n\n          request.onsuccess = () => resolve();\n          request.onerror = () => reject(request.error);\n        });\n      } catch (error) {\n        console.error(error);\n        showToast("端末内保存に失敗しました");\n      }\n    }'''
          new_save = '''    async function savePhotoToIndexedDB(photo) {\n      try {\n        const db = await openPhotoDB();\n        if (!db) {\n          throw new Error("IndexedDBを開けませんでした");\n        }\n\n        await new Promise((resolve, reject) => {\n          const transaction = db.transaction(DB_STORE_NAME, "readwrite");\n          const store = transaction.objectStore(DB_STORE_NAME);\n          const request = store.put(photo);\n\n          request.onsuccess = () => resolve();\n          request.onerror = () => reject(request.error);\n          transaction.onabort = () => reject(transaction.error || new Error("IndexedDB transaction aborted"));\n        });\n        return true;\n      } catch (error) {\n        console.error(error);\n        showToast("端末内保存に失敗しました");\n        return false;\n      }\n    }'''
          if old_save not in js:
              raise RuntimeError('savePhotoToIndexedDB block not found')
          js = js.replace(old_save, new_save, 1)

          old_capture = '''        // 保存成功を確認してから、撮影済み配列と表示枚数へ反映する\n        await savePhotoToIndexedDB(photo);\n\n        capturedPhotos.push(photo);'''
          new_capture = '''        // 保存成功を確認してから、撮影済み配列と表示枚数へ反映する\n        const photoSaved = await savePhotoToIndexedDB(photo);\n        if (!photoSaved) {\n          throw new Error("撮影写真を端末内へ保存できませんでした");\n        }\n\n        capturedPhotos.push(photo);'''
          if old_capture not in js:
              raise RuntimeError('capture save flow not found')
          js = js.replace(old_capture, new_capture, 1)

          old_correct = '''        await savePhotoToIndexedDB(photo);\n        previewIndex = Math.max(0, getPreviewPhotos().findIndex((item) => item.id === photo.id));'''
          new_correct = '''        const correctedPhotoSaved = await savePhotoToIndexedDB(photo);\n        if (!correctedPhotoSaved) {\n          throw new Error("看板修正後の写真を端末内へ保存できませんでした");\n        }\n        previewIndex = Math.max(0, getPreviewPhotos().findIndex((item) => item.id === photo.id));'''
          if old_correct not in js:
              raise RuntimeError('correction save flow not found')
          js = js.replace(old_correct, new_correct, 1)

          old_import = '''        await savePhotoToIndexedDB(photo);\n        capturedPhotos.push(photo);\n        previewIndex = capturedPhotos.length - 1;\n        updatePhotoCount();\n\n        session.currentIndex += 1;'''
          new_import = '''        const importedPhotoSaved = await savePhotoToIndexedDB(photo);\n        if (!importedPhotoSaved) {\n          throw new Error("読み込み写真を端末内へ保存できませんでした");\n        }\n        capturedPhotos.push(photo);\n        previewIndex = capturedPhotos.length - 1;\n        updatePhotoCount();\n\n        session.currentIndex += 1;'''
          if old_import not in js:
              raise RuntimeError('import save flow not found')
          js = js.replace(old_import, new_import, 1)

          html = src[:style_open] + '  <link rel="stylesheet" href="./styles/app.css" />\n' + src[style_close + len('  </style>') + 1:]
          script_open2 = html.index('  <script>')
          script_close2 = html.index('  </script>', script_open2)
          html = html[:script_open2] + '  <script src="./js/app.js"></script>\n' + html[script_close2 + len('  </script>') + 1:]
          html = html.replace('<strong id="settingsVersionText">v61</strong>', '<strong id="settingsVersionText">v65.1</strong>', 1)
          html = html.replace('<strong id="settingsVersionText">v64</strong>', '<strong id="settingsVersionText">v65.1</strong>', 1)

          Path('styles').mkdir(exist_ok=True)
          Path('js').mkdir(exist_ok=True)
          Path('styles/app.css').write_text(css, encoding='utf-8')
          Path('js/app.js').write_text(js, encoding='utf-8')
          path.write_text(html, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace('electronic-board-camera-v64', 'electronic-board-camera-v65.1')
          marker = '  "./index.html",\n'
          additions = '  "./styles/app.css",\n  "./js/app.js",\n'
          if './styles/app.css' not in sw_text:
              sw_text = sw_text.replace(marker, marker + additions, 1)
          sw.write_text(sw_text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('# 電子看板カメラ v64', '# 電子看板カメラ v65.1', 1)
          note = '''\n## v65.1 内部整理\n- `main` の v64 を維持したままレビュー枝で整理開始\n- 巨大な `index.html` からCSSと主要JavaScriptを外出し\n- IndexedDB保存失敗時に撮影・看板修正・写真取込を成功扱いしないよう修正\n- Service Workerのキャッシュ対象へ新しいCSS/JSを追加\n- UI、看板、命名規則、操作仕様は変更しない\n'''
          if '## v65.1 内部整理' not in text:
              first_break = text.find('\n', text.find('\n') + 1)
              text = text[:first_break] + note + text[first_break:]
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Verify generated review version
        shell: bash
        run: |
          node --check js/app.js
          test -s styles/app.css
          test -s js/app.js
          grep -q './styles/app.css' index.html
          grep -q './js/app.js' index.html
          grep -q 'v65.1' js/app.js
          grep -q 'v65.1' index.html
          grep -q './styles/app.css' service-worker.js
          grep -q './js/app.js' service-worker.js
          if grep -q '<style>' index.html; then
            echo 'inline style remained' >&2
            exit 1
          fi

      - name: Commit generated v65.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v65-1-refactor.yml
          git add index.html styles/app.css js/app.js service-worker.js README.md
          git commit -m 'v65.1 内部整理 [v65.1-refactor-done]'
          git push origin HEAD:review/v65.1
