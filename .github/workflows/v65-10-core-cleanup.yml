name: v65.10 core cleanup

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.10-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract photo utilities and remove storage aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('js/app.js')
          s=app_path.read_text(encoding='utf-8')

          start=s.find('    function updatePhotoCount() {')
          end=s.find('    function showToast(message) {', start)
          if start < 0 or end < 0: raise SystemExit('photo utility markers not found')
          block=s[start:end]
          Path('js/photo-utils.js').write_text('''/*\n * v65.10 Photo Utilities\n * 写真件数、撮影区分、試料No.解析、ファイル名生成、保存写真読込を担当。\n */\n\n'''+block,encoding='utf-8')
          s=s[:start]+s[end:]

          aliases='''    const savePhotoToIndexedDB = (photo) => PhotoStore.savePhoto(photo);\n    const deletePhotoFromIndexedDB = (photoId) => PhotoStore.deletePhoto(photoId);\n    const saveImportSession = (session) => PhotoStore.saveImportSession(session);\n    const loadImportSession = () => PhotoStore.loadImportSession();\n    const deleteImportSession = () => PhotoStore.deleteImportSession();\n\n'''
          if aliases not in s: raise SystemExit('storage alias block not found')
          s=s.replace(aliases,'',1)
          s=s.replace('const APP_VERSION = "v65.9";', 'const APP_VERSION = "v65.10";',1)
          app_path.write_text(s,encoding='utf-8')

          replacements={
            'savePhotoToIndexedDB(':'PhotoStore.savePhoto(',
            'deletePhotoFromIndexedDB(':'PhotoStore.deletePhoto(',
            'saveImportSession(':'PhotoStore.saveImportSession(',
            'loadImportSession(':'PhotoStore.loadImportSession(',
            'deleteImportSession(':'PhotoStore.deleteImportSession('
          }
          for fname in ['camera.js','photo-import.js','photo-viewer.js','board.js','photo-utils.js']:
              p=Path('js/'+fname)
              text=p.read_text(encoding='utf-8')
              for old,new in replacements.items(): text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.9<','id="settingsVersionText">v65.10<',1)
          old='<script src="./js/app.js"></script>\n  <script src="./js/board.js"></script>'
          if old not in h: raise SystemExit('photo-utils insertion point not found')
          h=h.replace(old,'<script src="./js/app.js"></script>\n  <script src="./js/photo-utils.js"></script>\n  <script src="./js/board.js"></script>',1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.9','electronic-board-camera-v65.10')
          if './js/photo-utils.js' not in w:
              w=w.replace('  "./js/app.js",','  "./js/app.js",\n  "./js/photo-utils.js",',1)
          sw.write_text(w,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.9$', '# 電子看板カメラ v65.10', r, count=1, flags=re.M)
          if '## v65.10 共通写真処理整理' not in r:
              r += '\n## v65.10 共通写真処理整理\n- 写真件数、区分、試料No.解析、ファイル名生成、保存写真読込を `js/photo-utils.js` へ分離\n- IndexedDBの薄い中継関数を廃止し、各モジュールから `PhotoStore` を直接利用\n- `app.js` は起動・共有状態・共通UI中心へ縮小\n- UI・ファイル名規則・保存仕様は変更なし\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify cleanup
        run: |
          for f in js/photo-store.js js/settings.js js/app.js js/photo-utils.js js/board.js js/camera.js js/photo-import.js js/photo-viewer.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          names=['photo-store.js','settings.js','app.js','photo-utils.js','board.js','camera.js','photo-import.js','photo-viewer.js']
          files={n:Path('js/'+n).read_text(encoding='utf-8') for n in names}
          app=files['app.js']; util=files['photo-utils.js']
          html=Path('index.html').read_text(encoding='utf-8'); sw=Path('service-worker.js').read_text(encoding='utf-8')
          required=['updatePhotoCount','getStatusLabel','getCurrentPhotoType','getStatusCode','parseSampleAndPoint','normalizeFullWidthText','generatePhotoFileName','loadPhotosFromIndexedDB']
          for n in required:
              pat=r'^\s*(?:async\s+)?function\s+'+re.escape(n)+r'\s*\('
              if re.search(pat,app,re.M): raise SystemExit('photo utility remains in app.js: '+n)
              if not re.search(pat,util,re.M): raise SystemExit('photo utility missing: '+n)
          aliases=['savePhotoToIndexedDB','deletePhotoFromIndexedDB','saveImportSession','loadImportSession','deleteImportSession']
          combined='\n'.join(files.values())
          for alias in aliases:
              if re.search(r'(?<!\.)\b'+alias+r'\b',combined): raise SystemExit('legacy storage alias remains: '+alias)
          order=['./js/photo-store.js','./js/settings.js','./js/app.js','./js/photo-utils.js','./js/board.js','./js/camera.js','./js/photo-import.js','./js/photo-viewer.js']
          pos=[html.find(x) for x in order]
          if any(x<0 for x in pos) or pos != sorted(pos): raise SystemExit('script order invalid: '+str(pos))
          if './js/photo-utils.js' not in sw: raise SystemExit('photo-utils missing from SW cache')
          if 'v65.10' not in app or 'v65.10' not in html or 'v65.10' not in sw: raise SystemExit('version mismatch')
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('missing onclick functions: '+', '.join(missing))
          print('v65.10 verification OK')
          PY
      - name: Commit v65.10
        run: |
          rm .github/workflows/v65-10-core-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.10 共通写真処理を整理 [v65.10-done]"
          git push origin HEAD:review/v65.1
