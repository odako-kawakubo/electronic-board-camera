name: v65.12 structure audit v2

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[v65.12-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit and safe cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_paths = [Path('js/app.js'),Path('js/settings.js'),Path('js/photo-store.js'),Path('js/photo-utils.js'),Path('js/board.js'),Path('js/camera.js'),Path('js/photo-import.js'),Path('js/photo-viewer.js')]
          texts = {p.name:p.read_text(encoding='utf-8') for p in js_paths}
          app_path=Path('js/app.js')
          app=texts['app.js']

          # Safe formatting only. samplingLocationInput is retained because audit proved external references exist.
          app=app.replace('      setupBoardEditHistoryTracking();\n    setupBoardEditForm();\n      setupReliableBoardEditControls();','      setupBoardEditHistoryTracking();\n      setupBoardEditForm();\n      setupReliableBoardEditControls();')
          app=re.sub(r'/\*\*\n\s*\n(\s*\*[^\n]+)\n\s*\n(\s*\*/)',r'/**\n\1\n\2',app)

          marker='    const APP_VERSION = "v65.11";'
          if marker not in app: raise SystemExit('version marker missing')
          app=app.replace(marker,'    // ============================================================\n    // アプリ共通定数\n    // 複数モジュールから参照されるため、現段階では app.js が正本。\n    // ============================================================\n    const APP_VERSION = "v65.12";',1)

          dom_marker='    const cameraScreen = document.getElementById("cameraScreen");'
          app=app.replace(dom_marker,'    // ============================================================\n    // 共有DOM参照\n    // classic script間で共有。所属移動は依存確認後に行う。\n    // ============================================================\n'+dom_marker,1)
          state_marker='    let currentStream = null;'
          app=app.replace(state_marker,'    // ============================================================\n    // 共有実行状態\n    // camera / board / import / viewer から直接参照されるものがある。\n    // v65.12では依存を可視化し、無理な移動はしない。\n    // ============================================================\n'+state_marker,1)
          init_marker='    document.addEventListener("DOMContentLoaded", async () => {'
          app=app.replace(init_marker,'    // ============================================================\n    // アプリ起動・全体イベント\n    // 初期化順序には依存があるため、順番変更時は実機確認必須。\n    // ============================================================\n'+init_marker,1)
          app_path.write_text(app,encoding='utf-8')
          texts['app.js']=app

          # Top-level declaration dependency audit.
          decl=[]
          for m in re.finditer(r'^\s*(?:const|let)\s+([A-Za-z_$][\w$]*)\b',app,re.M):
              if m.group(1) not in decl: decl.append(m.group(1))
          rows=[]
          for name in decl:
              users=[]; total=0
              for fname,text in texts.items():
                  c=len(re.findall(r'\b'+re.escape(name)+r'\b',text))
                  if c: users.append(f'{fname}({c})'); total+=c
              external=[u.split('(')[0] for u in users if not u.startswith('app.js(')]
              if total==1: status='未使用候補'
              elif len(set(external))==1: status='単一機能へ移動候補'
              elif len(set(external))>=2: status='共有維持候補'
              else: status='app.js内のみ'
              rows.append((name,status,', '.join(users)))

          report=['# v65.12 残構造監査\n','## 結論\n','機能関数の分割は進んでいるが、`app.js` には共有DOM参照・共有状態・共通定数が残る。classic scriptの共有スコープを使っているため、担当が明確に見えても単純移動は危険。v65.12では依存関係を可視化し、安全な整形だけ実施した。\n','## 今回実際に整理したもの\n','- `setupBoardEditForm()` のインデントずれを修正。\n','- 主要JSDocの余分な空行を整理。\n','- `app.js` を「共通定数 / 共有DOM / 共有状態 / 起動イベント」に区画化。\n','## 監査で分かったこと\n','- `samplingLocationInput` は `null` 固定だが、宣言以外にも参照があるため削除しない。名前だけで未使用と判断しない。\n','- カメラ・ビューア・取込・看板の状態は担当モジュールが明確でも相互参照がある。\n','- `APP_DATA` の件名・住所は現在テスト用初期値。OneDrive/SharePoint案件連携時の置換対象。\n','## app.js トップレベル宣言の使用先\n','| 名前 | 判定 | 使用ファイル(出現回数) |\n|---|---|---|\n']
          for name,status,users in rows: report.append(f'| `{name}` | {status} | {users} |\n')
          report += ['\n## 次の整理候補\n','1. 単一機能へ移動候補は、呼出元を確認して1つずつ移す。\n','2. 複数モジュール共有状態は `AppState` 等の明示的な共有窓口を設計してから整理する。\n','3. `APP_DATA` は案件連携実装時に固定値から案件データへ置換する。\n','4. CSSの歴史的override層は別工程で所有関係を確認してから整理する。\n']
          Path('docs/v65.12-structure-audit.md').write_text(''.join(report),encoding='utf-8')

          idx=Path('index.html'); h=idx.read_text(encoding='utf-8').replace('id="settingsVersionText">v65.11<','id="settingsVersionText">v65.12<',1); idx.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js'); w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.11','electronic-board-camera-v65.12'); sw.write_text(w,encoding='utf-8')
          readme=Path('README.md'); r=readme.read_text(encoding='utf-8'); r=re.sub(r'^# 電子看板カメラ v65\.11$','# 電子看板カメラ v65.12',r,count=1,flags=re.M)
          if '## v65.12 残構造監査' not in r:
              r += '\n## v65.12 残構造監査\n- 機能追加なしで `app.js` の残構造と各モジュール依存を監査\n- 初期化インデント/JSDoc整形、`app.js` の責務区画を整理\n- `docs/v65.12-structure-audit.md` に共有状態・定数・DOM参照の使用先を記録\n- `samplingLocationInput` は外部参照があるため残し、誤削除を回避\n- 共有状態は無理に移動せず、次段階の安全な整理候補として明示\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify
        run: |
          for f in js/photo-store.js js/settings.js js/app.js js/photo-utils.js js/board.js js/camera.js js/photo-import.js js/photo-viewer.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8'); sw=Path('service-worker.js').read_text(encoding='utf-8'); app=Path('js/app.js').read_text(encoding='utf-8')
          combined='\n'.join(p.read_text(encoding='utf-8') for p in Path('js').glob('*.js'))
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('missing onclick functions: '+', '.join(missing))
          if 'samplingLocationInput' not in combined: raise SystemExit('samplingLocationInput unexpectedly removed')
          if '      setupBoardEditForm();' not in app: raise SystemExit('indent not fixed')
          if 'v65.12' not in app or 'v65.12' not in html or 'v65.12' not in sw: raise SystemExit('version mismatch')
          if not Path('docs/v65.12-structure-audit.md').exists(): raise SystemExit('audit report missing')
          print('v65.12 verification OK')
          PY
      - name: Commit
        run: |
          rm .github/workflows/v65-12-structure-audit-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.12 残構造を監査・整理 [v65.12-done]"
          git push origin HEAD:review/v65.1
