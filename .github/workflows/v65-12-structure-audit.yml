name: v65.12 structure audit

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[v65.12-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit and safe cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_paths = [
              Path('js/app.js'), Path('js/settings.js'), Path('js/photo-store.js'),
              Path('js/photo-utils.js'), Path('js/board.js'), Path('js/camera.js'),
              Path('js/photo-import.js'), Path('js/photo-viewer.js')
          ]
          texts = {p.name: p.read_text(encoding='utf-8') for p in js_paths}
          app_path = Path('js/app.js')
          app = texts['app.js']

          # 1) Proven dead declaration only: remove when the identifier occurs exactly once across all JS.
          all_js = '\n'.join(texts.values())
          dead_candidates = ['samplingLocationInput']
          removed = []
          for name in dead_candidates:
              count = len(re.findall(r'\b' + re.escape(name) + r'\b', all_js))
              if count == 1:
                  app, n = re.subn(r'^\s*const\s+' + re.escape(name) + r'\s*=.*?;\s*\n', '', app, count=1, flags=re.M)
                  if n:
                      removed.append(name)
              else:
                  raise SystemExit(f'{name} expected single-use dead declaration, found {count}')

          # 2) Formatting cleanup discovered during comment review.
          app = app.replace('      setupBoardEditHistoryTracking();\n    setupBoardEditForm();\n      setupReliableBoardEditControls();',
                            '      setupBoardEditHistoryTracking();\n      setupBoardEditForm();\n      setupReliableBoardEditControls();')

          # Normalize excessive blank lines inside generated JSDoc blocks without touching logic.
          app = re.sub(r'/\*\*\n\s*\n(\s*\*[^\n]+)\n\s*\n(\s*\*/)', r'/**\n\1\n\2', app)

          # 3) Make app.js sections explicit so a future maintainer can see what remains here.
          marker = '    const APP_VERSION = "v65.11";'
          if marker not in app:
              raise SystemExit('APP_VERSION marker missing')
          app = app.replace(marker,
              '    // ============================================================\n'
              '    // アプリ共通定数\n'
              '    // 複数モジュールから参照されるため、現段階では app.js が正本。\n'
              '    // ============================================================\n'
              '    const APP_VERSION = "v65.12";', 1)

          dom_marker = '    const cameraScreen = document.getElementById("cameraScreen");'
          if dom_marker not in app: raise SystemExit('DOM marker missing')
          app = app.replace(dom_marker,
              '    // ============================================================\n'
              '    // 共有DOM参照\n'
              '    // classic script間で共有している。所属移動は依存監査後に行う。\n'
              '    // ============================================================\n'
              + dom_marker, 1)

          state_marker = '    let currentStream = null;'
          if state_marker not in app: raise SystemExit('state marker missing')
          app = app.replace(state_marker,
              '    // ============================================================\n'
              '    // 共有実行状態\n'
              '    // camera / board / import / viewer から直接参照されるものがある。\n'
              '    // v65.12では依存関係を可視化し、無理な移動はしない。\n'
              '    // ============================================================\n'
              + state_marker, 1)

          init_marker = '    document.addEventListener("DOMContentLoaded", async () => {'
          if init_marker not in app: raise SystemExit('init marker missing')
          app = app.replace(init_marker,
              '    // ============================================================\n'
              '    // アプリ起動・全体イベント\n'
              '    // 初期化順序には依存関係があるため、順番変更時は実機確認必須。\n'
              '    // ============================================================\n'
              + init_marker, 1)

          app_path.write_text(app, encoding='utf-8')
          texts['app.js'] = app

          # 4) Dependency audit for top-level declarations in app.js.
          decl_names = []
          for m in re.finditer(r'^\s*(?:const|let)\s+([A-Za-z_$][\w$]*)\b', app, re.M):
              name = m.group(1)
              if name not in decl_names:
                  decl_names.append(name)

          rows = []
          single_owner = []
          shared = []
          unused = []
          for name in decl_names:
              users = []
              total = 0
              for fname, text in texts.items():
                  c = len(re.findall(r'\b' + re.escape(name) + r'\b', text))
                  if c:
                      users.append(f'{fname}({c})')
                      total += c
              # Declaration itself is one use in app.js.
              external_files = [u.split('(')[0] for u in users if not u.startswith('app.js(')]
              if total == 1:
                  unused.append(name)
                  status = '未使用候補'
              elif len(set(external_files)) == 1:
                  single_owner.append((name, external_files[0]))
                  status = '単一機能へ移動候補'
              elif len(set(external_files)) >= 2:
                  shared.append(name)
                  status = '共有維持候補'
              else:
                  status = 'app.js内のみ'
              rows.append((name, status, ', '.join(users)))

          report = []
          report.append('# v65.12 残構造監査\n')
          report.append('## 結論\n')
          report.append('v65.11で機能関数のモジュール分割は完了しているが、`app.js` には共有DOM参照・共有状態・共通定数が残る。classic scriptの共有スコープを利用しているため、使用先を確認せずに状態を各ファイルへ移すと挙動を壊す可能性がある。v65.12では、証明できる未使用残骸だけ削除し、残りは依存関係を可視化した。\n')
          report.append('## 今回実際に掃除したもの\n')
          report.append('- `samplingLocationInput = null`：全JSで宣言以外の参照がないことを確認して削除。\n')
          report.append('- `setupBoardEditForm()` のインデントずれを修正。\n')
          report.append('- 主要JSDocの余分な空行を整理。\n')
          report.append('- `app.js` を「共通定数 / 共有DOM / 共有状態 / 起動イベント」に区画化。\n')
          report.append('## 今回あえて動かしていないもの\n')
          report.append('- `currentStream` 等のカメラ状態\n- `previewIndex` 等のビューア状態\n- `activeImportSession` 等の取込状態\n- `boardState` / 編集履歴等の看板状態\n')
          report.append('これらは担当モジュールが明確でも、別モジュールから直接参照されるものがある。次に移す場合は、状態アクセスのAPI化または名前空間化を先に設計する。\n')
          report.append('## APP_DATAについて\n')
          report.append('現在の件名・住所はテスト用初期値として残っている。将来OneDrive/SharePointの案件読込を実装するときに置き換える対象であり、v65.12では挙動変更を避けて値は変更していない。\n')
          report.append('## app.js トップレベル宣言の使用先\n')
          report.append('| 名前 | 判定 | 使用ファイル(出現回数) |\n|---|---|---|\n')
          for name, status, users in rows:
              report.append(f'| `{name}` | {status} | {users} |\n')
          report.append('\n## 次の整理候補\n')
          report.append('1. 単一機能へ移動候補を1つずつ実機確認しながら移す。\n2. 複数モジュール共有状態は、単純移動ではなく `AppState` 等の明示的な共有窓口を検討する。\n3. `APP_DATA` は案件連携実装時に固定テスト値から案件データへ置換する。\n4. CSSの歴史的override層は別工程で所有関係を確認してから整理する。\n')
          Path('docs/v65.12-structure-audit.md').write_text(''.join(report), encoding='utf-8')

          # Version markers and documentation.
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8').replace('id="settingsVersionText">v65.11<','id="settingsVersionText">v65.12<',1)
          idx.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.11','electronic-board-camera-v65.12')
          sw.write_text(w,encoding='utf-8')
          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.11$', '# 電子看板カメラ v65.12', r, count=1, flags=re.M)
          if '## v65.12 残構造監査' not in r:
              r += '\n## v65.12 残構造監査\n- 機能追加なしで `app.js` の残構造と各モジュール依存を監査\n- 参照ゼロの旧 `samplingLocationInput` を削除\n- 初期化インデント/JSDoc整形、`app.js` の責務区画を整理\n- `docs/v65.12-structure-audit.md` に共有状態・定数・DOM参照の使用先を記録\n- 共有状態は無理に移動せず、次段階の安全な整理候補として明示\n'
          readme.write_text(r,encoding='utf-8')

          print('removed:', removed)
          print('unused candidates after cleanup:', unused)
          print('single-owner candidates:', len(single_owner))
          print('shared candidates:', len(shared))
          PY
      - name: Verify behavior-preserving cleanup
        run: |
          for f in js/photo-store.js js/settings.js js/app.js js/photo-utils.js js/board.js js/camera.js js/photo-import.js js/photo-viewer.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          files=[p.read_text(encoding='utf-8') for p in Path('js').glob('*.js')]
          combined='\n'.join(files)
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', combined, re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"', html):
              onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(', body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('missing onclick functions: '+', '.join(missing))
          app=Path('js/app.js').read_text(encoding='utf-8')
          if 'samplingLocationInput' in combined: raise SystemExit('dead samplingLocationInput remains')
          if '    setupBoardEditForm();' not in app: raise SystemExit('setupBoardEditForm indent not normalized')
          if 'v65.12' not in app or 'v65.12' not in html or 'v65.12' not in sw: raise SystemExit('version mismatch')
          if not Path('docs/v65.12-structure-audit.md').exists(): raise SystemExit('audit report missing')
          print('v65.12 verification OK')
          PY
      - name: Commit v65.12
        run: |
          rm .github/workflows/v65-12-structure-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.12 残構造を監査・整理 [v65.12-done]"
          git push origin HEAD:review/v65.1
