name: v65.13 module ownership cleanup

on:
  push:
    branches: [ review/v65.1 ]

permissions:
  contents: write

jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[v65.13-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
          fetch-depth: 0

      - name: Run v2 refactor steps with corrected verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/v65-13-module-ownership-v2.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          blocks = []
          i = 0
          while i < len(lines):
            if lines[i].strip() == 'run: |':
              i += 1
              block = []
              while i < len(lines):
                line = lines[i]
                if line == '':
                  block.append('')
                  i += 1
                  continue
                if line.startswith('          '):
                  block.append(line[10:])
                  i += 1
                  continue
                break
              blocks.append('\n'.join(block))
              continue
            i += 1

          if len(blocks) != 3:
            raise SystemExit(f'v2 run block count mismatch: {len(blocks)}')

          # index.htmlには onclick="if (...) ..." がある。ifは関数ではないので検証対象外。
          blocks[1] = blocks[1].replace(
            "const missing = [...new Set(onclickNames.filter(n => !functions.has(n)))];",
            "const missing = [...new Set(onclickNames.filter(n => n !== 'if' && !functions.has(n)))];"
          )

          for index, block in enumerate(blocks, 1):
            print(f'--- running v2 block {index} ---')
            subprocess.run(block, shell=True, executable='/bin/bash', check=True)
          PY
