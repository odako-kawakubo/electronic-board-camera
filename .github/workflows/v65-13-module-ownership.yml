name: v65.13 module ownership cleanup

on:
  push:
    branches: [ review/v65.1 ]

permissions:
  contents: write

jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[v65.13-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
          fetch-depth: 0

      - name: Move single-owner declarations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')

          moves = {
            'js/settings.js': [
              '    const APP_VERSION = "v65.12";\n',
              '    const PHOTO_QUALITY_STORAGE_KEY = "electronic-board-camera-photo-quality";\n',
              '    const BOARD_TEXT_SIZE_STORAGE_KEY = "electronic-board-camera-board-text-size";\n',
              '    const BOARD_FIELD_TEXT_SIZE_STORAGE_KEY = "electronic-board-camera-board-field-text-size-v1";\n',
              '    const settingsOverlay = document.getElementById("settingsOverlay");\n',
              '    const qualityStandardButton = document.getElementById("qualityStandardButton");\n',
              '    const qualityHighButton = document.getElementById("qualityHighButton");\n',
              '    const settingsVersionText = document.getElementById("settingsVersionText");\n',
            ],
            'js/photo-utils.js': [
              '    const DEFAULT_POINT_NO = "1";\n',
            ],
            'js/photo-import.js': [
              '    const launchModeOverlay = document.getElementById("launchModeOverlay");\n',
              '    const launchResumePanel = document.getElementById("launchResumePanel");\n',
              '    const launchResumeMeta = document.getElementById("launchResumeMeta");\n',
              '    const importPhotoInput = document.getElementById("importPhotoInput");\n',
              '    const importProgressBadge = document.getElementById("importProgressBadge");\n',
              '    const importBoardPositionLabel = document.getElementById("importBoardPositionLabel");\n',
              '    let activeImportSession = null;\n',
              '    let activeImportBaseDataUrl = "";\n',
              '    let isImportBoardEdit = false;\n',
            ],
            'js/photo-viewer.js': [
              '    const previewImage = document.getElementById("previewImage");\n',
              '    const photoZoomOverlay = document.getElementById("photoZoomOverlay");\n',
              '    const photoZoomImage = document.getElementById("photoZoomImage");\n',
              '    const previewCounter = document.getElementById("previewCounter");\n',
              '    const caseSelectButton = document.getElementById("caseSelectButton");\n',
              '    const casePickerOverlay = document.getElementById("casePickerOverlay");\n',
              '    const casePickerList = document.getElementById("casePickerList");\n',
              '    const previewMeta = document.getElementById("previewMeta");\n',
              '    const previewThumbnails = document.getElementById("previewThumbnails");\n',
              '    const previewList = document.getElementById("previewList");\n',
              '    const previewSortButton = document.getElementById("previewSortButton");\n',
              '    const boardCorrectionButton = document.getElementById("boardCorrectionButton");\n',
              '    const selectAllButton = document.getElementById("selectAllButton");\n',
              '    let isPreviewListMode = false;\n',
              '    let previewSortMode = "shooting";\n',
              '    let selectedCaseSubject = "";\n',
              '    let isBoardCorrectionSelectMode = false;\n',
              '    let previewTouchStartX = 0;\n',
              '    let previewTouchStartY = 0;\n',
            ],
            'js/camera.js': [
              '    const video = document.getElementById("video");\n',
              '    const captureFreezeImage = document.getElementById("captureFreezeImage");\n',
              '    const cameraFlash = document.getElementById("cameraFlash");\n',
              '    const captureReviewOverlay = document.getElementById("captureReviewOverlay");\n',
              '    const captureReviewImage = document.getElementById("captureReviewImage");\n',
              '    const cameraGuide = document.getElementById("cameraGuide");\n',
              '    const startButton = document.getElementById("startButton");\n',
              '    const viewButton = document.getElementById("viewButton");\n',
              '    const sectionButton = document.getElementById("sectionButton");\n',
              '    const shootButton = document.getElementById("shootButton");\n',
              '    const sectionModeBadge = document.getElementById("sectionModeBadge");\n',
              '    let isTakingPhoto = false;\n',
              '    let captureReviewResolver = null;\n',
            ],
            'js/board.js': [
              '    const BOARD_FORM_STORAGE_KEY = "electronic-board-camera-board-form-v1";\n',
              '    const SAMPLING_NAME_HISTORY_STORAGE_KEY = "electronic-board-camera-sampling-name-history-v1";\n',
              '    const samplingNameHistoryList = document.getElementById("samplingNameHistoryList");\n',
              '    const boardCanvasPreview = document.getElementById("boardCanvasPreview");\n',
              '    const boardEditCanvas = document.getElementById("boardEditCanvas");\n',
              '    const boardEditSubject = document.getElementById("boardEditSubject");\n',
              '    const boardEditAddress = document.getElementById("boardEditAddress");\n',
              '    const boardEditRoom = document.getElementById("boardEditRoom");\n',
              '    const boardEditSample = document.getElementById("boardEditSample");\n',
              '    const boardEditDate = document.getElementById("boardEditDate");\n',
              '    const boardEditStatus = document.getElementById("boardEditStatus");\n',
              '    const boardEditModeSelect = document.getElementById("boardEditModeSelect");\n',
              '    const boardEditRoomLabel = document.getElementById("boardEditRoomLabel");\n',
              '    const boardEditSelectedFieldLabel = document.getElementById("boardEditSelectedFieldLabel");\n',
              '    const statusButtons = Array.from(document.querySelectorAll(".status-btn"));\n',
              '    const boardEditModeBadge = document.getElementById("boardEditModeBadge");\n',
              '    const editBoardModeButton = document.getElementById("editBoardModeButton");\n',
              '    const boardEditResetButton = document.getElementById("boardEditResetButton");\n',
              '    const samplingLocationInput = null;\n',
              '    const panelMainButtons = Array.from(document.querySelectorAll(".panel-main-button"));\n',
              '    const sidePanels = {\n      room: document.getElementById("roomPanel"),\n      sample: document.getElementById("samplePanel"),\n      board: document.getElementById("boardPanel")\n    };\n',
              '    const roomLabelCell = document.getElementById("roomLabelCell");\n',
              '    const roomValueCell = document.getElementById("roomValueCell");\n',
              '    const visualStatusButton = document.getElementById("visualStatusButton");\n',
              '    let hasInitializedBoard = false;\n',
              '    let lastBoardTapAt = 0;\n',
              '    let isBoardEditMode = false;\n',
              '    let boardEditHistory = [];\n',
              '    let boardEditHistoryIndex = -1;\n',
              '    let isApplyingBoardHistory = false;\n',
              '    let boardEditHistoryTimer = null;\n',
              '    let boardEditDraft = null;\n',
              '    let boardEditSelectedField = "subject";\n',
              '    let boardEditRenderQueued = false;\n',
              '    let boardEditRenderToken = 0;\n',
              '    let boardEditIsComposing = false;\n',
              '    let boardEditFinishRequested = false;\n',
            ],
          }

          def insert_after_header(path, block):
            text = path.read_text(encoding='utf-8')
            marker = ' */\n'
            pos = text.find(marker)
            if pos < 0:
              raise SystemExit(f'header end not found: {path}')
            pos += len(marker)
            return text[:pos] + '\n    // v65.13: このモジュールだけが所有する定数・DOM参照・実行状態。\n' + block + '\n' + text[pos:]

          for target, declarations in moves.items():
            for declaration in declarations:
              count = app.count(declaration)
              if count != 1:
                raise SystemExit(f'app declaration mismatch {target}: {declaration.strip()} count={count}')
              app = app.replace(declaration, '', 1)
            block = ''.join(declarations)
            p = Path(target)
            p.write_text(insert_after_header(p, block), encoding='utf-8')

          app = app.replace('const APP_VERSION = "v65.12";', 'const APP_VERSION = "v65.13";') if 'const APP_VERSION = "v65.12";' in app else app
          # APP_VERSION moved to settings.js, so update it there instead.
          settings = Path('js/settings.js')
          s = settings.read_text(encoding='utf-8').replace('const APP_VERSION = "v65.12";', 'const APP_VERSION = "v65.13";')
          settings.write_text(s, encoding='utf-8')

          # Remove now-empty import-state comment from app.js if left behind.
          app = app.replace('    // 既存写真取込の編集中状態。元画像はセッション中だけ保持し、完了時に一時データを破棄する。\n\n', '')
          app_path.write_text(app, encoding='utf-8')

          # version markers
          index = Path('index.html')
          index.write_text(index.read_text(encoding='utf-8').replace('v65.12', 'v65.13'), encoding='utf-8')
          sw = Path('service-worker.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.12', 'electronic-board-camera-v65.13'), encoding='utf-8')
          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8').replace('# 電子看板カメラ v65.12', '# 電子看板カメラ v65.13', 1)
          note = '''\n## v65.13 モジュール所有整理\n- 機能追加なし。単一モジュールからしか使われないDOM参照・定数・実行状態を担当ファイルへ移動。\n- `currentStream`、`capturedPhotos`、`previewIndex`、看板入力値など複数機能で共有する状態はapp.jsに維持。\n- 保存方式・IndexedDB構造・OneDrive・Service Worker挙動は変更しない。\n'''
          if '## v65.13 モジュール所有整理' not in r:
            r += note
          readme.write_text(r, encoding='utf-8')

          audit = Path('docs/v65.13-module-ownership.md')
          audit.write_text('''# v65.13 モジュール所有整理\n\n## 目的\n`app.js` に残っていた宣言のうち、実際の利用先が1機能に限定されるものだけを担当モジュールへ移す。機能・保存方式・UIは変更しない。\n\n## 移動した責務\n- `settings.js`: APP_VERSION、設定用localStorageキー、設定画面DOM\n- `photo-utils.js`: DEFAULT_POINT_NO\n- `photo-import.js`: 起動画面/取込DOM、取込セッション実行状態\n- `photo-viewer.js`: ビューア専用DOM、一覧表示/並び/ケース選択の状態\n- `camera.js`: カメラ専用DOM、撮影中/撮影確認resolver\n- `board.js`: 看板専用localStorageキー、看板編集DOM、看板編集履歴/描画状態\n\n## app.jsに残したもの\n複数モジュールから直接参照される共有状態は移動していない。特に `currentStream`、`capturedPhotos`、`previewIndex`、`selectedStatus`、`isSectionMode`、`boardMode`、看板入力DOMは現状維持。これらは将来、単純移動ではなく共有状態APIを設計してから扱う。\n\n## 今回触っていないもの\n- IndexedDB保存方式\n- 写真Base64/Blob形式\n- OneDrive同期\n- Service Workerの挙動（キャッシュ名の版数更新のみ）\n- UI/操作仕様\n''', encoding='utf-8')
          PY

      - name: Static validation
        shell: bash
        run: |
          for f in js/*.js; do node --check "$f"; done
          node - <<'NODE'
          const fs = require('fs');
          const files = ['js/photo-store.js','js/settings.js','js/app.js','js/photo-utils.js','js/board.js','js/camera.js','js/photo-import.js','js/photo-viewer.js'];
          const texts = Object.fromEntries(files.map(f => [f, fs.readFileSync(f,'utf8')]));
          const all = Object.values(texts).join('\n');
          const moved = [
            'APP_VERSION','PHOTO_QUALITY_STORAGE_KEY','BOARD_TEXT_SIZE_STORAGE_KEY','BOARD_FIELD_TEXT_SIZE_STORAGE_KEY',
            'launchModeOverlay','activeImportSession','previewImage','isPreviewListMode','video','isTakingPhoto',
            'BOARD_FORM_STORAGE_KEY','samplingNameHistoryList','boardEditCanvas','hasInitializedBoard'
          ];
          for (const name of moved) {
            if (new RegExp(`\\b(?:const|let)\\s+${name}\\b`).test(texts['js/app.js'])) throw new Error(`${name} still declared in app.js`);
            const decls = (all.match(new RegExp(`\\b(?:const|let)\\s+${name}\\b`, 'g')) || []).length;
            if (decls !== 1) throw new Error(`${name} declaration count ${decls}`);
          }
          for (const name of ['currentStream','capturedPhotos','previewIndex','selectedStatus','isSectionMode','boardMode']) {
            if (!new RegExp(`\\b(?:const|let)\\s+${name}\\b`).test(texts['js/app.js'])) throw new Error(`${name} must remain shared in app.js`);
          }
          if (!texts['js/settings.js'].includes('const APP_VERSION = "v65.13";')) throw new Error('APP_VERSION not v65.13');
          if (!fs.readFileSync('service-worker.js','utf8').includes('electronic-board-camera-v65.13')) throw new Error('SW version mismatch');
          if (!fs.existsSync('docs/v65.13-module-ownership.md')) throw new Error('audit doc missing');

          const html = fs.readFileSync('index.html','utf8');
          const onclickNames = [...html.matchAll(/onclick="([A-Za-z_$][\w$]*)\s*\(/g)].map(m => m[1]);
          const functions = new Set([...all.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m => m[1]));
          const missing = [...new Set(onclickNames.filter(n => !functions.has(n)))];
          if (missing.length) throw new Error(`missing onclick functions: ${missing.join(', ')}`);
          NODE

      - name: Commit result and remove workflow
        shell: bash
        run: |
          rm .github/workflows/v65-13-module-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.13 モジュール所有を整理 [v65.13-done]"
          git push origin HEAD:review/v65.1
