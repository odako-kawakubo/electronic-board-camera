name: v65.2 review analysis

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[v65.2-analysis-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - name: Analyze dead code candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('js/app.js').read_text(encoding='utf-8')
          ids = set(re.findall(r'id="([^"]+)"', html))
          dom_refs = re.findall(r'document\.getElementById\("([^"]+)"\)', js)
          missing = sorted(set(dom_refs) - ids)
          funcs = re.findall(r'^\s*function\s+([A-Za-z_$][\w$]*)\s*\(', js, re.M)
          dup = sorted({f for f in funcs if funcs.count(f) > 1})
          counts = []
          for f in sorted(set(funcs)):
              c = len(re.findall(r'\b' + re.escape(f) + r'\b', js + '\n' + html))
              if c <= 1:
                  counts.append((f,c))
          consts = re.findall(r'^\s*const\s+([A-Za-z_$][\w$]*)\s*=\s*document\.getElementById\(', js, re.M)
          dead_consts=[]
          for c in consts:
              n=len(re.findall(r'\b'+re.escape(c)+r'\b', js))
              if n <= 1:
                  dead_consts.append((c,n))
          lines=[]
          lines.append('# v65.2 静的解析結果')
          lines.append('')
          lines.append(f'- HTML IDs: {len(ids)}')
          lines.append(f'- getElementById refs: {len(dom_refs)}')
          lines.append(f'- function definitions: {len(funcs)} / unique {len(set(funcs))}')
          lines.append('')
          lines.append('## HTMLに存在しないDOM参照')
          lines.extend([f'- {x}' for x in missing] or ['- なし'])
          lines.append('')
          lines.append('## 重複関数定義')
          lines.extend([f'- {x}' for x in dup] or ['- なし'])
          lines.append('')
          lines.append('## 定義以外の参照が確認できない関数候補')
          lines.extend([f'- {x} (references={c})' for x,c in counts] or ['- なし'])
          lines.append('')
          lines.append('## DOM定数で宣言以外の参照が確認できない候補')
          lines.extend([f'- {x} (references={c})' for x,c in dead_consts] or ['- なし'])
          Path('docs/v65.2-static-analysis.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
      - name: Commit analysis and remove temporary workflow
        run: |
          rm .github/workflows/v65-2-analyze.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v65.2-static-analysis.md .github/workflows/v65-2-analyze.yml
          git commit -m "v65.2 静的解析 [v65.2-analysis-done]"
          git push origin HEAD:review/v65.1
