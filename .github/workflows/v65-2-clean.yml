name: v65.2 safe cleanup

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[v65.2-clean-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove proven dead functions and first duplicate loadImage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/app.js')
          s=p.read_text(encoding='utf-8')

          def function_ranges(text, name):
              out=[]
              pat=re.compile(r'(^\s*(?:async\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{)', re.M)
              for m in pat.finditer(text):
                  start=m.start()
                  brace=text.find('{', m.start(), m.end())
                  depth=0
                  i=brace
                  quote=None
                  esc=False
                  line=False
                  block=False
                  while i < len(text):
                      ch=text[i]; nxt=text[i+1] if i+1<len(text) else ''
                      if line:
                          if ch=='\n': line=False
                      elif block:
                          if ch=='*' and nxt=='/': block=False; i+=1
                      elif quote:
                          if esc: esc=False
                          elif ch=='\\': esc=True
                          elif ch==quote: quote=None
                      else:
                          if ch=='/' and nxt=='/': line=True; i+=1
                          elif ch=='/' and nxt=='*': block=True; i+=1
                          elif ch in ('"', "'", '`'): quote=ch
                          elif ch=='{': depth+=1
                          elif ch=='}':
                              depth-=1
                              if depth==0:
                                  end=i+1
                                  while end<len(text) and text[end] in ' \t': end+=1
                                  if end<len(text) and text[end]=='\n': end+=1
                                  out.append((start,end))
                                  break
                      i+=1
              return out

          dead=[
            'adjustBoardFieldTextSize','applyBoardEditDraft','drawWrappedLeftText',
            'formatFileDate','setBoardTextSize','setupBoardGesture',
            'setupBoardTextAreaCentering','shouldUseLegacyBoardCapture',
            'toggleBoardMode','togglePreviewListMode'
          ]

          removals=[]
          for name in dead:
              rs=function_ranges(s,name)
              if len(rs)!=1:
                  raise SystemExit(f'{name}: expected 1 definition, got {len(rs)}')
              removals.append((*rs[0],name))

          loads=function_ranges(s,'loadImage')
          if len(loads)!=2:
              raise SystemExit(f'loadImage: expected 2 definitions, got {len(loads)}')
          removals.append((*loads[0],'loadImage:first-duplicate'))

          for a,b,name in sorted(removals, reverse=True):
              s=s[:a]+s[b:]

          s=s.replace('const APP_VERSION = "v65.1";', 'const APP_VERSION = "v65.2";', 1)
          p.write_text(s, encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8').replace('id="settingsVersionText">v65.1<','id="settingsVersionText">v65.2<',1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.1','electronic-board-camera-v65.2')
          sw.write_text(w,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.1$', '# 電子看板カメラ v65.2', r, count=1, flags=re.M)
          if '## v65.2 内部整理' not in r:
              r += '\n## v65.2 内部整理\n- 旧 v49 `script.js` を削除\n- 重複していた `loadImage()` の旧定義を削除\n- HTML/JSから参照されない旧関数10件を削除\n- 現行挙動は変更せず、残骸整理のみ実施\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify syntax and HTML onclick targets
        run: |
          node --check js/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('js/app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          funcs=set(re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', js, re.M))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"', html):
              onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(', body)
          builtins={'if'}
          missing=sorted({x for x in onclick if x not in funcs and x not in builtins})
          if missing:
              raise SystemExit('Missing onclick functions: '+', '.join(missing))
          defs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', js, re.M)
          dup=sorted({f for f in defs if defs.count(f)>1})
          if dup:
              raise SystemExit('Duplicate function definitions remain: '+', '.join(dup))
          if 'v65.2' not in js or 'v65.2' not in html or 'v65.2' not in Path('service-worker.js').read_text(encoding='utf-8'):
              raise SystemExit('Version markers not updated')
          print(f'functions={len(defs)} unique={len(set(defs))} onclick targets OK')
          PY
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/v65-2-clean.yml
          rm -f docs/v65.2-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.2 残骸・重複整理 [v65.2-clean-done]"
          git push origin HEAD:review/v65.1
