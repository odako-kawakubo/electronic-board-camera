name: v65.4 photo store extraction

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.4-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract IndexedDB storage layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('js/app.js')
          s=app_path.read_text(encoding='utf-8')

          # Storage constants/state now belong to photo-store.js.
          for line in [
            '    const DB_NAME = "electronic-board-camera-prototype";\n',
            '    const DB_VERSION = 2;\n',
            '    const DB_STORE_NAME = "photos";\n',
            '    const IMPORT_SESSION_STORE_NAME = "importSessions";\n',
            '    const ACTIVE_IMPORT_SESSION_ID = "active";\n',
            '    let dbInstance = null;\n',
          ]:
              s=s.replace(line,'',1)

          def remove_function(text,name):
              pat=re.compile(r'(^\s*(?:async\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{)',re.M)
              m=pat.search(text)
              if not m:
                  raise SystemExit(f'function not found: {name}')
              start=m.start(); brace=text.find('{',m.start(),m.end())
              depth=0; i=brace; quote=None; esc=False; line=False; block=False
              while i<len(text):
                  ch=text[i]; nxt=text[i+1] if i+1<len(text) else ''
                  if line:
                      if ch=='\n': line=False
                  elif block:
                      if ch=='*' and nxt=='/': block=False; i+=1
                  elif quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch=='/' and nxt=='/': line=True; i+=1
                      elif ch=='/' and nxt=='*': block=True; i+=1
                      elif ch in ('"',"'",'`'): quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              end=i+1
                              while end<len(text) and text[end] in ' \t': end+=1
                              if end<len(text) and text[end]=='\n': end+=1
                              return text[:start]+text[end:]
                  i+=1
              raise SystemExit(f'unclosed function: {name}')

          for name in ['openPhotoDB','savePhotoToIndexedDB','deletePhotoFromIndexedDB','saveImportSession','loadImportSession','deleteImportSession']:
              s=remove_function(s,name)

          # loadPhotosFromIndexedDB remains UI orchestration, but delegates raw read.
          old='''        const db = await openPhotoDB();\n        if (!db) return;\n\n        const photos = await new Promise((resolve, reject) => {\n          const transaction = db.transaction(DB_STORE_NAME, "readonly");\n          const store = transaction.objectStore(DB_STORE_NAME);\n          const request = store.getAll();\n\n          request.onsuccess = () => resolve(request.result || []);\n          request.onerror = () => reject(request.error);\n        });'''
          new='''        const photos = await PhotoStore.getAllPhotos();'''
          if old not in s:
              raise SystemExit('loadPhotosFromIndexedDB storage block not found')
          s=s.replace(old,new,1)

          # Existing call names remain through tiny aliases, minimizing feature-code changes.
          alias='''\n    const savePhotoToIndexedDB = (photo) => PhotoStore.savePhoto(photo);\n    const deletePhotoFromIndexedDB = (photoId) => PhotoStore.deletePhoto(photoId);\n    const saveImportSession = (session) => PhotoStore.saveImportSession(session);\n    const loadImportSession = () => PhotoStore.loadImportSession();\n    const deleteImportSession = () => PhotoStore.deleteImportSession();\n\n'''
          marker='    const capturedPhotos = [];\n'
          if marker not in s: raise SystemExit('alias insertion marker not found')
          s=s.replace(marker,marker+alias,1)

          s=s.replace('const APP_VERSION = "v65.3";', 'const APP_VERSION = "v65.4";',1)
          app_path.write_text(s,encoding='utf-8')

          store='''(function () {\n  "use strict";\n\n  const DB_NAME = "electronic-board-camera-prototype";\n  const DB_VERSION = 2;\n  const PHOTO_STORE_NAME = "photos";\n  const IMPORT_SESSION_STORE_NAME = "importSessions";\n  const ACTIVE_IMPORT_SESSION_ID = "active";\n\n  let dbInstance = null;\n\n  function openDB() {\n    return new Promise((resolve, reject) => {\n      if (!("indexedDB" in window)) {\n        reject(new Error("IndexedDBを利用できません"));\n        return;\n      }\n      if (dbInstance) {\n        resolve(dbInstance);\n        return;\n      }\n      const request = indexedDB.open(DB_NAME, DB_VERSION);\n      request.onupgradeneeded = (event) => {\n        const db = event.target.result;\n        if (!db.objectStoreNames.contains(PHOTO_STORE_NAME)) {\n          db.createObjectStore(PHOTO_STORE_NAME, { keyPath: "id" });\n        }\n        if (!db.objectStoreNames.contains(IMPORT_SESSION_STORE_NAME)) {\n          db.createObjectStore(IMPORT_SESSION_STORE_NAME, { keyPath: "id" });\n        }\n      };\n      request.onsuccess = () => {\n        dbInstance = request.result;\n        dbInstance.onversionchange = () => {\n          dbInstance.close();\n          dbInstance = null;\n        };\n        resolve(dbInstance);\n      };\n      request.onerror = () => reject(request.error || new Error("IndexedDBを開けませんでした"));\n    });\n  }\n\n  async function getAllPhotos() {\n    const db = await openDB();\n    return new Promise((resolve, reject) => {\n      const tx = db.transaction(PHOTO_STORE_NAME, "readonly");\n      const req = tx.objectStore(PHOTO_STORE_NAME).getAll();\n      req.onsuccess = () => resolve(req.result || []);\n      req.onerror = () => reject(req.error);\n      tx.onabort = () => reject(tx.error || new Error("写真読込を中断しました"));\n    });\n  }\n\n  async function savePhoto(photo) {\n    try {\n      const db = await openDB();\n      await new Promise((resolve, reject) => {\n        const tx = db.transaction(PHOTO_STORE_NAME, "readwrite");\n        const req = tx.objectStore(PHOTO_STORE_NAME).put(photo);\n        tx.oncomplete = () => resolve();\n        req.onerror = () => reject(req.error);\n        tx.onerror = () => reject(tx.error);\n        tx.onabort = () => reject(tx.error || new Error("IndexedDB transaction aborted"));\n      });\n      return true;\n    } catch (error) {\n      console.error("写真の端末内保存に失敗しました", error);\n      return false;\n    }\n  }\n\n  async function deletePhoto(photoId) {\n    const db = await openDB();\n    await new Promise((resolve, reject) => {\n      const tx = db.transaction(PHOTO_STORE_NAME, "readwrite");\n      const req = tx.objectStore(PHOTO_STORE_NAME).delete(photoId);\n      tx.oncomplete = () => resolve();\n      req.onerror = () => reject(req.error);\n      tx.onerror = () => reject(tx.error);\n      tx.onabort = () => reject(tx.error || new Error("写真削除を中断しました"));\n    });\n  }\n\n  async function saveImportSession(session) {\n    const db = await openDB();\n    await new Promise((resolve, reject) => {\n      const tx = db.transaction(IMPORT_SESSION_STORE_NAME, "readwrite");\n      tx.objectStore(IMPORT_SESSION_STORE_NAME).put(session);\n      tx.oncomplete = () => resolve();\n      tx.onerror = () => reject(tx.error);\n      tx.onabort = () => reject(tx.error || new Error("一時保存を中断しました"));\n    });\n  }\n\n  async function loadImportSession() {\n    try {\n      const db = await openDB();\n      if (!db.objectStoreNames.contains(IMPORT_SESSION_STORE_NAME)) return null;\n      return await new Promise((resolve, reject) => {\n        const tx = db.transaction(IMPORT_SESSION_STORE_NAME, "readonly");\n        const req = tx.objectStore(IMPORT_SESSION_STORE_NAME).get(ACTIVE_IMPORT_SESSION_ID);\n        req.onsuccess = () => resolve(req.result || null);\n        req.onerror = () => reject(req.error);\n        tx.onabort = () => reject(tx.error || new Error("一時データ読込を中断しました"));\n      });\n    } catch (error) {\n      console.error("編集中写真の読込に失敗しました", error);\n      return null;\n    }\n  }\n\n  async function deleteImportSession() {\n    try {\n      const db = await openDB();\n      if (!db.objectStoreNames.contains(IMPORT_SESSION_STORE_NAME)) return;\n      await new Promise((resolve, reject) => {\n        const tx = db.transaction(IMPORT_SESSION_STORE_NAME, "readwrite");\n        const req = tx.objectStore(IMPORT_SESSION_STORE_NAME).delete(ACTIVE_IMPORT_SESSION_ID);\n        tx.oncomplete = () => resolve();\n        req.onerror = () => reject(req.error);\n        tx.onerror = () => reject(tx.error);\n        tx.onabort = () => reject(tx.error || new Error("一時データ削除を中断しました"));\n      });\n    } catch (error) {\n      console.error("編集中写真の削除に失敗しました", error);\n    }\n  }\n\n  window.PhotoStore = Object.freeze({\n    getAllPhotos,\n    savePhoto,\n    deletePhoto,\n    saveImportSession,\n    loadImportSession,\n    deleteImportSession\n  });\n})();\n'''
          Path('js/photo-store.js').write_text(store,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.3<','id="settingsVersionText">v65.4<',1)
          old_script='<script src="./js/app.js"></script>'
          if old_script not in h: raise SystemExit('app script tag not found')
          h=h.replace(old_script,'<script src="./js/photo-store.js"></script>\n  <script src="./js/app.js"></script>',1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.3','electronic-board-camera-v65.4')
          if './js/photo-store.js' not in w:
              w=w.replace('  "./js/app.js",','  "./js/photo-store.js",\n  "./js/app.js",',1)
          sw.write_text(w,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.3$', '# 電子看板カメラ v65.4', r, count=1, flags=re.M)
          if '## v65.4 保存層分離' not in r:
              r += '\n## v65.4 保存層分離\n- IndexedDBの写真/読込セッション操作を `js/photo-store.js` へ分離\n- `app.js` はUI・撮影フロー側の責務へ寄せる\n- DB名/バージョン/ストア名/接続状態を保存層へ集約\n- 既存の呼び出し名は薄い別名で維持し、挙動変更を抑制\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify extraction
        run: |
          node --check js/photo-store.js
          node --check js/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('js/app.js').read_text(encoding='utf-8')
          store=Path('js/photo-store.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          forbidden=['function openPhotoDB','DB_NAME =','DB_VERSION =','IMPORT_SESSION_STORE_NAME =','let dbInstance']
          bad=[x for x in forbidden if x in app]
          if bad: raise SystemExit('storage internals remain in app.js: '+', '.join(bad))
          required=['getAllPhotos','savePhoto','deletePhoto','saveImportSession','loadImportSession','deleteImportSession']
          if any(x not in store for x in required): raise SystemExit('photo-store API incomplete')
          if html.find('./js/photo-store.js') > html.find('./js/app.js'): raise SystemExit('photo-store must load before app.js')
          if './js/photo-store.js' not in sw: raise SystemExit('photo-store missing from service worker cache')
          if 'v65.4' not in app or 'v65.4' not in html or 'v65.4' not in sw: raise SystemExit('version marker mismatch')
          # Validate inline onclick targets against normal and async function declarations.
          funcs=set(re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',app,re.M))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('Missing onclick functions: '+', '.join(missing))
          print('v65.4 verification OK')
          PY
      - name: Commit v65.4
        run: |
          rm .github/workflows/v65-4-photo-store.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.4 IndexedDB保存層を分離 [v65.4-done]"
          git push origin HEAD:review/v65.1
