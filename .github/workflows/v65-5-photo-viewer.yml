name: v65.5 photo viewer extraction

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.5-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract photo viewer section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('js/app.js')
          s=app_path.read_text(encoding='utf-8')
          start_marker='    function getCurrentSubjectName() {'
          end_marker='    function updatePhotoCount() {'
          start=s.find(start_marker)
          end=s.find(end_marker)
          if start<0 or end<0 or end<=start:
              raise SystemExit('photo viewer section markers not found')

          block=s[start:end]
          viewer='''/*\n * v65.5 Photo Viewer\n * 写真の案件別表示、プレビュー、選択、並び順、保存/共有、削除、看板修正導線を担当。\n */\n\n'''+block
          Path('js/photo-viewer.js').write_text(viewer,encoding='utf-8')
          s=s[:start]+s[end:]
          s=s.replace('const APP_VERSION = "v65.4";', 'const APP_VERSION = "v65.5";',1)
          app_path.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.4<','id="settingsVersionText">v65.5<',1)
          old='<script src="./js/app.js"></script>'
          if old not in h: raise SystemExit('app.js script tag not found')
          h=h.replace(old,'<script src="./js/app.js"></script>\n  <script src="./js/photo-viewer.js"></script>',1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.4','electronic-board-camera-v65.5')
          if './js/photo-viewer.js' not in w:
              w=w.replace('  "./js/app.js",','  "./js/app.js",\n  "./js/photo-viewer.js",',1)
          sw.write_text(w,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.4$', '# 電子看板カメラ v65.5', r, count=1, flags=re.M)
          if '## v65.5 写真ビュー分離' not in r:
              r += '\n## v65.5 写真ビュー分離\n- 写真案件管理・プレビュー・サムネイル/一覧・選択・並び順を `js/photo-viewer.js` へ分離\n- 保存/共有・削除・写真拡大・看板修正導線も写真ビュー側へ集約\n- 撮影処理・看板描画本体は `app.js` に維持\n- UIと操作仕様は変更なし\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify extraction
        run: |
          node --check js/app.js
          node --check js/photo-viewer.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('js/app.js').read_text(encoding='utf-8')
          viewer=Path('js/photo-viewer.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          required=['getPreviewPhotos','openPreview','renderPreview','renderThumbnails','renderPhotoList','saveCurrentPreviewPhoto','deleteSelectedPreviewPhotos','setupPreviewImageTap']
          for name in required:
              if name not in viewer: raise SystemExit('viewer function missing: '+name)
          if 'function getCurrentSubjectName()' in app: raise SystemExit('viewer section still remains in app.js')
          if html.find('./js/app.js') > html.find('./js/photo-viewer.js'): raise SystemExit('photo-viewer load order invalid')
          if './js/photo-viewer.js' not in sw: raise SystemExit('photo-viewer missing from cache')
          combined=app+'\n'+viewer
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('Duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('Missing onclick functions: '+', '.join(missing))
          if 'v65.5' not in app or 'v65.5' not in html or 'v65.5' not in sw: raise SystemExit('version mismatch')
          print('v65.5 verification OK')
          PY
      - name: Commit v65.5
        run: |
          rm .github/workflows/v65-5-photo-viewer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.5 写真ビュー処理を分離 [v65.5-done]"
          git push origin HEAD:review/v65.1
