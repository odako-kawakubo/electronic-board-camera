name: v65.6 photo import extraction

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.6-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract photo import section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('js/app.js')
          s=app_path.read_text(encoding='utf-8')
          start_marker='    /* =========================================================\n     * v62: 既存写真へ看板を付ける機能'
          end_marker='    /* キャンバス上に看板を描画 */'
          start=s.find(start_marker)
          end=s.find(end_marker)
          if start<0 or end<0 or end<=start:
              raise SystemExit('photo import section markers not found')

          block=s[start:end]
          module='''/*\n * v65.6 Photo Import\n * 既存写真の複数選択、編集セッション、再開/破棄、1枚ずつの看板付与を担当。\n */\n\n'''+block
          Path('js/photo-import.js').write_text(module,encoding='utf-8')
          s=s[:start]+s[end:]
          s=s.replace('const APP_VERSION = "v65.5";', 'const APP_VERSION = "v65.6";',1)
          app_path.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.5<','id="settingsVersionText">v65.6<',1)
          old='<script src="./js/app.js"></script>\n  <script src="./js/photo-viewer.js"></script>'
          if old not in h: raise SystemExit('script sequence not found')
          h=h.replace(old,'<script src="./js/app.js"></script>\n  <script src="./js/photo-import.js"></script>\n  <script src="./js/photo-viewer.js"></script>',1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.5','electronic-board-camera-v65.6')
          if './js/photo-import.js' not in w:
              w=w.replace('  "./js/app.js",','  "./js/app.js",\n  "./js/photo-import.js",',1)
          sw.write_text(w,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.5$', '# 電子看板カメラ v65.6', r, count=1, flags=re.M)
          if '## v65.6 写真取込分離' not in r:
              r += '\n## v65.6 写真取込分離\n- 既存写真の複数選択・取込開始を `js/photo-import.js` へ分離\n- IndexedDB一時セッションの再開/破棄・進捗管理を同モジュールへ集約\n- 1枚ずつの看板編集・保存・次写真への引継ぎを取込フローとして分離\n- カメラ撮影と看板描画本体は `app.js` に維持\n- UIと操作仕様は変更なし\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify extraction
        run: |
          node --check js/app.js
          node --check js/photo-import.js
          node --check js/photo-viewer.js
          node --check js/photo-store.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('js/app.js').read_text(encoding='utf-8')
          imp=Path('js/photo-import.js').read_text(encoding='utf-8')
          viewer=Path('js/photo-viewer.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          required=['chooseCameraMode','chooseImportMode','setupImportPhotoInput','startImportSession','resumeImportSession','discardImportSession','refreshImportResumePanel','openCurrentImportedPhoto','finishImportedPhotoBoardEdit','completeImportSession','normalizeImportedImageToDataUrl','cycleImportBoardPosition','updateImportBoardPositionLabel']
          for name in required:
              if name not in imp: raise SystemExit('import function missing: '+name)
          if 'v62: 既存写真へ看板を付ける機能' in app: raise SystemExit('import section remains in app.js')
          order=[html.find('./js/photo-store.js'),html.find('./js/app.js'),html.find('./js/photo-import.js'),html.find('./js/photo-viewer.js')]
          if min(order)<0 or order!=sorted(order): raise SystemExit('script load order invalid')
          if './js/photo-import.js' not in sw: raise SystemExit('photo-import missing from cache')
          combined=app+'\n'+imp+'\n'+viewer
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('Duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('Missing onclick functions: '+', '.join(missing))
          if 'v65.6' not in app or 'v65.6' not in html or 'v65.6' not in sw: raise SystemExit('version mismatch')
          print('v65.6 verification OK')
          PY
      - name: Commit v65.6
        run: |
          rm .github/workflows/v65-6-photo-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.6 既存写真取込処理を分離 [v65.6-done]"
          git push origin HEAD:review/v65.1
