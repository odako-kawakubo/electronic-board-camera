name: v65.7 camera extraction

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.7-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract camera sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/app.js')
          s=p.read_text(encoding='utf-8')

          def cut(text, start_marker, end_marker):
              a=text.find(start_marker)
              if a < 0: raise SystemExit('start marker not found: '+start_marker)
              b=text.find(end_marker, a)
              if b < 0: raise SystemExit('end marker not found: '+end_marker)
              return text[:a]+text[b:], text[a:b]

          blocks=[]

          # Camera lifecycle, section mode, resume and takePhoto.
          s, block = cut(
              s,
              '    async function startCamera() {',
              '    function setupBoardPersistence() {'
          )
          blocks.append(block)

          # Capture confirmation overlay.
          s, block = cut(
              s,
              '    function showCaptureReview(dataUrl) {',
              '    async function renderBoardElementToCanvas(element) {'
          )
          blocks.append(block)

          # Camera flash/still + image capture/composition pipeline.
          s, block = cut(
              s,
              '    function runCameraFlash() {',
              '    function updatePhotoCount() {'
          )
          blocks.append(block)

          camera='''/*\n * v65.7 Camera\n * カメラ起動・復帰・断面モード・撮影・撮影確認・画像生成を担当。\n * 看板の描画ルール本体 drawBoardOnCanvas() は app.js に残す。\n */\n\n'''+''.join(blocks)
          Path('js/camera.js').write_text(camera, encoding='utf-8')

          s=s.replace('const APP_VERSION = "v65.6";', 'const APP_VERSION = "v65.7";', 1)
          p.write_text(s, encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.6<','id="settingsVersionText">v65.7<',1)
          old='<script src="./js/app.js"></script>'
          if old not in h: raise SystemExit('app.js script tag not found')
          h=h.replace(old, old+'\n  <script src="./js/camera.js"></script>',1)
          idx.write_text(h, encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.6','electronic-board-camera-v65.7')
          if './js/camera.js' not in w:
              w=w.replace('  "./js/app.js",','  "./js/app.js",\n  "./js/camera.js",',1)
          sw.write_text(w, encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.6$', '# 電子看板カメラ v65.7', r, count=1, flags=re.M)
          if '## v65.7 カメラ撮影分離' not in r:
              r += '\n## v65.7 カメラ撮影分離\n- カメラ起動/停止/プレビュー復帰を `js/camera.js` へ分離\n- 断面モード、撮影、撮影直後確認、静止表示、画像生成を同モジュールへ集約\n- 看板描画ルール本体 `drawBoardOnCanvas()` は `app.js` に維持\n- UI・撮影仕様・ファイル名規則は変更なし\n'
          readme.write_text(r, encoding='utf-8')
          PY
      - name: Verify extraction
        run: |
          node --check js/app.js
          node --check js/camera.js
          node --check js/photo-store.js
          node --check js/photo-viewer.js
          node --check js/photo-import.js
          python - <<'PY'
          from pathlib import Path
          import re
          files={name:Path('js/'+name).read_text(encoding='utf-8') for name in ['app.js','camera.js','photo-viewer.js','photo-import.js','photo-store.js']}
          app=files['app.js']; cam=files['camera.js']
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')

          moved=['startCamera','stopCurrentStream','requestFullscreenSafe','showCameraButtons','showStartButton','toggleSectionMode','setSectionMode','resumeCameraAfterPreview','takePhoto','showCaptureReview','closeCaptureReview','acceptCaptureReview','rejectCaptureReview','runCameraFlash','showCapturedStill','hideCapturedStill','delay','captureBaseImage','getBoardDrawRectForCanvas','drawCurrentBoardToCanvas','composeBoardOnBaseImage','loadImage','captureCompositedImage']
          for name in moved:
              pat=r'^\s*(?:async\s+)?function\s+'+re.escape(name)+r'\s*\('
              if re.search(pat, app, re.M): raise SystemExit('camera function remains in app.js: '+name)
              if not re.search(pat, cam, re.M): raise SystemExit('camera function missing: '+name)

          if not re.search(r'^\s*function\s+drawBoardOnCanvas\s*\(', app, re.M):
              raise SystemExit('drawBoardOnCanvas must remain in app.js')

          order=['./js/photo-store.js','./js/app.js','./js/camera.js','./js/photo-viewer.js','./js/photo-import.js']
          pos=[html.find(x) for x in order]
          if any(x < 0 for x in pos) or pos != sorted(pos): raise SystemExit('script order invalid: '+str(pos))
          if './js/camera.js' not in sw: raise SystemExit('camera.js missing from service worker cache')
          if 'v65.7' not in app or 'v65.7' not in html or 'v65.7' not in sw: raise SystemExit('version mismatch')

          combined='\n'.join(files.values())
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('missing onclick functions: '+', '.join(missing))
          print('v65.7 verification OK')
          PY
      - name: Commit v65.7
        run: |
          rm .github/workflows/v65-7-camera.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.7 カメラ撮影処理を分離 [v65.7-done]"
          git push origin HEAD:review/v65.1
