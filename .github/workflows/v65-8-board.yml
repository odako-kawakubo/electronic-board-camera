name: v65.8 board extraction

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.8-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract board sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/app.js')
          s=p.read_text(encoding='utf-8')

          def cut(text, start_marker, end_marker):
              a=text.find(start_marker)
              if a < 0: raise SystemExit('start marker not found: '+start_marker)
              b=text.find(end_marker, a)
              if b < 0: raise SystemExit('end marker not found: '+end_marker)
              return text[:a]+text[b:], text[a:b]

          blocks=[]
          s, block = cut(s, '    function initializeBoard() {', '    function updatePhotoCount() {')
          blocks.append(block)
          s, block = cut(s, '    /* キャンバス上に看板を描画 */', '    function loadPhotoQuality() {')
          blocks.append(block)

          board='''/*\n * v65.8 Board\n * 看板初期化・入力・調査/サンプリング切替・位置/サイズ・編集・描画・履歴を担当。\n * 共有状態は v65.8 では app.js に残し、挙動変更を避ける。\n */\n\n'''+''.join(blocks)
          Path('js/board.js').write_text(board, encoding='utf-8')

          s=s.replace('const APP_VERSION = "v65.7";', 'const APP_VERSION = "v65.8";', 1)
          p.write_text(s, encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.7<','id="settingsVersionText">v65.8<',1)
          old='<script src="./js/app.js"></script>\n  <script src="./js/camera.js"></script>'
          if old not in h: raise SystemExit('script insertion point not found')
          h=h.replace(old,'<script src="./js/app.js"></script>\n  <script src="./js/board.js"></script>\n  <script src="./js/camera.js"></script>',1)
          idx.write_text(h, encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.7','electronic-board-camera-v65.8')
          if './js/board.js' not in w:
              w=w.replace('  "./js/app.js",','  "./js/app.js",\n  "./js/board.js",',1)
          sw.write_text(w, encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.7$', '# 電子看板カメラ v65.8', r, count=1, flags=re.M)
          if '## v65.8 看板処理分離' not in r:
              r += '\n## v65.8 看板処理分離\n- 看板初期化、入力、調査/サンプリング切替、採取箇所操作を `js/board.js` へ分離\n- 看板位置/サイズ、編集、Undo/Redo、Canvas描画を同モジュールへ集約\n- 共有状態は `app.js` に残し、既存モジュールとの挙動を維持\n- UI・看板デザイン・撮影仕様は変更なし\n'
          readme.write_text(r, encoding='utf-8')
          PY
      - name: Verify extraction
        run: |
          node --check js/app.js
          node --check js/board.js
          node --check js/camera.js
          node --check js/photo-store.js
          node --check js/photo-viewer.js
          node --check js/photo-import.js
          python - <<'PY'
          from pathlib import Path
          import re
          names=['app.js','board.js','camera.js','photo-store.js','photo-viewer.js','photo-import.js']
          files={name:Path('js/'+name).read_text(encoding='utf-8') for name in names}
          app=files['app.js']; board=files['board.js']
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')

          required=['initializeBoard','applyBoardMode','setupBoardPersistence','saveBoardForm','openBoardEditMode','closeBoardEditMode','undoBoardEdit','redoBoardEdit','resetBoardEdit','scheduleBoardPreviewRender','renderBoardPreviewCanvas','drawBoardOnCanvas','syncBoardTextAreaVerticalCenter']
          for name in required:
              pat=r'^\s*(?:async\s+)?function\s+'+re.escape(name)+r'\s*\('
              if re.search(pat, app, re.M): raise SystemExit('board function remains in app.js: '+name)
              if not re.search(pat, board, re.M): raise SystemExit('board function missing: '+name)

          order=['./js/photo-store.js','./js/app.js','./js/board.js','./js/camera.js','./js/photo-import.js','./js/photo-viewer.js']
          pos=[html.find(x) for x in order]
          if any(x < 0 for x in pos) or pos != sorted(pos): raise SystemExit('script order invalid: '+str(pos))
          if './js/board.js' not in sw: raise SystemExit('board.js missing from service worker cache')
          if 'v65.8' not in app or 'v65.8' not in html or 'v65.8' not in sw: raise SystemExit('version mismatch')

          combined='\n'.join(files.values())
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('missing onclick functions: '+', '.join(missing))
          print('v65.8 verification OK')
          PY
      - name: Commit v65.8
        run: |
          rm .github/workflows/v65-8-board.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.8 看板処理を分離 [v65.8-done]"
          git push origin HEAD:review/v65.1
