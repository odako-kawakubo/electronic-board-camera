name: v65.9 settings extraction

on:
  push:
    branches:
      - review/v65.1

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[v65.9-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v65.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract settings section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/app.js')
          s=p.read_text(encoding='utf-8')
          a=s.find('    function loadPhotoQuality() {')
          b=s.find('    function showToast(message) {', a)
          if a < 0 or b < 0: raise SystemExit('settings section markers not found')
          block=s[a:b]
          s=s[:a]+s[b:]
          Path('js/settings.js').write_text('''/*\n * v65.9 Settings\n * 画質・看板文字サイズ・設定画面・アプリ更新確認を担当。\n */\n\n'''+block, encoding='utf-8')
          s=s.replace('const APP_VERSION = "v65.8";', 'const APP_VERSION = "v65.9";', 1)
          p.write_text(s, encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('id="settingsVersionText">v65.8<','id="settingsVersionText">v65.9<',1)
          old='<script src="./js/photo-store.js"></script>\n  <script src="./js/app.js"></script>'
          if old not in h: raise SystemExit('script insertion point not found')
          h=h.replace(old,'<script src="./js/photo-store.js"></script>\n  <script src="./js/settings.js"></script>\n  <script src="./js/app.js"></script>',1)
          idx.write_text(h,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('electronic-board-camera-v65.8','electronic-board-camera-v65.9')
          if './js/settings.js' not in w:
              w=w.replace('  "./js/photo-store.js",','  "./js/photo-store.js",\n  "./js/settings.js",',1)
          sw.write_text(w,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          r=re.sub(r'^# 電子看板カメラ v65\.8$', '# 電子看板カメラ v65.9', r, count=1, flags=re.M)
          if '## v65.9 設定処理分離' not in r:
              r += '\n## v65.9 設定処理分離\n- 画質設定、看板文字サイズ設定を `js/settings.js` へ分離\n- 設定画面の開閉、バージョン表示、更新確認/再読込を同モジュールへ集約\n- 初期設定読込のため `settings.js` を `app.js` より先に読込\n- UI・設定値・更新仕様は変更なし\n'
          readme.write_text(r,encoding='utf-8')
          PY
      - name: Verify extraction
        run: |
          for f in js/photo-store.js js/settings.js js/app.js js/board.js js/camera.js js/photo-import.js js/photo-viewer.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import re
          names=['photo-store.js','settings.js','app.js','board.js','camera.js','photo-import.js','photo-viewer.js']
          files={n:Path('js/'+n).read_text(encoding='utf-8') for n in names}
          app=files['app.js']; settings=files['settings.js']
          html=Path('index.html').read_text(encoding='utf-8'); sw=Path('service-worker.js').read_text(encoding='utf-8')
          required=['loadPhotoQuality','setPhotoQuality','renderPhotoQualitySettings','loadBoardFieldTextSizes','saveBoardFieldTextSizes','applyBoardFieldTextSizes','loadBoardTextSize','renderBoardTextSize','setupSettingsToggleButton','toggleSettings','openSettings','closeSettings','renderAppVersion','getLatestAppVersion','checkAppUpdate','forceAppUpdate']
          for n in required:
              pat=r'^\s*(?:async\s+)?function\s+'+re.escape(n)+r'\s*\('
              if re.search(pat,app,re.M): raise SystemExit('settings function remains in app.js: '+n)
              if not re.search(pat,settings,re.M): raise SystemExit('settings function missing: '+n)
          order=['./js/photo-store.js','./js/settings.js','./js/app.js','./js/board.js','./js/camera.js','./js/photo-import.js','./js/photo-viewer.js']
          pos=[html.find(x) for x in order]
          if any(x<0 for x in pos) or pos != sorted(pos): raise SystemExit('script order invalid: '+str(pos))
          if './js/settings.js' not in sw: raise SystemExit('settings.js missing from SW cache')
          if 'v65.9' not in app or 'v65.9' not in html or 'v65.9' not in sw: raise SystemExit('version mismatch')
          combined='\n'.join(files.values())
          funcs=re.findall(r'^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',combined,re.M)
          dup=sorted({f for f in funcs if funcs.count(f)>1})
          if dup: raise SystemExit('duplicate functions: '+', '.join(dup))
          onclick=[]
          for body in re.findall(r'onclick="([^"]+)"',html): onclick += re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',body)
          missing=sorted({x for x in onclick if x not in funcs and x!='if'})
          if missing: raise SystemExit('missing onclick functions: '+', '.join(missing))
          print('v65.9 verification OK')
          PY
      - name: Commit v65.9
        run: |
          rm .github/workflows/v65-9-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v65.9 設定処理を分離 [v65.9-done]"
          git push origin HEAD:review/v65.1
