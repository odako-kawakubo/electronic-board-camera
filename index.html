<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.json" />
  <title>電子看板カメラ</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    #cameraScreen {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0;
    }

    /*
     * 撮影エリア。
     * ここに見えている範囲だけを写真として保存する。
     * 横向きでは中央4:3、右側の黒帯に操作ボタンを置く。
     */


    /* 左黒帯：撮影枚数などの情報表示 */
    .left-panel {
      position: relative;
      z-index: 4;
      width: 92px;
      height: 100dvh;
      flex: 0 0 92px;
      background: #000;
      color: #fff;
      padding: calc(12px + env(safe-area-inset-top)) 8px calc(10px + env(safe-area-inset-bottom));
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .left-panel::-webkit-scrollbar {
      display: none;
    }

    #captureFrame {
      position: relative;
      /* 横向きは4:3撮影エリアを画面内に収める。
       * 左右の黒帯（左92px + 右92px）を差し引き、
       * iPhone/PWAの下見切れ対策として安全側に少し小さくする。
       */
      --capture-safe-h: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 10px);
      --capture-safe-w: calc(100vw - 184px);
      width: min(var(--capture-safe-w), calc(var(--capture-safe-h) * 4 / 3));
      height: min(var(--capture-safe-h), calc(var(--capture-safe-w) * 3 / 4));
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #000;
      flex: 0 0 auto;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #captureFreezeImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 4;
      display: none;
      pointer-events: none;
    }

    #captureFreezeImage.show {
      display: block;
    }

    #cameraFlash {
      position: absolute;
      inset: 0;
      background: #fff;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

    #cameraFlash.flash {
      opacity: 0.92;
      transition: opacity 0.04s ease;
    }

    .control-button:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    #toast.error {
      background: rgba(235, 87, 87, 0.92);
    }

    #cameraGuide {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    .hidden,
    .hidden-control {
      display: none !important;
    }

    /* 撮影枚数表示 */
    #photoCount {
      position: relative;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 7px 6px;
      border-radius: 9px;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 900;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      white-space: pre-line;
      width: 68px;
    }

    #photoCount:active {
      opacity: 0.72;
    }

    .board-control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding-bottom: 4px;
      flex: 0 0 auto;
    }

    .mode-toggle-button,
    .panel-main-button,
    .panel-mini-button,
    .panel-center-button {
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
      color: #fff;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    .mode-toggle-button:active,
    .panel-main-button:active,
    .panel-mini-button:active,
    .panel-center-button:active {
      opacity: 0.72;
    }

    .mode-toggle-button {
      width: 72px;
      min-height: 42px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.15;
      background: linear-gradient(180deg, rgba(47,128,237,0.9), rgba(47,128,237,0.55));
    }

    body.sampling-mode .mode-toggle-button {
      background: linear-gradient(180deg, rgba(39,174,96,0.9), rgba(39,174,96,0.55));
    }

    .panel-main-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .panel-main-button {
      width: 72px;
      min-height: 48px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.15;
    }

    .panel-main-button.active {
      border-color: rgba(242, 201, 76, 0.95);
      box-shadow: 0 0 0 2px rgba(242, 201, 76, 0.25) inset, 0 2px 8px rgba(0,0,0,0.35);
    }

    .panel-expanded {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .panel-expanded.show {
      display: flex;
    }

    .panel-pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .panel-vertical {
      display: grid;
      grid-template-rows: 30px 32px 30px;
      width: 34px;
      gap: 3px;
      justify-items: center;
      align-items: center;
    }

    .panel-mini-button {
      width: 34px;
      height: 30px;
      border-radius: 9px;
      font-size: 16px;
      line-height: 1;
      padding: 0;
    }

    .panel-center-button {
      width: 34px;
      height: 32px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1;
      padding: 0;
      background: rgba(255, 255, 255, 0.2);
    }

    .panel-single {
      width: 44px;
      display: grid;
      grid-template-rows: 32px 38px 32px;
      gap: 5px;
      justify-items: center;
      align-items: center;
    }

    .panel-single .panel-mini-button {
      width: 44px;
      height: 32px;
      font-size: 17px;
    }

    .panel-single .panel-center-button {
      width: 44px;
      height: 38px;
      font-size: 16px;
    }

    .panel-close-button {
      width: 58px;
      min-height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255,255,255,0.92);
      font-size: 11px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
    }

    body.sampling-mode .survey-only {
      display: none !important;
    }

    body:not(.sampling-mode) .sampling-only {
      display: none !important;
    }

    body.sampling-mode #roomLabelCell {
      display: none;
    }

    body.sampling-mode #roomValueCell {
      padding-left: 0;
      padding-right: 0;
      text-align: center;
      vertical-align: middle;
    }

    body.sampling-mode #roomNoInput {
      width: 100%;
      height: 100%;
      text-align: center;
      text-align-last: center;
      padding-left: 0;
      padding-right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 看板レイヤー */
    .board-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    #boardWrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      transform-origin: top left;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      cursor: default;
      will-change: transform;
    }


    /* v50: 表示看板と保存看板を同一Canvas描画に統一する */
    #boardCanvasPreview {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 242px;
      z-index: 8;
      pointer-events: auto;
      display: block;
      background: transparent;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    body:not(.board-editing) #photoBoard {
      visibility: hidden;
    }

    body.board-editing #photoBoard {
      visibility: visible;
    }

    body.board-editing #boardCanvasPreview {
      display: none;
    }


    /* 電子看板：横長長方形 */
    #photoBoard {
      position: relative;
      width: 100%;
      height: 242px;
      padding: 4px;
      box-sizing: border-box;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    /*
     * 細線の二重枠。
     * 外側は #photoBoard の border、内側は表全体の枠で作る。
     */
    #photoBoard::after {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: 5;
      border: 1.5px solid #000;
      pointer-events: none;
    }

    .board-table,
    .inner-table {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .board-table {
      border: none;
    }

    .board-table td,
    .inner-table td {
      border: 1.5px solid #000;
      vertical-align: middle;
      padding: 0;
    }


    /* v45: 入れ子表の外周罫線を消して、内容欄だけ太線に見えるのを防ぐ */
    .inner-table tr:first-child td { border-top: none; }
    .inner-table tr:last-child td { border-bottom: none; }
    .inner-table td:first-child { border-left: none; }
    .inner-table td:last-child { border-right: none; }

    .row-subject {
      height: 52px;
    }

    .row-place {
      height: 40px;
    }

    .row-content {
      height: 96px;
    }

    .row-date {
      height: 42px;
    }

    .label-cell {
      width: 78px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .content-label-cell {
      width: 78px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .value-cell {
      padding: 4px 5px;
    }

    .board-value-cell {
      padding: 0 6px;
    }

    .textarea-center-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .subject-text {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.25;
      word-break: break-word;
    }

    .address-text {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-all;
    }

    .board-editable {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: #000;
      font-family: inherit;
      padding: 0;
      margin: 0;
      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-break: strict;
      appearance: none;
      -webkit-appearance: none;
    }

    textarea.board-editable {
      display: block;
      text-align-last: center;
      scrollbar-width: none;
      box-sizing: border-box;
    }

    textarea.board-editable::-webkit-scrollbar {
      display: none;
    }


    .textarea-center-wrap textarea.board-editable {
      height: 100%;
      line-height: 1.25;
      padding-left: 0;
      padding-right: 0;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      align-items: center;
    }

    /* v45: 件名・採取場所のtextareaを同じ仕組みで上下中央に見せる */
    .subject-textarea,
    .address-textarea {
      display: block;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .subject-textarea {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.25;
    }

    .address-textarea {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
    }

    #boardWrap.text-small .subject-textarea {
      font-size: 16px;
    }

    #boardWrap.text-small .address-textarea {
      font-size: 15px;
    }

    #boardWrap.text-small #roomNoInput {
      font-size: 21px;
    }

    #boardWrap.text-large .subject-textarea {
      font-size: 20px;
    }

    #boardWrap.text-large .address-textarea {
      font-size: 19px;
    }

    #boardWrap.text-large #roomNoInput {
      font-size: 27px;
    }

    .inner-label {
      /* 確定設定：No.セル「少し広」 */
      width: 120px;
      padding: 4px 5px 4px 12px;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
      text-align: left;
      border-right: none !important;
    }

    .inner-value {
      border-left: none !important;
      /* 確定設定：値位置「右」 */
      padding: 0 6px 0 48px;
    }

    .board-input {
      width: 100%;
      height: 28px;
      border: none;
      outline: none;
      background: transparent;
      color: #000;
      font-size: 24px;
      font-weight: 900;
      font-family: inherit;
      text-align: left;
      padding: 0;
    }

    .status-cell {
      padding: 3px 4px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      width: 100%;
      height: 34px;
      flex-wrap: nowrap;
    }

    .status-btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      color: #000;
      font-size: 15px;
      font-weight: 900;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
    }

    .status-box {
      display: inline-block;
      min-width: 1em;
      text-align: center;
      font-size: 1.05em;
      line-height: 1;
    }

    .date-cell {
      text-align: center;
      padding: 0 6px;
    }

    .date-text {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    /* 操作パネル：横向きでは右黒帯に縦並び */
    .controls {
      position: relative !important;
      z-index: 9999 !important;
      width: 92px !important;
      height: 100dvh !important;
      flex: 0 0 92px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 12px !important;
      padding: calc(10px + env(safe-area-inset-top)) 8px calc(10px + env(safe-area-inset-bottom)) !important;
      margin: 0 !important;
      pointer-events: auto !important;
      background: #000;
    }

    .control-button {
      border: none;
      border-radius: 999px;
      width: 64px;
      min-height: 82px;
      padding: 12px 8px;
      font-size: 18px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    .btn-start {
      background: #2f80ed;
      color: #fff;
    }

    .btn-view {
      background: #f2c94c;
      color: #000;
      min-width: 80px;
    }

    .btn-shoot {
      background: #fff;
      color: #000;
      min-width: 92px;
    }

    .btn-section {
      background: #eb5757;
      color: #fff;
      min-width: 80px;
    }

    .btn-section.active {
      background: #fff;
      color: #eb5757;
      box-shadow: 0 0 0 3px #eb5757 inset, 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .btn-mode {
      background: #27ae60;
      color: #fff;
      min-width: 80px;
      font-size: 17px;
    }

    body:not(.sampling-mode) .btn-mode {
      background: #2f80ed;
    }


    .controls .control-button {
      min-width: 64px;
    }

    #sectionModeBadge {
      position: absolute;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      background: rgba(235, 87, 87, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      pointer-events: none;
    }

    #sectionModeBadge.show {
      display: block;
    }

    body.section-mode #boardWrap {
      display: none;
    }

    /* プレビュー画面 */
    #previewOverlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
      touch-action: pan-y;
    }

    #previewOverlay.show {
      display: flex;
    }

    #previewCounter {
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 10px;
      min-height: 24px;
    }

    #previewImageWrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #previewImage {
      width: min(100%, calc((100dvh - 168px) * 4 / 3));
      max-width: 100%;
      max-height: calc(100dvh - 168px);
      object-fit: contain;
      background: #111;
      border: 1px solid #333;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: pan-y;
    }

    #previewMeta {
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      margin-top: 8px;
      min-height: 18px;
      text-align: center;
      word-break: break-all;
    }

    #previewThumbnails {
      width: 100%;
      max-width: 720px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 4px 2px;
      -webkit-overflow-scrolling: touch;
    }

    #previewOverlay.list-mode #previewImageWrap,
    #previewOverlay.list-mode #previewMeta,
    #previewOverlay.list-mode #previewThumbnails {
      display: none;
    }

    #previewOverlay.list-mode {
      justify-content: flex-start;
      overflow: hidden;
    }

    #previewOverlay.list-mode #previewCounter {
      flex: 0 0 auto;
      margin-bottom: 8px;
    }

    #previewOverlay.list-mode .preview-controls {
      flex: 0 0 auto;
    }

    #previewOverlay.list-mode #previewList {
      display: grid;
    }

    #previewList {
      width: 100%;
      max-width: 980px;
      height: calc(100dvh - 118px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      flex: 0 0 auto;
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: calc(100dvh - 176px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      align-content: start;
      gap: 12px;
      overflow-y: auto;
      padding: 6px 4px 18px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .photo-list-item {
      position: relative;
      border: 2px solid #333;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      color: #fff;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font-family: inherit;
    }

    .photo-list-item.current {
      border-color: #f2c94c;
    }

    .photo-list-item.selected {
      border-color: #27ae60;
    }

    .photo-list-item {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .photo-list-item img {
      width: 100%;
      height: auto;
      flex: 1 1 auto;
      min-height: 0;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .photo-list-info {
      flex: 0 0 auto;
      padding: 5px 7px 7px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-all;
      max-height: 42px;
      overflow: hidden;
    }

    .photo-list-status {
      color: #f2c94c;
      margin-bottom: 2px;
    }

    .thumb-item {
      position: relative;
      flex: 0 0 auto;
      width: 74px;
      height: 56px;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      cursor: pointer;
    }

    .thumb-item.current {

    function changeRoomNumber(part, delta) {
      if (boardMode === "sampling") {
        promptRoomNo();

      roomNoInput.value = incrementNumberInText(roomNoInput.value, part === "floor" ? "first" : "last", delta);
      saveBoardForm();
      showToast(part === "floor" ? "階を変更しました" : "部屋を変更しました");
    }

    function incrementNumberInText(value, target, delta) {
      const text = String(value || "1");
      const matches = Array.from(text.matchAll(/\d+/g));

      if (!matches.length) {
        return String(Math.max(1, 1 + delta));
      }

      const match = target === "first" ? matches[0] : matches[matches.length - 1];
      const current = Number(match[0]);
      const next = Math.max(1, current + delta);

      return text.slice(0, match.index) + String(next) + text.slice(match.index + match[0].length);
    }

    function changeSampleNo(delta) {
      const parts = parseSampleDisplayValue(sampleNoInput.value);
      parts.sampleNo = Math.max(1, parts.sampleNo + delta);
      sampleNoInput.value = formatSampleDisplayValue(parts.sampleNo, parts.pointNo);
      saveBoardForm();
      showToast("検体No.を変更しました");
    }

    function changePointNo(delta) {
      const parts = parseSampleDisplayValue(sampleNoInput.value);
      parts.pointNo = Math.max(1, parts.pointNo + delta);
      sampleNoInput.value = formatSampleDisplayValue(parts.sampleNo, parts.pointNo);
      saveBoardForm();

    function parseSampleDisplayValue(value) {
      const parsed = parseSampleAndPoint(value || POINT_DISPLAY_DEFAULT);
      return {
        sampleNo: Number(parsed.sampleNo) || 1,
        pointNo: Number(parsed.pointNo) || 1
      };
    }

    function formatSampleDisplayValue(sampleNo, pointNo) {
      return `${sampleNo}-${toCircledNumber(pointNo)}`;

    function toCircledNumber(value) {
      const circles = ["", "①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩", "⑪", "⑫", "⑬", "⑭", "⑮", "⑯", "⑰", "⑱", "⑲", "⑳"];
      return circles[value] || String(value);
    }

    function applyBoardTransform() {

    function placeBoardByFixedPosition() {
      const screen = getScreenSize();
      const base = getBoardBaseSize();
      const margin = 4;

      boardState.sizeRatio = clamp(boardState.sizeRatio, boardState.minSizeRatio, boardState.maxSizeRatio);
      const targetWidth = screen.width * boardState.sizeRatio;
      boardState.scale = clamp(targetWidth / base.width, boardState.minScale, boardState.maxScale);

      const boardWidth = base.width * boardState.scale;
      const boardHeight = base.height * boardState.scale;
      const maxX = Math.max(margin, screen.width - boardWidth - margin);
      const maxY = Math.max(margin, screen.height - boardHeight - margin);

      switch (boardState.position) {
        case "top-left":
          boardState.x = margin;
          boardState.y = margin;
          break;
        case "top-right":
          boardState.x = maxX;
          boardState.y = margin;
          break;
        case "bottom-right":
          boardState.x = maxX;
          boardState.y = maxY;
          break;
        case "bottom-left":
        default:
          boardState.x = margin;
          boardState.y = maxY;
          break;
      }

      applyBoardTransform();
      syncBoardTextareas();
      scheduleBoardPreviewRender();
    }

    function cycleBoardPosition() {

    function renderBoardEditCanvas() {
      if (!boardEditCanvas || !boardEditDraft) return;
      const wrap = boardEditCanvas.parentElement;
      const cssWidth = Math.max(1, Math.round(wrap.clientWidth || 780));
      const cssHeight = Math.max(1, Math.round(wrap.clientHeight || cssWidth * 242 / 390));
      const ratio = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      boardEditCanvas.width = Math.round(cssWidth * ratio);
      boardEditCanvas.height = Math.round(cssHeight * ratio);
      boardEditCanvas.style.width = `${cssWidth}px`;
      boardEditCanvas.style.height = `${cssHeight}px`;
      const ctx = boardEditCanvas.getContext("2d");
      ctx.clearRect(0, 0, boardEditCanvas.width, boardEditCanvas.height);
      drawBoardOnCanvas(ctx, 0, 0, boardEditCanvas.width, boardEditCanvas.height, readBoardEditForm());
    }

    function syncBoardTextareas() {
      const targets = [subjectText, addressText, samplingLocationInput].filter(Boolean);

      targets.forEach((textarea) => {
        if (!textarea || textarea.tagName !== "TEXTAREA") return;

        textarea.style.paddingTop = "0px";
        textarea.style.paddingBottom = "0px";
        textarea.style.height = "auto";

        const parent = textarea.parentElement;
        const boxHeight = parent ? parent.clientHeight : textarea.clientHeight;
        const scrollHeight = textarea.scrollHeight;

        if (document.body.classList.contains("board-editing")) {
          const lineHeight = parseFloat(getComputedStyle(textarea).lineHeight) || 20;
          const manualLines = String(textarea.value || "").split(/\n/).length;
          const estimatedLines = Math.max(1, Math.min(2, manualLines, Math.ceil(scrollHeight / Math.max(1, lineHeight))));
          const contentHeight = Math.min(boxHeight, Math.ceil(lineHeight * estimatedLines + 4));
          textarea.style.height = `${contentHeight}px`;
          textarea.style.transform = "translateY(3px)";
          return;
        }

        textarea.style.transform = "";

        textarea.style.height = "100%";
        const top = Math.max(0, (boxHeight - scrollHeight) / 2);
        textarea.style.paddingTop = `${top}px`;
      });
    }

    function setupBoardTextareaAutoCenter() {
      [subjectText, addressText, samplingLocationInput].filter(Boolean).forEach((textarea) => {
        if (!textarea || textarea.tagName !== "TEXTAREA") return;
        textarea.addEventListener("input", () => {
          syncBoardTextareas();
          scheduleBoardPreviewRender();
        });
      });

      requestAnimationFrame(syncBoardTextareas);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);

    function getBoardEditSnapshot() {
      const data = isBoardEditMode && boardEditDraft ? readBoardEditForm() : getCurrentBoardData();
      return {
        subject: data.subject || "",
        address: data.address || "",
        roomNo: data.roomNo || "",
        sampleNo: data.sampleNo || "",

        selectedStatus: data.status,
        boardMode: data.boardMode,
        fieldTextSize: { ...(data.fieldTextSize || boardFieldTextSize) }
      };

    function applyBoardEditSnapshot(snapshot) {
      if (!snapshot) return;
      isApplyingBoardHistory = true;
      boardEditDraft = {
        subject: snapshot.subject || "",
        address: snapshot.address || "",
        roomNo: snapshot.roomNo || "",
        sampleNo: snapshot.sampleNo || "",
        date: snapshot.date || "",
        status: snapshot.selectedStatus || "visual",
        boardMode: snapshot.boardMode === "sampling" ? "sampling" : "survey",
        fieldTextSize: { ...(snapshot.fieldTextSize || boardFieldTextSize) }
      };
      populateBoardEditForm(boardEditDraft);
      scheduleBoardEditCanvasRender();
      isApplyingBoardHistory = false;
    }

    function initBoardEditHistory() {
      boardEditHistory = [getBoardEditSnapshot()];
      boardEditHistoryIndex = 0;
    }

    function pushBoardEditHistoryDebounced() {
      if (!isBoardEditMode || isApplyingBoardHistory) return;
      clearTimeout(boardEditHistoryTimer);
      boardEditHistoryTimer = setTimeout(pushBoardEditHistory, 180);
    }

    function pushBoardEditHistory() {
      if (!isBoardEditMode || isApplyingBoardHistory) return;
      const snapshot = getBoardEditSnapshot();
      const prev = boardEditHistory[boardEditHistoryIndex];
      if (prev && JSON.stringify(prev) === JSON.stringify(snapshot)) return;
      boardEditHistory = boardEditHistory.slice(0, boardEditHistoryIndex + 1);
      boardEditHistory.push(snapshot);
      boardEditHistoryIndex = boardEditHistory.length - 1;
    }

    function undoBoardEdit() {
      if (!isBoardEditMode || boardEditHistoryIndex <= 0) {
        showToast("これ以上戻せません");
        return;
      }
      boardEditHistoryIndex -= 1;

    function setupBoardGesture() {
      boardWrap.addEventListener("pointerdown", onBoardPointerDown);
      boardWrap.addEventListener("pointermove", onBoardPointerMove);
      boardWrap.addEventListener("pointerup", onBoardPointerEnd);
      boardWrap.addEventListener("pointercancel", onBoardPointerEnd);
      boardWrap.addEventListener("pointerleave", onBoardPointerEnd);
    }

    function onBoardPointerDown(event) {
      if (isInteractiveBoardTarget(event.target)) {
        return;
      }

      event.preventDefault();
      boardWrap.classList.add("dragging");

      try {
        boardWrap.setPointerCapture(event.pointerId);
      } catch (error) {}

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        gestureState.mode = "drag";
        gestureState.dragStartX = event.clientX;
        gestureState.dragStartY = event.clientY;
        gestureState.originX = boardState.x;
        gestureState.originY = boardState.y;
      } else if (activePointers.size === 2) {
        preparePinchGesture();
      }
    }

    function onBoardPointerMove(event) {
      if (!activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size >= 2) {
        handlePinchMove();
        return;
      }

      if (activePointers.size === 1 && gestureState.mode === "drag") {
        event.preventDefault();

        const dx = event.clientX - gestureState.dragStartX;
        const dy = event.clientY - gestureState.dragStartY;

        boardState.x = gestureState.originX + dx;
        boardState.y = gestureState.originY + dy;

        clampBoardWithinScreen();
        applyBoardTransform();
      }
    }

    function onBoardPointerEnd(event) {
      if (activePointers.has(event.pointerId)) {
        activePointers.delete(event.pointerId);
      }

      try {
        boardWrap.releasePointerCapture(event.pointerId);
      } catch (error) {}

      if (activePointers.size === 1) {
        const remaining = Array.from(activePointers.values())[0];

        gestureState.mode = "drag";
        gestureState.dragStartX = remaining.x;
        gestureState.dragStartY = remaining.y;
        gestureState.originX = boardState.x;
        gestureState.originY = boardState.y;
      } else {
        gestureState.mode = null;
        boardWrap.classList.remove("dragging");
      }
    }

    function preparePinchGesture() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return;

      const p1 = points[0];
      const p2 = points[1];
      const mid = getMidpoint(p1, p2);

      gestureState.mode = "pinch";
      gestureState.startDistance = getDistance(p1, p2);
      gestureState.startScale = boardState.scale;

      gestureState.localMidX = (mid.x - boardState.x) / boardState.scale;
      gestureState.localMidY = (mid.y - boardState.y) / boardState.scale;
    }

    function handlePinchMove() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return;

      const p1 = points[0];
      const p2 = points[1];

      const newDistance = getDistance(p1, p2);
      const mid = getMidpoint(p1, p2);

      if (!gestureState.startDistance) return;

      let nextScale =
        gestureState.startScale * (newDistance / gestureState.startDistance);

      nextScale = clamp(nextScale, boardState.minScale, boardState.maxScale);

      boardState.scale = nextScale;
      boardState.x = mid.x - gestureState.localMidX * boardState.scale;
      boardState.y = mid.y - gestureState.localMidY * boardState.scale;

      clampBoardWithinScreen();
      applyBoardTransform();
    }

    function getDistance(p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getMidpoint(p1, p2) {
      return {
        x: (p1.x + p2.x) / 2,
        y: (p1.y + p2.y) / 2
      };
    }

    function isInteractiveBoardTarget(target) {
      return Boolean(
        target.closest(".board-input") || target.closest(".board-editable") || target.closest(".status-btn")
      );
    }

    async function startCamera() {
      try {
        await requestFullscreenSafe();
        stopCurrentStream();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;

        await video.play();

        showCameraButtons();
        showToast("カメラを起動しました");
      } catch (error) {
        console.error(error);
        showToast("カメラを起動できませんでした");
      }
    }

    function stopCurrentStream() {
      if (!currentStream) return;

      currentStream.getTracks().forEach((track) => track.stop());
      currentStream = null;
      video.srcObject = null;
    }

    async function requestFullscreenSafe() {
      const target = document.documentElement;

      if (!document.fullscreenElement && target.requestFullscreen) {

      }
    }

    async function resumeCameraAfterPreview() {
      try {
        const hasLiveTrack =
          currentStream &&
          currentStream.getVideoTracks &&
          currentStream.getVideoTracks().some((track) => track.readyState === "live");

        if (hasLiveTrack) {
          video.srcObject = currentStream;
          await video.play();
          showCameraButtons();
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },

            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

    async function takePhoto() {
      if (isTakingPhoto) return;

      if (!currentStream || !video.srcObject || video.readyState < 2) {
        showToast("先にカメラを起動してください");
        return;
      }

      isTakingPhoto = true;
      shootButton.disabled = true;

      try {
        if (!isDateManuallyEdited) {
          updateCurrentDate();
        }

        // Canvasに文字を焼き込む前に、フォント読み込み完了を待つ
        // iPhone/iPadで日本語フォントの描画が不安定になるのを軽減する
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const baseCanvas = await captureBaseImage();
        const baseDataUrl = baseCanvas.toDataURL("image/jpeg", 0.82);

        let canvas = await captureCompositedImage();

        // 白フラッシュで撮影感を出す
        runCameraFlash();

        /*
         * iPhone/iPad向けに少し軽量化
         * 0.95だと重くなりやすいので 0.82
         *
         * v49a:
         * HTML看板をforeignObject経由でCanvas合成すると、
         * iOS/Safari系でCanvasがtainted扱いになり、toDataURL時に
         * SecurityErrorで保存できないことがある。
         * その場合は旧Canvas看板描画へ自動フォールバックして保存を優先する。
         */
        let dataUrl;
        try {
          dataUrl = canvas.toDataURL("image/jpeg", 0.82);
        } catch (error) {
          console.warn("HTML看板合成後の画像化に失敗したため、旧Canvas看板描画で再撮影します", error);
          canvas = await captureCompositedImage({ forceLegacyBoard: true });
          dataUrl = canvas.toDataURL("image/jpeg", 0.82);
        }

        // 実際に保存する合成後画像を確認してから保存する
        const accepted = await showCaptureReview(dataUrl);
        if (!accepted) {
          showToast("撮り直しできます");
          return;
        }
        showCapturedStill(dataUrl);
        await delay(650);
        hideCapturedStill();

        saveBoardForm();
        if (boardMode === "sampling") saveSamplingNameHistoryForCurrentCase(roomNoInput.value);

        const createdAt = new Date();
        const photoType = getCurrentPhotoType();
        const sampleParts = parseSampleAndPoint(sampleNoInput.value);
        const sampleNo = sampleParts.sampleNo;
        const pointNo = sampleParts.pointNo;
        const fileName = generatePhotoFileName(sampleNo, pointNo, photoType.code);
        const photo = {
          id: `photo_${Date.now()}_${Math.random().toString(36).slice(2)}`,
          dataUrl,
          baseDataUrl,
          fileName,
          status: photoType.value,
          statusLabel: photoType.label,
          statusCode: photoType.code,
          sampleNo,
          pointNo,
          roomNo: roomNoInput.value.trim(),
          subjectName: getCurrentSubjectName(),
          isSection: photoType.value === SECTION_PHOTO_TYPE.value,
          selected: false,
          createdAt: createdAt.toISOString(),
          savedLocal: false,
          savedAt: ""
        };

        // 保存成功を確認してから、撮影済み配列と表示枚数へ反映する
        await savePhotoToIndexedDB(photo);

        capturedPhotos.push(photo);
        previewIndex = capturedPhotos.length - 1;
        updatePhotoCount();

        if (navigator.vibrate) {
          navigator.vibrate(50);
        }

        showToast("撮影しました");
      } catch (error) {
        console.error(error);
        showErrorToast("撮影データの保存に失敗しました");
        hideCapturedStill();
      } finally {
        isTakingPhoto = false;
        shootButton.disabled = false;
      }
    }

    async function renderBoardElementToCanvas(element) {
      if (!element) throw new Error("看板要素がありません");

      syncBoardTextareas();
      syncBoardTextAreaVerticalCenter();

      const rect = element.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      const clone = element.cloneNode(true);

      prepareBoardCloneForCapture(element, clone);
      addBoardInnerFrameForCapture(clone);
      inlineComputedStyles(element, clone);

      clone.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
      clone.style.margin = "0";
      clone.style.transform = "none";
      clone.style.width = `${width}px`;
      clone.style.height = `${height}px`;
      clone.style.boxSizing = "border-box";

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
          <foreignObject width="100%" height="100%">${new XMLSerializer().serializeToString(clone)}</foreignObject>
        </svg>`;

      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      try {
        const image = await loadImage(url);
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(image, 0, 0, width, height);
        return canvas;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function prepareBoardCloneForCapture(sourceNode, cloneNode) {
      const sourceControls = sourceNode.querySelectorAll("textarea, input, [contenteditable]");
      const cloneControls = cloneNode.querySelectorAll("textarea, input, [contenteditable]");

      sourceControls.forEach((source, index) => {
        const clone = cloneControls[index];
        if (!clone) return;

        const value = source.tagName === "INPUT" || source.tagName === "TEXTAREA"
          ? source.value
          : source.textContent;

        if (clone.tagName === "TEXTAREA" || clone.tagName === "INPUT") {
          const replacement = document.createElement("div");
          replacement.textContent = value || "";
          replacement.className = clone.className;
          replacement.style.whiteSpace = "pre-wrap";
          replacement.style.display = "flex";
          replacement.style.alignItems = "center";
          replacement.style.justifyContent = "center";
          replacement.style.width = "100%";
          replacement.style.height = "100%";
          replacement.style.border = "0";
          replacement.style.outline = "0";
          replacement.style.background = "transparent";
          replacement.style.boxSizing = "border-box";
          clone.replaceWith(replacement);
        } else {
          clone.textContent = value || "";
        }
      });
    }



    function addBoardInnerFrameForCapture(clone) {
      if (!clone) return;
      const frame = document.createElement("div");
      frame.style.position = "absolute";
      frame.style.left = "4px";
      frame.style.top = "4px";
      frame.style.right = "4px";
      frame.style.bottom = "4px";
      frame.style.border = "1.5px solid #000";
      frame.style.pointerEvents = "none";
      frame.style.zIndex = "50";
      frame.style.boxSizing = "border-box";
      clone.appendChild(frame);
    }

    function inlineComputedStyles(sourceNode, cloneNode) {
      if (!sourceNode || !cloneNode || sourceNode.nodeType !== 1 || cloneNode.nodeType !== 1) return;

      const computed = window.getComputedStyle(sourceNode);
      const importantProperties = [
        "display", "position", "box-sizing", "width", "height", "min-width", "min-height",
        "padding", "padding-top", "padding-right", "padding-bottom", "padding-left",
        "margin", "border", "border-top", "border-right", "border-bottom", "border-left",
        "border-collapse", "border-spacing", "background", "background-color", "color",
        "font", "font-family", "font-size", "font-weight", "line-height", "letter-spacing",
        "text-align", "vertical-align", "white-space", "overflow", "border-radius",
        "align-items", "justify-content", "flex-direction", "gap", "table-layout"
      ];

      importantProperties.forEach((property) => {
        try {
          cloneNode.style.setProperty(property, computed.getPropertyValue(property), computed.getPropertyPriority(property));
        } catch (error) {}
      });

      const sourceChildren = Array.from(sourceNode.children);
      const cloneChildren = Array.from(cloneNode.children);
      sourceChildren.forEach((child, index) => inlineComputedStyles(child, cloneChildren[index]));
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("看板画像の生成に失敗しました"));
        image.src = url;
      });
    }

    let boardPreviewRenderQueued = false;

    function scheduleBoardPreviewRender() {
      if (boardPreviewRenderQueued) return;
      boardPreviewRenderQueued = true;
      requestAnimationFrame(() => {
        boardPreviewRenderQueued = false;
        renderBoardPreviewCanvas();
      });
    }

    function renderBoardPreviewCanvas() {
      if (!boardCanvasPreview || !photoBoard) return;

      const cssWidth = Math.max(1, Math.round(photoBoard.offsetWidth || 390));
      const cssHeight = Math.max(1, Math.round(photoBoard.offsetHeight || 242));
      const ratio = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      const pixelWidth = Math.round(cssWidth * ratio);
      const pixelHeight = Math.round(cssHeight * ratio);

      if (boardCanvasPreview.width !== pixelWidth) boardCanvasPreview.width = pixelWidth;
      if (boardCanvasPreview.height !== pixelHeight) boardCanvasPreview.height = pixelHeight;
      boardCanvasPreview.style.width = `${cssWidth}px`;
      boardCanvasPreview.style.height = `${cssHeight}px`;

      const ctx = boardCanvasPreview.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, pixelWidth, pixelHeight);
      drawBoardOnCanvas(ctx, 0, 0, pixelWidth, pixelHeight);
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function shouldUseLegacyBoardCapture() {
      /*
       * iPhone/iPad/SafariではSVG foreignObjectをCanvasに描画した後、
       * toDataURLでSecurityErrorになることがあるため、保存安定性を優先して
       * 旧Canvas看板描画を使う。
       * PC Chrome等ではHTML看板キャプチャを使い、表示との差異を減らす。
       */
      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
      return isIOS || isSafari;
    }

    async function captureBaseImage() {
      const quality = PHOTO_QUALITY_SETTINGS[photoQuality] || PHOTO_QUALITY_SETTINGS.standard;

      const canvas = document.createElement("canvas");
      canvas.width = quality.width;
      canvas.height = quality.height;

      const ctx = canvas.getContext("2d");
      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      const videoScale = Math.max(
        canvas.width / videoWidth,
        canvas.height / videoHeight
      );

      const drawVideoW = videoWidth * videoScale;
      const drawVideoH = videoHeight * videoScale;
      const drawVideoX = (canvas.width - drawVideoW) / 2;
      const drawVideoY = (canvas.height - drawVideoH) / 2;

      ctx.drawImage(
        video,
        0,
        0,
        videoWidth,
        videoHeight,
        drawVideoX,
        drawVideoY,
        drawVideoW,
        drawVideoH
      );

      return canvas;
    }

    function getBoardDrawRectForCanvas(canvas) {
      const frameRect = captureFrame.getBoundingClientRect();
      const boardRect = photoBoard.getBoundingClientRect();

      const scaleX = canvas.width / frameRect.width;
      const scaleY = canvas.height / frameRect.height;

      return {
        x: (boardRect.left - frameRect.left) * scaleX,
        y: (boardRect.top - frameRect.top) * scaleY,
        w: boardRect.width * scaleX,
        h: boardRect.height * scaleY
      };
    }

    async function drawCurrentBoardToCanvas(ctx, canvas, options = {}) {
      if (isSectionMode && !options.forceBoard) return;

      const rect = getBoardDrawRectForCanvas(canvas);
      drawBoardOnCanvas(ctx, rect.x, rect.y, rect.w, rect.h);
    }

    async function composeBoardOnBaseImage(baseDataUrl, options = {}) {
      const img = await loadImage(baseDataUrl);
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      await drawCurrentBoardToCanvas(ctx, canvas, { forceBoard: true, forceLegacyBoard: options.forceLegacyBoard });
      return canvas;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function captureCompositedImage(options = {}) {
      const quality = PHOTO_QUALITY_SETTINGS[photoQuality] || PHOTO_QUALITY_SETTINGS.standard;

      const canvas = document.createElement("canvas");
      canvas.width = quality.width;
      canvas.height = quality.height;

      const ctx = canvas.getContext("2d");

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      /*
       * 保存画像は撮影エリアだけにする。
       * 黒帯はUI用なので保存しない。
       * previewの object-fit: cover と同じ考えで、Canvasも4:3いっぱいに描画する。
       */
      const videoScale = Math.max(
        canvas.width / videoWidth,
        canvas.height / videoHeight
      );

      const drawVideoW = videoWidth * videoScale;
      const drawVideoH = videoHeight * videoScale;
      const drawVideoX = (canvas.width - drawVideoW) / 2;
      const drawVideoY = (canvas.height - drawVideoH) / 2;

      ctx.drawImage(
        video,
        0,
        0,
        videoWidth,
        videoHeight,
        drawVideoX,
        drawVideoY,
        drawVideoW,
        drawVideoH
      );

      if (!isSectionMode) {
        await drawCurrentBoardToCanvas(ctx, canvas, options);
      }

      return canvas;
    }


    function getCurrentSubjectName() {
      const value = subjectText && ("value" in subjectText ? subjectText.value : subjectText.textContent);
      return String(value || "").trim() || "無題案件";

    function getPhotoSubject(photo) {
      return String(photo.subjectName || photo.subject || APP_DATA.subject || "無題案件").trim() || "無題案件";
    }

    function getCaseSummaries() {
      const map = new Map();

      capturedPhotos.forEach((photo) => {
        const subject = getPhotoSubject(photo);
        const current = map.get(subject) || { subject, count: 0, latest: 0 };
        current.count += 1;
        current.latest = Math.max(current.latest, new Date(photo.createdAt || 0).getTime());
        map.set(subject, current);
      });

      return Array.from(map.values()).sort((a, b) => b.latest - a.latest);
    }

    function getLatestCaseSubject() {
      const cases = getCaseSummaries();
      return cases.length ? cases[0].subject : "";
    }

    function getPreviewPhotos() {
      let photos = capturedPhotos.slice();

      if (selectedCaseSubject) {
        photos = photos.filter((photo) => getPhotoSubject(photo) === selectedCaseSubject);
      }

      if (previewSortMode === "sample") {
        photos.sort(comparePhotosBySample);
      } else {
        photos.sort((a, b) => new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime());
      }

      return photos;
    }

    function comparePhotosBySample(a, b) {
      const sampleA = Number(a.sampleNo || 0);
      const sampleB = Number(b.sampleNo || 0);
      if (sampleA !== sampleB) return sampleA - sampleB;

      const pointA = Number(a.pointNo || 0);
      const pointB = Number(b.pointNo || 0);
      if (pointA !== pointB) return pointA - pointB;

      const codeA = Number(a.statusCode || getStatusCode(a.status));
      const codeB = Number(b.statusCode || getStatusCode(b.status));
      if (codeA !== codeB) return codeA - codeB;

      return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
    }

    function checkMissingPhotos() {
      const photos = getPreviewPhotos();
      if (!photos.length) {
        showToast("写真がありません");
        return;
      }

      const required = ["1", "2", "3"];
      const labels = { "1": "施工前", "2": "施工中", "3": "施工後" };
      const groups = new Map();

      photos.forEach((photo) => {
        const key = `${photo.sampleNo || "1"}-${photo.pointNo || "1"}`;
        if (!groups.has(key)) groups.set(key, new Set());
        groups.get(key).add(String(photo.statusCode || getStatusCode(photo.status)));
      });

      const missingLines = [];
      groups.forEach((codes, key) => {
        const hasSampling = required.some((code) => codes.has(code));
        if (!hasSampling) return;

        const missing = required.filter((code) => !codes.has(code));
        if (missing.length) {
          missingLines.push(`${formatSamplePointLabel(key)}：${missing.map((code) => labels[code]).join("・")}`);
        }
      });

      if (!missingLines.length) {
        window.alert("撮影不足はありません。");
        return;
      }

      window.alert(`撮影不足\n\n${missingLines.join("\n")}`);
    }

    function formatSamplePointLabel(key) {
      const [sample, point] = String(key).split("-");
      return `${sample || "1"}-${numberToCircle(Number(point || 1))}`;
    }

    function numberToCircle(num) {
      const circles = ["", "①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩", "⑪", "⑫", "⑬", "⑭", "⑮", "⑯", "⑰", "⑱", "⑲", "⑳"];
      return circles[num] || String(num);
    }

      boardEditTargetPhotoId = photo.id;

      // 選択した写真の撮影時情報を、修正開始時の看板に戻す
      if (photo.subjectName) subjectText.value = photo.subjectName;
      if (photo.roomNo) roomNoInput.value = photo.roomNo;
      if (photo.sampleNo) sampleNoInput.value = formatSamplePointLabel(`${photo.sampleNo}-${photo.pointNo || 1}`);

      if (boardEditPhotoBackdrop) {

    async function finishPhotoBoardCorrection() {
      const photo = capturedPhotos.find((item) => item.id === boardEditTargetPhotoId);
      if (!photo) {
        boardEditTargetPhotoId = null;
        return;

      if (!photo.baseDataUrl) {
        boardEditTargetPhotoId = null;
        window.alert("この写真は看板修正用データがありません。");
        return;

      try {
        saveBoardForm();
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        let canvas;
        let newDataUrl;
        try {
          canvas = await composeBoardOnBaseImage(photo.baseDataUrl);
          newDataUrl = canvas.toDataURL("image/jpeg", 0.82);
        } catch (error) {
          console.warn("HTML看板での再合成に失敗したため、旧Canvas描画で再合成します", error);
          canvas = await composeBoardOnBaseImage(photo.baseDataUrl, { forceLegacyBoard: true });
          newDataUrl = canvas.toDataURL("image/jpeg", 0.82);
        }

        photo.dataUrl = newDataUrl;
        photo.subjectName = getCurrentSubjectName();
        photo.roomNo = roomNoInput.value.trim();
        photo.status = selectedStatus;
        photo.statusLabel = getStatusLabel(selectedStatus);
        photo.updatedAt = new Date().toISOString();

        await savePhotoToIndexedDB(photo);
        previewIndex = Math.max(0, getPreviewPhotos().findIndex((item) => item.id === photo.id));
        updatePhotoCount();
        showToast("看板を修正しました");
      } catch (error) {
        console.error(error);
        showErrorToast("看板修正に失敗しました");
      } finally {
        boardEditTargetPhotoId = null;
      }
    }

    async function deleteSelectedPreviewPhotos() {
      if (!capturedPhotos.length) {
        showToast("撮影した写真がありません");
        return;
      }

      const selectedPhotos = getPreviewPhotos().filter((photo) => photo.selected);

      if (!selectedPhotos.length) {
        showToast("削除する写真をチェックしてください");
        return;
      }

      const ok = window.confirm(`選択した画像 ${selectedPhotos.length}枚を削除しますか？`);
      if (!ok) return;

      const selectedIds = new Set(selectedPhotos.map((photo) => photo.id));

      for (const photo of selectedPhotos) {
        await deletePhotoFromIndexedDB(photo.id);
      }

      for (let i = capturedPhotos.length - 1; i >= 0; i--) {
        if (selectedIds.has(capturedPhotos[i].id)) {
          capturedPhotos.splice(i, 1);
        }
      }

      const remainingPhotos = getPreviewPhotos();

      if (!remainingPhotos.length) {
        previewIndex = 0;
        renderPreview();
      } else {
        previewIndex = Math.min(previewIndex, remainingPhotos.length - 1);
        renderPreview();
      }

      updatePhotoCount();
      showToast("削除しました");
    }

    async function shareOrDownloadPhotos(photos) {
      if (!photos.length) return;

      if (navigator.share && navigator.canShare) {
        try {
          const files = photos.map((photo) => {
            const blob = dataUrlToBlob(photo.dataUrl);
            return new File([blob], photo.fileName, { type: "image/jpeg" });
          });

          if (navigator.canShare({ files })) {
            await navigator.share({
              files,
              title: photos.length === 1 ? photos[0].fileName : `電子看板写真 ${photos.length}枚`
            });
            await markPhotosAsSaved(photos);
            showToast("保存しました");
            renderPreview();
            return;
          }
        } catch (error) {
          if (error && error.name === "AbortError") return;
          console.error(error);
          showToast("共有できませんでした");
        }
      }

      photos.forEach((photo, index) => {
        setTimeout(() => {
          const link = document.createElement("a");
          link.href = photo.dataUrl;
          link.download = photo.fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }, index * 250);
      });
      await markPhotosAsSaved(photos);
      showToast("保存しました");
      renderPreview();
    }

    async function markPhotosAsSaved(photos) {
      const savedAt = new Date().toISOString();
      for (const photo of photos) {
        photo.savedLocal = true;
        photo.savedAt = savedAt;
        try {
          await savePhotoToIndexedDB(photo);
        } catch (error) {
          console.warn("保存済マークの更新に失敗しました", error);
        }
      }
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const header = parts[0];
      const base64 = parts[1];
      const mimeMatch = header.match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
      const binary = atob(base64);
      const array = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        array[i] = binary.charCodeAt(i);
      }

      return new Blob([array], { type: mime });
    }

    function setupPreviewSwipe() {
      previewOverlay.addEventListener("touchstart", (event) => {
        if (!event.touches || event.touches.length !== 1) return;

        previewTouchStartX = event.touches[0].clientX;
        previewTouchStartY = event.touches[0].clientY;
      }, { passive: true });

      previewOverlay.addEventListener("touchend", (event) => {
        if (!event.changedTouches || event.changedTouches.length !== 1) return;
        if (isPreviewListMode) return;

        const endX = event.changedTouches[0].clientX;
        const endY = event.changedTouches[0].clientY;

        const dx = endX - previewTouchStartX;
        const dy = endY - previewTouchStartY;

        if (Math.abs(dx) < 45) return;
        if (Math.abs(dx) < Math.abs(dy)) return;

        if (dx < 0) {
          showNextPhoto();
        } else {
          showPrevPhoto();
        }
      }, { passive: true });
    }

    function getStatusLabel(value) {
      if (value === SECTION_PHOTO_TYPE.value) return SECTION_PHOTO_TYPE.label;
      const found = STATUS_LIST.find(item => item.value === value);
      return found ? found.label : value;

    function getCurrentPhotoType() {
      if (isSectionMode) return SECTION_PHOTO_TYPE;
      return STATUS_LIST.find((item) => item.value === selectedStatus) || STATUS_LIST[0];
    }

    function getStatusCode(value) {
      if (value === SECTION_PHOTO_TYPE.value) return SECTION_PHOTO_TYPE.code;
      const found = STATUS_LIST.find((item) => item.value === value);
      return found ? found.code : "0";
    }

    function normalizeFilePart(value) {
      const text = normalizeFullWidthText(String(value || "").trim());
      return text ? text.replace(/[^0-9A-Za-z_-]/g, "") : "1";
    }

    /*
     * 看板表示用の「試料No.」には、現場運用上「1-①」のような表記が入る想定。
     * ファイル名では丸数字を半角数字に直し、「1-①」も「1-1」も同じ 1-1 として扱う。
     */
    function parseSampleAndPoint(value) {
      const rawText = String(value || "").trim() || POINT_DISPLAY_DEFAULT;
      const normalized = normalizeFullWidthText(rawText)
        .replace(/[−ー―‐]/g, "-")
        .replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g, (char) => String("①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳".indexOf(char) + 1));

      const parts = normalized.split("-").filter(Boolean);

      return {
        sampleNo: normalizeFilePart(parts[0] || normalized || "1"),
        pointNo: normalizeFilePart(parts[1] || DEFAULT_POINT_NO)
      };
    }

    function normalizeFullWidthText(value) {
      return String(value || "").replace(/[！-～]/g, (char) => {
        return String.fromCharCode(char.charCodeAt(0) - 0xFEE0);
      }).replace(/　/g, " ");
    }

    function generatePhotoFileName(sampleNo, pointNo, statusCode) {
      const baseName = `${sampleNo}-${pointNo}-${statusCode}`;
      const sameCount = capturedPhotos.filter((photo) => {
        return photo.sampleNo === sampleNo &&
          photo.pointNo === pointNo &&
          photo.statusCode === statusCode;
      }).length;

      if (sameCount === 0) {
        return `${baseName}.jpg`;
      }

      return `${baseName}_${String(sameCount + 1).padStart(2, "0")}.jpg`;
    }

    function openPhotoDB() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          resolve(null);
          return;
        }

        if (dbInstance) {
          resolve(dbInstance);
          return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(DB_STORE_NAME)) {
            db.createObjectStore(DB_STORE_NAME, { keyPath: "id" });
          }
        };

        request.onsuccess = () => {
          dbInstance = request.result;
          resolve(dbInstance);
        };

        request.onerror = () => {
          console.error(request.error);
          reject(request.error);
        };
      });
    }

    async function loadPhotosFromIndexedDB() {
      try {
        const db = await openPhotoDB();
        if (!db) return;

        const photos = await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readonly");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.getAll();

          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });

        capturedPhotos.splice(0, capturedPhotos.length, ...photos.sort((a, b) => {
          return new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
        }));

        capturedPhotos.forEach((photo) => {
          if (!photo.subjectName) photo.subjectName = getPhotoSubject(photo);
        });

        if (capturedPhotos.length) {
          previewIndex = capturedPhotos.length - 1;
        }

        updatePhotoCount();
      } catch (error) {
        console.error(error);
        showToast("端末内保存の読込に失敗しました");
      }
    }

    async function savePhotoToIndexedDB(photo) {
      try {
        const db = await openPhotoDB();
        if (!db) return;

        await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readwrite");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.put(photo);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      } catch (error) {
        console.error(error);
        showToast("端末内保存に失敗しました");
      }
    }

    async function deletePhotoFromIndexedDB(photoId) {
      try {
        const db = await openPhotoDB();
        if (!db) return;

        await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readwrite");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.delete(photoId);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      } catch (error) {
        console.error(error);
        showToast("端末内写真の削除に失敗しました");
      }
    }

    /* キャンバス上に看板を描画 */
    function drawBoardOnCanvas(ctx, x, y, w, h, sourceData = null) {
      const source = sourceData || getCurrentBoardData();
      const activeBoardMode = source.boardMode === "sampling" ? "sampling" : "survey";
      const activeTextSizes = source.fieldTextSize || boardFieldTextSize;
      const data = {
        subject: source.subject || "",
        address: source.address || "",
        roomNo: String(source.roomNo || "").trim(),
        sampleNo: String(source.sampleNo || "").trim(),
        date: source.date || "",
        status: source.status || selectedStatus,
        roomLabel: activeBoardMode === "sampling" ? "" : "　部屋No."
      };

      const outerLine = Math.max(1.2, h * 0.0085);
      const innerLine = Math.max(0.9, h * 0.0065);
      const frameGap = Math.max(2.2, h * 0.017);
      const frameInset = outerLine + frameGap;

      const outerX = x;
      const outerY = y;
      const outerW = w;
      const outerH = h;

      // 細線二重枠の内側に、表本体を描く。
      x = outerX + frameInset;
      y = outerY + frameInset;
      w = Math.max(1, outerW - frameInset * 2);
      h = Math.max(1, outerH - frameInset * 2);

      const leftColW = w * 0.20;
      const rightW = w - leftColW;

      const row1H = h * (52 / 230);
      const row2H = h * (40 / 230);
      const row3H = h * (96 / 230);
      const row4H = h - row1H - row2H - row3H;

      const contentY = y + row1H + row2H;
      const contentH = row3H;

      // 確定設定：No.セル「少し広」+ 値位置「右」。
      // テストHTMLの 120px + 48px を、右側幅416px基準の比率でCanvasへ反映する。
      const innerLabelW = rightW * 0.404;
      const roomRowH = contentH * 0.31;
      const sampleRowH = contentH * 0.31;
      const statusRowH = contentH - roomRowH - sampleRowH;

      ctx.save();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(outerX, outerY, outerW, outerH);

      ctx.strokeStyle = "#000000";
      ctx.lineJoin = "miter";
      ctx.lineCap = "butt";
      drawOuterBorder(ctx, outerX, outerY, outerW, outerH, outerLine);
      drawOuterBorder(ctx, x, y, w, h, innerLine);

      ctx.lineWidth = innerLine;

      // v45: 罫線は二重枠の内側だけに描く。内容欄の太線・下側の飛び出しを防ぐ。
      const gridTop = y + innerLine;
      const gridBottom = y + h - innerLine;
      const gridLeft = x + innerLine;
      const gridRight = x + w - innerLine;
      drawLine(ctx, x + leftColW, gridTop, x + leftColW, gridBottom);
      drawLine(ctx, gridLeft, y + row1H, gridRight, y + row1H);
      drawLine(ctx, gridLeft, y + row1H + row2H, gridRight, y + row1H + row2H);
      drawLine(ctx, gridLeft, y + row1H + row2H + row3H, gridRight, y + row1H + row2H + row3H);

      drawLine(ctx, x + leftColW, contentY + roomRowH, gridRight, contentY + roomRowH);
      drawLine(ctx, x + leftColW, contentY + roomRowH + sampleRowH, gridRight, contentY + roomRowH + sampleRowH);
      // 部屋No. / 試料No. はラベルと値の間の縦線を描かない。

      const textMultiplier = BOARD_TEXT_SIZE_MULTIPLIERS[boardTextSize] || 1;
      const subjectMultiplier = (activeTextSizes.subject || 18) / 18;
      const addressMultiplier = (activeTextSizes.address || 17) / 17;
      const roomMultiplier = (activeTextSizes.room || 24) / 24;
      const sampleMultiplier = (activeTextSizes.sample || 24) / 24;
      const dateMultiplier = (activeTextSizes.date || 24) / 24;
      const labelFont = Math.max(10, w * 0.046);
      const titleFont = Math.max(10, w * 0.047 * textMultiplier * subjectMultiplier);
      const addressFont = Math.max(10, w * 0.044 * textMultiplier * addressMultiplier);
      const innerLabelFont = Math.max(9, w * 0.043);
      const innerValueFont = Math.max(11, w * 0.055 * textMultiplier * roomMultiplier);
      const sampleValueFont = Math.max(11, w * 0.055 * textMultiplier * sampleMultiplier);
      const statusFont = Math.max(10, w * 0.043);
      const dateFont = Math.max(12, w * 0.055 * dateMultiplier);

      drawCenteredText(ctx, "件名", x, y, leftColW, row1H, labelFont);
      drawCenteredText(ctx, "採取場所", x, y + row1H, leftColW, row2H, labelFont);
      drawCenteredText(ctx, "内容", x, contentY, leftColW, contentH, labelFont);
      drawCenteredText(ctx, "日付", x, y + row1H + row2H + row3H, leftColW, row4H, labelFont);

      drawWrappedCenterText(ctx, data.subject, x + leftColW + 6, y, rightW - 12, row1H, titleFont, 1.25, 2);
      drawWrappedCenterText(ctx, data.address, x + leftColW + 6, y + row1H, rightW - 12, row2H, addressFont, 1.2, 2);

      if (activeBoardMode === "sampling") {
        drawCenteredText(ctx, data.roomNo, x + leftColW + 10, contentY, rightW - 20, roomRowH, innerValueFont);
      } else {
        drawLeftMiddleText(ctx, data.roomLabel, x + leftColW + 8, contentY, innerLabelW - 8, roomRowH, innerLabelFont);
        drawLeftMiddleText(ctx, data.roomNo, x + leftColW + innerLabelW, contentY, rightW - innerLabelW, roomRowH, innerValueFont);
      }

      drawLeftMiddleText(ctx, "　試料No.", x + leftColW + 8, contentY + roomRowH, innerLabelW - 8, sampleRowH, innerLabelFont);
      drawLeftMiddleText(ctx, data.sampleNo, x + leftColW + innerLabelW, contentY + roomRowH, rightW - innerLabelW, sampleRowH, sampleValueFont);

      const statusStartX = x + leftColW + 3;
      const statusWidth = rightW - 6;
      const activeStatusList = getActiveStatusList();
      const segmentW = statusWidth / activeStatusList.length;
      const statusCenterY = contentY + roomRowH + sampleRowH + statusRowH / 2;

      ctx.fillStyle = "#000";
      ctx.font = `900 ${statusFont}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      activeStatusList.forEach((item, index) => {
        const symbol = item.value === data.status ? "■" : "□";
        const text = `${symbol}${item.label}`;
        const centerX = statusStartX + segmentW * index + segmentW / 2;
        ctx.fillText(text, centerX, statusCenterY);
      });

      drawCenteredText(ctx, data.date, x + leftColW, y + row1H + row2H + row3H, rightW, row4H, dateFont);

      // 最後に二重枠をもう一度描いて、焼き込み時の外周を安定させる。
      drawOuterBorder(ctx, outerX, outerY, outerW, outerH, outerLine);
      drawOuterBorder(ctx, x, y, w, h, innerLine);

      ctx.restore();
    }

    function drawOuterBorder(ctx, x, y, w, h, lineWidth) {
      ctx.save();
      ctx.fillStyle = "#000000";
      ctx.fillRect(x, y, w, lineWidth);
      ctx.fillRect(x, y + h - lineWidth, w, lineWidth);
      ctx.fillRect(x, y, lineWidth, h);
      ctx.fillRect(x + w - lineWidth, y, lineWidth, h);
      ctx.restore();
    }

    function drawLine(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCenteredText(ctx, text, x, y, w, h, fontSize) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "", x + w / 2, y + h / 2);
      ctx.restore();
    }

    function drawLeftMiddleText(ctx, text, x, y, w, h, fontSize) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "", x, y + h / 2);
      ctx.restore();
    }

    function drawWrappedLeftText(ctx, text, x, y, w, h, fontSize, lineRate, maxLines) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const lines = getWrappedLines(ctx, text || "", w).slice(0, maxLines);
      const lineHeight = fontSize * lineRate;
      const totalHeight = lines.length * lineHeight;
      let currentY = y + h / 2 - totalHeight / 2 + lineHeight / 2 + Math.max(1, fontSize * 0.05);

      lines.forEach((line) => {
        ctx.fillText(line, x, currentY);
        currentY += lineHeight;
      });

      ctx.restore();
    }

    function drawWrappedCenterText(ctx, text, x, y, w, h, fontSize, lineRate, maxLines) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const lines = getWrappedLines(ctx, text || "", w).slice(0, maxLines);
      const lineHeight = fontSize * lineRate;
      const totalHeight = lines.length * lineHeight;
      let currentY = y + h / 2 - totalHeight / 2 + lineHeight / 2 + Math.max(1, fontSize * 0.05);

      lines.forEach((line) => {
        ctx.fillText(line, x + w / 2, currentY);
        currentY += lineHeight;
      });

      ctx.restore();
    }

    function getWrappedLines(ctx, text, maxWidth) {
      const result = [];
      const source = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const manualLines = source.split("\n");

      manualLines.forEach((manualLine) => {
        const segment = manualLine || "";
        let current = "";

        for (const char of segment) {
          const test = current + char;
          const testWidth = ctx.measureText(test).width;

          if (testWidth > maxWidth && current !== "") {
            result.push(current);
            current = char;
          } else {
            current = test;
          }
        }

        // 手動改行だけの空行も保持する
        result.push(current);
      });

      return result.length ? result : [""];
    }


    function setupBoardTextAreaCentering() {
      [subjectText, addressText].forEach((element) => {
        if (!element) return;
        element.addEventListener("input", syncBoardTextAreaVerticalCenter);
        element.addEventListener("change", syncBoardTextAreaVerticalCenter);
      });
      syncBoardTextAreaVerticalCenter();
    }

    function syncBoardTextAreaVerticalCenter() {
      [subjectText, addressText].forEach((element) => {
        if (!element) return;
        element.style.paddingTop = "0px";
        element.style.paddingBottom = "0px";

        const visibleHeight = element.clientHeight;
        const lineHeight = parseFloat(getComputedStyle(element).lineHeight) || 20;
        const rawLines = String(element.value || "").split(/\n/);
        const estimatedLines = Math.max(1, rawLines.length);
        const contentHeight = Math.min(element.scrollHeight, Math.ceil(lineHeight * estimatedLines + 2));
        const padding = Math.max(0, Math.floor((visibleHeight - contentHeight) / 2));

        element.style.paddingTop = `${padding}px`;
        element.style.paddingBottom = "0px";
      });
    }

    function adjustBoardFieldTextSize(field, delta) {
      if (!boardFieldTextSize[field]) return;
      const max = (field === "room" || field === "sample") ? 36 : (field === "date" ? 34 : 32);

      boardFieldTextSize[field] = clamp(boardFieldTextSize[field] + delta, min, max);

    function getShortAppVersion(version = APP_VERSION) {
      const match = String(version || "").match(/^v?([0-9]+(?:\.[0-9]+)?[a-z]?)/i);
      return match ? `v${match[1]}` : String(version || "");
    }

    function renderAppVersion() {
      if (appVersionBadge) appVersionBadge.textContent = getShortAppVersion();
      if (settingsVersionText) settingsVersionText.textContent = getShortAppVersion();
    }

    async function getLatestAppVersion() {
      const url = new URL(window.location.href);
      url.searchParams.set("_update_check", Date.now());

      const response = await fetch(url.toString(), {
        cache: "no-store",
        headers: { "Cache-Control": "no-cache" }
      });

      const html = await response.text();
      const match = html.match(/const APP_VERSION = "([^"]+)"/);
      return match ? match[1] : null;
    }

    async function clearAppCachesAndServiceWorker() {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.log("Service Worker解除に失敗しました", error);
      }

      try {
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (error) {
        console.log("キャッシュ削除に失敗しました", error);
      }
    }

    async function reloadAppWithVersion(versionLabel) {
      await clearAppCachesAndServiceWorker();
      const reloadUrl = new URL(window.location.href);
      reloadUrl.searchParams.set("v", versionLabel || Date.now());
      reloadUrl.searchParams.set("_reload", Date.now());
      window.location.replace(reloadUrl.toString());
    }

    async function checkAppUpdate() {
      try {
        const latestVersion = await getLatestAppVersion();
        if (!latestVersion) return;

        if (latestVersion !== APP_VERSION) {
          const ok = window.confirm(
            `新しいバージョンがあります。

現在：${getShortAppVersion(APP_VERSION)}
最新：${getShortAppVersion(latestVersion)}

更新しますか？`
          );

          if (ok) await reloadAppWithVersion(latestVersion);
        }
      } catch (error) {
        console.log("更新確認に失敗しました", error);
      }
    }

    async function forceAppUpdate() {
      try {
        showToast("最新版を確認中...");
        const latestVersion = await getLatestAppVersion();
        if (latestVersion && latestVersion !== APP_VERSION) {
          const ok = window.confirm(
            `新しいバージョンがあります。

現在：${getShortAppVersion(APP_VERSION)}
最新：${getShortAppVersion(latestVersion)}

更新しますか？`
          );
          if (!ok) return;
          await reloadAppWithVersion(latestVersion);
          return;
        }

        const ok = window.confirm(
          `現在のバージョン：${getShortAppVersion(APP_VERSION)}

キャッシュを削除して、このバージョンを読み込み直しますか？`
        );
        if (ok) await reloadAppWithVersion(latestVersion || APP_VERSION);
      } catch (error) {
        console.log("手動更新に失敗しました", error);
        showErrorToast("更新に失敗しました");
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("error");
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1400);
    }

    function showErrorToast(message) {
      toast.textContent = message;
      toast.classList.add("error");
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
        toast.classList.remove("error");
      }, 2400);
    }
  </script>

    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => console.log("Service Worker 登録完了"))
      .catch(err => console.error("Service Worker登録失敗", err));
  });
}
</script>
