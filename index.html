<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.json" />
  <title>電子看板カメラ</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    #cameraScreen {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /*
     * 撮影エリア。
     * ここに見えている範囲だけを写真として保存する。
     * 横向きでは中央4:3、右側の黒帯に操作ボタンを置く。
     */


    /* 横向き時に撮影エリアを中央に置くための左側スペーサー */
    #cameraScreen::before {
      content: "";
      width: 92px;
      height: 100dvh;
      flex: 0 0 92px;
      background: #000;
    }

    #captureFrame {
      position: relative;
      width: min(calc(100vw - 92px), calc(100dvh * 4 / 3));
      height: min(100dvh, calc((100vw - 92px) * 3 / 4));
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #000;
      flex: 0 0 auto;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
    }

    #cameraGuide {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    .hidden,
    .hidden-control {
      display: none !important;
    }

    /* 撮影枚数表示 */
    #photoCount {
      position: absolute;
      left: 12px;
      top: calc(12px + env(safe-area-inset-top));
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    #photoCount:active {
      opacity: 0.72;
    }

    /* 看板レイヤー */
    .board-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    #boardWrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      transform-origin: top left;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      cursor: grab;
      will-change: transform;
    }

    #boardWrap.dragging {
      cursor: grabbing;
    }

    /* 電子看板：横長長方形 */
    #photoBoard {
      position: relative;
      width: 100%;
      height: 242px;
      padding: 4px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    /*
     * 細線の二重枠。
     * 外側は #photoBoard の border、内側は表全体の枠で作る。
     */
    #photoBoard::after {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: 5;
      border: 1.5px solid #000;
      pointer-events: none;
    }

    .board-table,
    .inner-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .board-table td,
    .inner-table td {
      border: 1.5px solid #000;
      vertical-align: middle;
      padding: 0;
    }

    .row-subject {
      height: 52px;
    }

    .row-place {
      height: 40px;
    }

    .row-content {
      height: 96px;
    }

    .row-date {
      height: 42px;
    }

    .label-cell {
      width: 78px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .content-label-cell {
      width: 78px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .value-cell {
      padding: 4px 5px;
    }

    .board-value-cell {
      padding: 0 6px;
    }

    .textarea-center-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .subject-text {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.25;
      word-break: break-word;
    }

    .address-text {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-all;
    }

    .board-editable {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #000;
      font-family: inherit;
      padding: 0;
      margin: 0;
      text-align: center;
      white-space: normal;
      word-break: break-word;
    }

    .subject-textarea {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.25;
    }

    .address-textarea {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
    }

    .inner-label {
      /* 確定設定：No.セル「少し広」 */
      width: 120px;
      padding: 4px 5px 4px 12px;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
      text-align: left;
      border-right: none !important;
    }

    .inner-value {
      border-left: none !important;
      /* 確定設定：値位置「右」 */
      padding: 0 6px 0 48px;
    }

    .board-input {
      width: 100%;
      height: 28px;
      border: none;
      outline: none;
      background: transparent;
      color: #000;
      font-size: 24px;
      font-weight: 900;
      font-family: inherit;
      text-align: left;
      padding: 0;
    }

    .status-cell {
      padding: 3px 4px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      width: 100%;
      height: 34px;
      flex-wrap: nowrap;
    }

    .status-btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      color: #000;
      font-size: 15px;
      font-weight: 900;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
    }

    .status-box {
      display: inline-block;
      min-width: 1em;
      text-align: center;
      font-size: 1.05em;
      line-height: 1;
    }

    .date-cell {
      text-align: center;
      padding: 0 6px;
    }

    .date-text {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    /* 操作パネル：横向きでは右黒帯に縦並び */
    .controls {
      position: relative !important;
      z-index: 9999 !important;
      width: 92px !important;
      height: 100dvh !important;
      flex: 0 0 92px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 12px !important;
      padding: calc(10px + env(safe-area-inset-top)) 8px calc(10px + env(safe-area-inset-bottom)) !important;
      margin: 0 !important;
      pointer-events: auto !important;
      background: #000;
    }

    .control-button {
      border: none;
      border-radius: 999px;
      width: 64px;
      min-height: 82px;
      padding: 12px 8px;
      font-size: 18px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    .btn-start {
      background: #2f80ed;
      color: #fff;
    }

    .btn-view {
      background: #f2c94c;
      color: #000;
      min-width: 80px;
    }

    .btn-shoot {
      background: #fff;
      color: #000;
      min-width: 92px;
    }

    .btn-section {
      background: #eb5757;
      color: #fff;
      min-width: 80px;
    }

    .btn-section.active {
      background: #fff;
      color: #eb5757;
      box-shadow: 0 0 0 3px #eb5757 inset, 0 2px 8px rgba(0, 0, 0, 0.35);
    }


    .controls .control-button {
      min-width: 64px;
    }

    #sectionModeBadge {
      position: absolute;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      background: rgba(235, 87, 87, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      pointer-events: none;
    }

    #sectionModeBadge.show {
      display: block;
    }

    body.section-mode #boardWrap {
      display: none;
    }

    /* プレビュー画面 */
    #previewOverlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
      touch-action: pan-y;
    }

    #previewOverlay.show {
      display: flex;
    }

    #previewCounter {
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 10px;
      min-height: 24px;
    }

    #previewImageWrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #previewImage {
      max-width: 100%;
      max-height: calc(100dvh - 205px);
      object-fit: contain;
      background: #111;
      border: 1px solid #333;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: pan-y;
    }

    #previewMeta {
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      margin-top: 8px;
      min-height: 18px;
      text-align: center;
      word-break: break-all;
    }

    #previewThumbnails {
      width: 100%;
      max-width: 720px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 4px 2px;
      -webkit-overflow-scrolling: touch;
    }

    #previewOverlay.list-mode #previewImageWrap,
    #previewOverlay.list-mode #previewMeta,
    #previewOverlay.list-mode #previewThumbnails {
      display: none;
    }

    #previewOverlay.list-mode #previewList {
      display: grid;
    }

    #previewList {
      width: 100%;
      max-width: 760px;
      flex: 1 1 auto;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding: 8px 4px 12px;
      -webkit-overflow-scrolling: touch;
    }

    .photo-list-item {
      position: relative;
      border: 2px solid #333;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      color: #fff;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font-family: inherit;
    }

    .photo-list-item.current {
      border-color: #f2c94c;
    }

    .photo-list-item.selected {
      border-color: #27ae60;
    }

    .photo-list-item img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .photo-list-info {
      padding: 6px 7px 8px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.25;
      word-break: break-all;
    }

    .photo-list-status {
      color: #f2c94c;
      margin-bottom: 2px;
    }

    .thumb-item {
      position: relative;
      flex: 0 0 auto;
      width: 74px;
      height: 56px;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      cursor: pointer;
    }

    .thumb-item.current {
      border-color: #f2c94c;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-check,
    .list-check {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      line-height: 20px;
      text-align: center;
      z-index: 4;
      cursor: pointer;
      touch-action: manipulation;
    }

    .thumb-item.selected .thumb-check,
    .photo-list-item.selected .list-check {
      background: #27ae60;
    }

    .preview-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #000;
      font-size: 28px;
      font-weight: 900;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      z-index: 2;
    }

    .preview-arrow.left {
      left: 6px;
    }

    .preview-arrow.right {
      right: 6px;
    }

    .preview-controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding-top: 12px;
    }

    .preview-button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
    }

    .btn-save {
      background: #27ae60;
      color: #fff;
    }

    .btn-delete {
      background: #eb5757;
      color: #fff;
    }

    .btn-list-toggle {
      background: #f2c94c;
      color: #000;
    }

    .btn-close {
      background: #444;
      color: #fff;
    }

    .preview-topbar {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      right: 12px;
      z-index: 20005;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      font-size: 22px;
      font-weight: 900;
      line-height: 42px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    #settingsOverlay {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 16px;
    }

    #settingsOverlay.show {
      display: flex;
    }

    .settings-panel {
      width: min(100%, 520px);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: #fff;
      color: #000;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      font-weight: 900;
      font-family: inherit;
    }

    .settings-title {
      text-align: center;
      font-size: 20px;
      margin: 0 0 16px;
    }

    .settings-section-title {
      font-size: 16px;
      margin: 14px 0 8px;
    }

    .quality-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: #fff;
      color: #000;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: 900;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .quality-option.active {
      border-color: #27ae60;
      box-shadow: 0 0 0 2px rgba(39, 174, 96, 0.18) inset;
    }

    .quality-dot {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 2px solid #222;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .quality-option.active .quality-dot::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #27ae60;
    }

    .settings-note {
      margin: 14px 0;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }

    .settings-close {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 13px 18px;
      margin-top: 8px;
      background: #444;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
    }

    /* トースト */
    #toast {
      position: absolute;
      left: 50%;
      top: calc(14px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 10000;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
    }


    @media (orientation: portrait) {
      #cameraScreen {
        flex-direction: column;
      }

      #cameraScreen::before {
        display: none;
      }

      #captureFrame {
        width: 100vw;
        height: min(calc(100vw * 3 / 4), calc(100dvh - 92px));
      }

      .controls {
        width: 100vw !important;
        height: 92px !important;
        flex: 0 0 92px !important;
        flex-direction: row !important;
        gap: 8px !important;
        padding: 8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)) !important;
      }

      .control-button {
        writing-mode: horizontal-tb;
        text-orientation: mixed;
        width: auto;
        min-width: 76px;
        min-height: auto;
        padding: 13px 16px;
      }
    }

  </style>
</head>

<body>
  <div id="cameraScreen">
    <div id="captureFrame">
      <video id="video" playsinline muted autoplay></video>

      <div id="cameraGuide">右側の「カメラ起動」を押してください</div>

      <div id="photoCount">撮影済み 0枚</div>
      <div id="sectionModeBadge">断面モード：看板なし</div>

      <div class="board-layer">
      <div id="boardWrap">
        <div id="photoBoard">
          <table class="board-table">
            <tr class="row-subject">
              <td class="label-cell">件名</td>
              <td class="value-cell board-value-cell">
                <div class="textarea-center-wrap">
                  <div id="subjectText" class="board-editable subject-textarea" contenteditable="true" inputmode="text"></div>
                </div>
              </td>
            </tr>

            <tr class="row-place">
              <td class="label-cell">採取場所</td>
              <td class="value-cell board-value-cell">
                <div class="textarea-center-wrap">
                  <div id="addressText" class="board-editable address-textarea" contenteditable="true" inputmode="text"></div>
                </div>
              </td>
            </tr>

            <tr class="row-content">
              <td class="content-label-cell">内容</td>
              <td>
                <table class="inner-table">
                  <tr>
                    <td class="inner-label">　部屋No.</td>
                    <td class="inner-value">
                      <input id="roomNoInput" class="board-input" type="text" inputmode="text" />
                    </td>
                  </tr>

                  <tr>
                    <td class="inner-label">　試料No.</td>
                    <td class="inner-value">
                      <input id="sampleNoInput" class="board-input" type="text" inputmode="text" />
                    </td>
                  </tr>

                  <tr>
                    <td colspan="2" class="status-cell">
                      <div class="status-row">
                        <button class="status-btn" type="button" data-value="visual">
                          <span class="status-box">■</span><span>目視</span>
                        </button>

                        <button class="status-btn" type="button" data-value="before">
                          <span class="status-box">□</span><span>施工前</span>
                        </button>

                        <button class="status-btn" type="button" data-value="during">
                          <span class="status-box">□</span><span>施工中</span>
                        </button>

                        <button class="status-btn" type="button" data-value="after">
                          <span class="status-box">□</span><span>施工後</span>
                        </button>
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr class="row-date">
              <td class="label-cell">日付</td>
              <td class="date-cell">
                <div id="dateText" class="date-text"></div>
              </td>
            </tr>
          </table>
        </div>
      </div>
      </div>
    </div>

    <div class="controls">
      <button
        id="startButton"
        class="control-button btn-start"
        type="button"
        onclick="startCamera()"
      >
        カメラ起動
      </button>

      <button
        id="viewButton"
        class="control-button btn-view hidden-control"
        type="button"

  <script>
    const APP_VERSION = "v31";

    const APP_DATA = {
      subject: "テストビル解体に伴うアスベスト調査",
      address: "神奈川県小田原市小八幡2-3-6"
    };

    const STATUS_LIST = [
      { value: "visual", label: "目視", code: "5" },
      { value: "before", label: "施工前", code: "1" },
      { value: "during", label: "施工中", code: "2" },
      { value: "after", label: "施工後", code: "3" }
    ];

    const SECTION_PHOTO_TYPE = { value: "section", label: "断面", code: "4" };
    const DB_NAME = "electronic-board-camera-prototype";
    const DB_VERSION = 1;
    const DB_STORE_NAME = "photos";
    const DEFAULT_POINT_NO = "1";
    const POINT_DISPLAY_DEFAULT = "1-①";
    const PHOTO_QUALITY_STORAGE_KEY = "electronic-board-camera-photo-quality";
    const PHOTO_QUALITY_SETTINGS = {
      standard: { label: "標準", width: 3024, height: 2268 },
      high: { label: "高画質", width: 3264, height: 2448 }
    };

    const cameraScreen = document.getElementById("cameraScreen");
    const captureFrame = document.getElementById("captureFrame");
    const video = document.getElementById("video");
    const cameraGuide = document.getElementById("cameraGuide");

    const boardWrap = document.getElementById("boardWrap");
    const photoBoard = document.getElementById("photoBoard");

    const subjectText = document.getElementById("subjectText");
    const addressText = document.getElementById("addressText");
    const roomNoInput = document.getElementById("roomNoInput");
    const sampleNoInput = document.getElementById("sampleNoInput");
    const dateText = document.getElementById("dateText");

    const startButton = document.getElementById("startButton");
    const viewButton = document.getElementById("viewButton");
    const sectionButton = document.getElementById("sectionButton");
    const shootButton = document.getElementById("shootButton");
    const statusButtons = Array.from(document.querySelectorAll(".status-btn"));

    const photoCount = document.getElementById("photoCount");
    const sectionModeBadge = document.getElementById("sectionModeBadge");
    const previewOverlay = document.getElementById("previewOverlay");
    const previewImage = document.getElementById("previewImage");
    const previewCounter = document.getElementById("previewCounter");
    const previewMeta = document.getElementById("previewMeta");
    const previewThumbnails = document.getElementById("previewThumbnails");
    const previewList = document.getElementById("previewList");
    const previewListToggleButton = document.getElementById("previewListToggleButton");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const qualityStandardButton = document.getElementById("qualityStandardButton");
    const qualityHighButton = document.getElementById("qualityHighButton");
    const toast = document.getElementById("toast");

    let currentStream = null;
    let selectedStatus = "visual";
    let isSectionMode = false;
    let hasInitializedBoard = false;
    let toastTimer = null;
    let dbInstance = null;

    const capturedPhotos = [];
    let previewIndex = 0;
    let isPreviewListMode = false;
    let photoQuality = loadPhotoQuality();

    const boardState = {
      x: 12,
      y: 12,
      scale: 1,
      minScale: 0.35,
      maxScale: 1.8
    };

    const activePointers = new Map();

    const gestureState = {
      mode: null,
      dragStartX: 0,
      dragStartY: 0,
      originX: 0,
      originY: 0,
      startScale: 1,
      startDistance: 0,
      localMidX: 0,
      localMidY: 0
    };

    let previewTouchStartX = 0;
    let previewTouchStartY = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      checkAppUpdate();
      initializeBoard();
      setupStatusButtons();
      setupBoardGesture();
      setupPreviewSwipe();
      setupPreviewImageTap();
      setupPhotoCountHiddenShoot();
      renderPhotoQualitySettings();

      await loadPhotosFromIndexedDB();

      requestAnimationFrame(() => {
        setInitialBoardLayout();
      });
    });

    window.addEventListener("resize", () => {
      handleWindowResize();
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        handleWindowResize();
      }, 200);
    });

    /*
     * iPhone / iPad のホーム画面PWA対策
     * 画面復帰時にカメラが止まることがあるため復帰を試す
     */
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && currentStream && !previewOverlay.classList.contains("show")) {
        resumeCameraAfterPreview();
      }
    });

    window.addEventListener("pageshow", () => {
      if (currentStream && !previewOverlay.classList.contains("show")) {
        resumeCameraAfterPreview();
      }
    });

    function initializeBoard() {
      subjectText.textContent = APP_DATA.subject;
      addressText.textContent = APP_DATA.address;
      roomNoInput.value = roomNoInput.value || "";
      sampleNoInput.value = sampleNoInput.value || POINT_DISPLAY_DEFAULT;
      updateCurrentDate();
      setStatus("visual");
      setSectionMode(false);
      updatePhotoCount();
    }

    function updateCurrentDate() {
      dateText.textContent = formatJapaneseDate(new Date());
    }

    function formatJapaneseDate(date) {
      const y = date.getFullYear();
      const m = date.getMonth() + 1;
      const d = date.getDate();
      return `${y}年${m}月${d}日`;
    }

    function formatFileDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      const s = String(date.getSeconds()).padStart(2, "0");
      return `${y}${m}${d}_${h}${min}${s}`;
    }

    function setupStatusButtons() {
      statusButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          setStatus(button.dataset.value);
        });
      });
    }

    function setStatus(value) {
      selectedStatus = value;
      setSectionMode(false);

      statusButtons.forEach((button) => {
        const checked = button.dataset.value === value;
        const box = button.querySelector(".status-box");

        button.setAttribute("aria-pressed", checked ? "true" : "false");

        if (box) {
          box.textContent = checked ? "■" : "□";
        }
      });
    }

    function setInitialBoardLayout() {
      const screen = getScreenSize();
      const base = getBoardBaseSize();

      const targetWidth = clamp(screen.width * 0.42, 240, 320);
      boardState.scale = targetWidth / base.width;

      const displayedHeight = base.height * boardState.scale;
      boardState.x = 8;
      boardState.y = screen.height - displayedHeight - 86;

      if (boardState.y < 8) {
        boardState.y = 8;
      }

      clampBoardWithinScreen();
      applyBoardTransform();
      hasInitializedBoard = true;
    }

    function handleWindowResize() {
      if (!hasInitializedBoard) {
        setInitialBoardLayout();
        return;
      }

      clampBoardWithinScreen();
      applyBoardTransform();
    }

    function getScreenSize() {
      return {
        width: captureFrame.clientWidth || window.innerWidth,
        height: captureFrame.clientHeight || window.innerHeight
      };
    }

    function getBoardBaseSize() {
      return {
        width: photoBoard.offsetWidth,
        height: photoBoard.offsetHeight
      };
    }

    function applyBoardTransform() {
      boardWrap.style.transform =
        `translate(${boardState.x}px, ${boardState.y}px) scale(${boardState.scale})`;
    }

    function clampBoardWithinScreen() {
      const screen = getScreenSize();
      const base = getBoardBaseSize();

      const boardWidth = base.width * boardState.scale;
      const boardHeight = base.height * boardState.scale;

      const maxX = Math.max(0, screen.width - boardWidth);
      const maxY = Math.max(0, screen.height - boardHeight);

      boardState.x = clamp(boardState.x, 0, maxX);
      boardState.y = clamp(boardState.y, 0, maxY);
      boardState.scale = clamp(boardState.scale, boardState.minScale, boardState.maxScale);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setupBoardGesture() {
      boardWrap.addEventListener("pointerdown", onBoardPointerDown);
      boardWrap.addEventListener("pointermove", onBoardPointerMove);
      boardWrap.addEventListener("pointerup", onBoardPointerEnd);
      boardWrap.addEventListener("pointercancel", onBoardPointerEnd);
      boardWrap.addEventListener("pointerleave", onBoardPointerEnd);
    }

    function onBoardPointerDown(event) {
      if (isInteractiveBoardTarget(event.target)) {
        return;
      }

      event.preventDefault();
      boardWrap.classList.add("dragging");

      try {
        boardWrap.setPointerCapture(event.pointerId);
      } catch (error) {}

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        gestureState.mode = "drag";
        gestureState.dragStartX = event.clientX;
        gestureState.dragStartY = event.clientY;
        gestureState.originX = boardState.x;
        gestureState.originY = boardState.y;
      } else if (activePointers.size === 2) {
        preparePinchGesture();
      }
    }

    function onBoardPointerMove(event) {
      if (!activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size >= 2) {
        handlePinchMove();
        return;
      }

      if (activePointers.size === 1 && gestureState.mode === "drag") {
        event.preventDefault();

        const dx = event.clientX - gestureState.dragStartX;
        const dy = event.clientY - gestureState.dragStartY;

        boardState.x = gestureState.originX + dx;
        boardState.y = gestureState.originY + dy;

        clampBoardWithinScreen();
        applyBoardTransform();
      }
    }

    function onBoardPointerEnd(event) {
      if (activePointers.has(event.pointerId)) {
        activePointers.delete(event.pointerId);
      }

      try {
        boardWrap.releasePointerCapture(event.pointerId);
      } catch (error) {}

      if (activePointers.size === 1) {
        const remaining = Array.from(activePointers.values())[0];

        gestureState.mode = "drag";
        gestureState.dragStartX = remaining.x;
        gestureState.dragStartY = remaining.y;
        gestureState.originX = boardState.x;
        gestureState.originY = boardState.y;
      } else {
        gestureState.mode = null;
        boardWrap.classList.remove("dragging");
      }
    }

    function preparePinchGesture() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return;

      const p1 = points[0];
      const p2 = points[1];
      const mid = getMidpoint(p1, p2);

      gestureState.mode = "pinch";
      gestureState.startDistance = getDistance(p1, p2);
      gestureState.startScale = boardState.scale;

      gestureState.localMidX = (mid.x - boardState.x) / boardState.scale;
      gestureState.localMidY = (mid.y - boardState.y) / boardState.scale;
    }

    function handlePinchMove() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return;

      const p1 = points[0];
      const p2 = points[1];

      const newDistance = getDistance(p1, p2);
      const mid = getMidpoint(p1, p2);

      if (!gestureState.startDistance) return;

      let nextScale =
        gestureState.startScale * (newDistance / gestureState.startDistance);

      nextScale = clamp(nextScale, boardState.minScale, boardState.maxScale);

      boardState.scale = nextScale;
      boardState.x = mid.x - gestureState.localMidX * boardState.scale;
      boardState.y = mid.y - gestureState.localMidY * boardState.scale;

      clampBoardWithinScreen();
      applyBoardTransform();
    }

    function getDistance(p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getMidpoint(p1, p2) {
      return {
        x: (p1.x + p2.x) / 2,
        y: (p1.y + p2.y) / 2
      };
    }

    function isInteractiveBoardTarget(target) {
      return Boolean(
        target.closest(".board-input") || target.closest(".board-editable") || target.closest(".status-btn")
      );
    }

    async function startCamera() {
      try {
        await requestFullscreenSafe();
        stopCurrentStream();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;

        await video.play();

        showCameraButtons();
        showToast("カメラを起動しました");
      } catch (error) {
        console.error(error);
        showToast("カメラを起動できませんでした");
      }
    }

    function stopCurrentStream() {
      if (!currentStream) return;

      currentStream.getTracks().forEach((track) => track.stop());
      currentStream = null;
      video.srcObject = null;
    }

    async function requestFullscreenSafe() {
      const target = document.documentElement;

      if (!document.fullscreenElement && target.requestFullscreen) {
        try {
          await target.requestFullscreen();
        } catch (error) {}
      }
    }

    function showCameraButtons() {
      cameraGuide.classList.add("hidden");
      startButton.classList.add("hidden-control");
      viewButton.classList.remove("hidden-control");
      sectionButton.classList.remove("hidden-control");
      shootButton.classList.remove("hidden-control");
    }

    function showStartButton() {
      cameraGuide.classList.remove("hidden");
      startButton.classList.remove("hidden-control");
      viewButton.classList.add("hidden-control");
      sectionButton.classList.add("hidden-control");
      shootButton.classList.add("hidden-control");
    }

    function toggleSectionMode() {
      setSectionMode(!isSectionMode);
    }

    function setSectionMode(enabled) {
      isSectionMode = Boolean(enabled);
      document.body.classList.toggle("section-mode", isSectionMode);
      sectionButton.classList.toggle("active", isSectionMode);

      // 断面モードの表示バッジは出さない。
      // ボタン色と看板の表示/非表示だけで状態を判断する。
      sectionModeBadge.classList.remove("show");
    }

    /*
     * プレビューから戻った後のカメラ復帰
     * iPhone / iPad のホーム画面PWAで重要
     */
    async function resumeCameraAfterPreview() {
      try {
        const hasLiveTrack =
          currentStream &&
          currentStream.getVideoTracks &&
          currentStream.getVideoTracks().some((track) => track.readyState === "live");

        if (hasLiveTrack) {
          video.srcObject = currentStream;
          await video.play();
          showCameraButtons();
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;
        await video.play();

        showCameraButtons();
      } catch (error) {
        console.error(error);
        showStartButton();
        showToast("カメラを再起動してください");
      }
    }

    async function takePhoto() {
      if (!currentStream || !video.srcObject || video.readyState < 2) {
        showToast("先にカメラを起動してください");
        return;
      }

      updateCurrentDate();

      try {
        // Canvasに文字を焼き込む前に、フォント読み込み完了を待つ
        // iPhone/iPadで日本語フォントの描画が不安定になるのを軽減する
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const canvas = captureCompositedImage();

        /*
         * iPhone/iPad向けに少し軽量化
         * 0.95だと重くなりやすいので 0.82
         */
        const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
        const createdAt = new Date();
        const photoType = getCurrentPhotoType();
        const sampleParts = parseSampleAndPoint(sampleNoInput.value);
        const sampleNo = sampleParts.sampleNo;
        const pointNo = sampleParts.pointNo;
        const fileName = generatePhotoFileName(sampleNo, pointNo, photoType.code);
        const photo = {
          id: `photo_${Date.now()}_${Math.random().toString(36).slice(2)}`,
          dataUrl,
          fileName,
          status: photoType.value,
          statusLabel: photoType.label,
          statusCode: photoType.code,
          sampleNo,
          pointNo,
          roomNo: roomNoInput.value.trim(),
          isSection: photoType.value === SECTION_PHOTO_TYPE.value,
          selected: false,
          createdAt: createdAt.toISOString()
        };

        capturedPhotos.push(photo);
        await savePhotoToIndexedDB(photo);

        previewIndex = capturedPhotos.length - 1;
        updatePhotoCount();

        if (navigator.vibrate) {
          navigator.vibrate(50);
        }

        showToast("撮影しました");
      } catch (error) {
        console.error(error);
        showToast("撮影に失敗しました");
      }
    }

    function captureCompositedImage() {
      const screen = getScreenSize();
      const quality = PHOTO_QUALITY_SETTINGS[photoQuality] || PHOTO_QUALITY_SETTINGS.standard;

      const canvas = document.createElement("canvas");
      canvas.width = quality.width;
      canvas.height = quality.height;

      const ctx = canvas.getContext("2d");

      // 4:3の撮影エリア全体を黒で塗る。
      // カメラ映像が4:3ではない端末でも、映像を切らずにcontainで中央表示する。
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      const videoScale = Math.min(
        canvas.width / videoWidth,
        canvas.height / videoHeight
      );

      const drawVideoW = videoWidth * videoScale;
      const drawVideoH = videoHeight * videoScale;
      const drawVideoX = (canvas.width - drawVideoW) / 2;
      const drawVideoY = (canvas.height - drawVideoH) / 2;

      ctx.drawImage(
        video,
        0,
        0,
        videoWidth,
        videoHeight,
        drawVideoX,
        drawVideoY,
        drawVideoW,
        drawVideoH
      );

      if (!isSectionMode) {
        const frameRect = captureFrame.getBoundingClientRect();
        const boardRect = photoBoard.getBoundingClientRect();

        // 撮影エリア自体を4:3にしているので、画面上の座標をそのまま4:3 Canvasへ変換する。
        // 横倍率・縦倍率は同じ比率になるため、看板は伸びない。
        const scaleX = canvas.width / frameRect.width;
        const scaleY = canvas.height / frameRect.height;

        const boardX = (boardRect.left - frameRect.left) * scaleX;
        const boardY = (boardRect.top - frameRect.top) * scaleY;
        const boardW = boardRect.width * scaleX;
        const boardH = boardRect.height * scaleY;

        drawBoardOnCanvas(ctx, boardX, boardY, boardW, boardH);
      }

      return canvas;
    }

    /* 写真ビューア */
    function openPreview() {
      if (!capturedPhotos.length) {
        showToast("撮影した写真がありません");
        return;
      }

      previewIndex = capturedPhotos.length - 1;
      setPreviewListMode(false);
      renderPreview();
      previewOverlay.classList.add("show");
    }

    async function closePreview() {
      previewOverlay.classList.remove("show");
      setPreviewListMode(false);

      /*
       * 戻るを押したらカメラ画面へ復帰
       * PWAでカメラが止まっていたら再取得を試す
       */
      await resumeCameraAfterPreview();
    }

    function showPrevPhoto() {
      if (!capturedPhotos.length) return;

      previewIndex -= 1;

      if (previewIndex < 0) {
        previewIndex = capturedPhotos.length - 1;
      }

      renderPreview();
    }

    function showNextPhoto() {
      if (!capturedPhotos.length) return;

      previewIndex += 1;

      if (previewIndex >= capturedPhotos.length) {
        previewIndex = 0;
      }

      renderPreview();
    }

    function renderPreview() {
      const photo = capturedPhotos[previewIndex];
      previewImage.src = photo.dataUrl;
      previewCounter.textContent = `${previewIndex + 1} / ${capturedPhotos.length}`;
      previewMeta.textContent = `${photo.fileName}　${photo.statusLabel || getStatusLabel(photo.status)}${photo.selected ? "　✓選択中" : ""}`;
      renderThumbnails();
      renderPhotoList();
    }

    function renderThumbnails() {
      previewThumbnails.innerHTML = "";

      capturedPhotos.forEach((photo, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "thumb-item";
        item.classList.toggle("current", index === previewIndex);
        item.classList.toggle("selected", Boolean(photo.selected));
        item.onclick = () => {
          previewIndex = index;
          renderPreview();
        };

        const img = document.createElement("img");
        img.src = photo.dataUrl;
        img.alt = photo.fileName;

        const check = document.createElement("span");
        check.className = "thumb-check";
        check.textContent = photo.selected ? "✓" : "";
        check.onclick = async (event) => {
          event.preventDefault();
          event.stopPropagation();
          await togglePhotoSelected(index);
        };

        item.appendChild(img);
        item.appendChild(check);
        previewThumbnails.appendChild(item);
      });

      const currentThumb = previewThumbnails.querySelector(".thumb-item.current");
      if (currentThumb) {
        currentThumb.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }

    function renderPhotoList() {
      previewList.innerHTML = "";

      capturedPhotos.forEach((photo, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "photo-list-item";
        item.classList.toggle("current", index === previewIndex);
        item.classList.toggle("selected", Boolean(photo.selected));
        item.onclick = () => {
          previewIndex = index;
          setPreviewListMode(false);
          renderPreview();
        };

        const img = document.createElement("img");
        img.src = photo.dataUrl;
        img.alt = photo.fileName;

        const check = document.createElement("span");
        check.className = "list-check";
        check.textContent = photo.selected ? "✓" : "";
        check.onclick = async (event) => {
          event.preventDefault();
          event.stopPropagation();
          await togglePhotoSelected(index, { keepListMode: true });
        };

        const info = document.createElement("div");
        info.className = "photo-list-info";

        const status = document.createElement("div");
        status.className = "photo-list-status";
        status.textContent = photo.statusLabel || getStatusLabel(photo.status);

        const file = document.createElement("div");
        file.textContent = photo.fileName;

        info.appendChild(status);
        info.appendChild(file);
        item.appendChild(img);
        item.appendChild(check);
        item.appendChild(info);
        previewList.appendChild(item);
      });
    }

    function togglePreviewListMode() {
      setPreviewListMode(!isPreviewListMode);
      renderPreview();
    }

    function setPreviewListMode(value) {
      isPreviewListMode = Boolean(value);
      previewOverlay.classList.toggle("list-mode", isPreviewListMode);
      previewListToggleButton.textContent = isPreviewListMode ? "拡大" : "一覧";
    }

    async function toggleCurrentPhotoSelected() {
      if (!capturedPhotos.length) return;
      await togglePhotoSelected(previewIndex);
    }

    async function togglePhotoSelected(index, options = {}) {
      const photo = capturedPhotos[index];
      photo.selected = !photo.selected;
      await savePhotoToIndexedDB(photo);
      updatePhotoCount();
      renderPreview();

      if (options.keepListMode) {
        setPreviewListMode(true);
      }
    }

    async function saveCurrentPreviewPhoto() {
      if (!capturedPhotos.length) {
        showToast("撮影した写真がありません");
        return;
      }

      const selectedPhotos = capturedPhotos.filter((photo) => photo.selected);

      if (!selectedPhotos.length) {
        showToast("共有する写真をチェックしてください");
        return;
      }

      await shareOrDownloadPhotos(selectedPhotos);
    }

    async function deleteSelectedPreviewPhotos() {
      if (!capturedPhotos.length) {
        showToast("撮影した写真がありません");
        return;
      }

      const selectedPhotos = capturedPhotos.filter((photo) => photo.selected);

      if (!selectedPhotos.length) {
        showToast("削除する写真をチェックしてください");
        return;
      }

      const ok = window.confirm(`選択した画像 ${selectedPhotos.length}枚を削除しますか？`);
      if (!ok) return;

      const selectedIds = new Set(selectedPhotos.map((photo) => photo.id));

      for (const photo of selectedPhotos) {
        await deletePhotoFromIndexedDB(photo.id);
      }

      for (let i = capturedPhotos.length - 1; i >= 0; i--) {
        if (selectedIds.has(capturedPhotos[i].id)) {
          capturedPhotos.splice(i, 1);
        }
      }

      if (!capturedPhotos.length) {
        previewOverlay.classList.remove("show");
        setPreviewListMode(false);
        previewIndex = 0;

        await resumeCameraAfterPreview();
      } else {
        previewIndex = Math.min(previewIndex, capturedPhotos.length - 1);
        renderPreview();
      }

      updatePhotoCount();
      showToast("削除しました");
    }

    async function shareOrDownloadPhotos(photos) {
      if (!photos.length) return;

      if (navigator.share && navigator.canShare) {
        try {
          const files = photos.map((photo) => {
            const blob = dataUrlToBlob(photo.dataUrl);
            return new File([blob], photo.fileName, { type: "image/jpeg" });
          });

          if (navigator.canShare({ files })) {
            await navigator.share({
              files,
              title: photos.length === 1 ? photos[0].fileName : `電子看板写真 ${photos.length}枚`
            });
            return;
          }
        } catch (error) {
          if (error && error.name === "AbortError") return;
          console.error(error);
          showToast("共有できませんでした");
        }
      }

      photos.forEach((photo, index) => {
        setTimeout(() => {
          const link = document.createElement("a");
          link.href = photo.dataUrl;
          link.download = photo.fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }, index * 250);
      });
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const header = parts[0];
      const base64 = parts[1];
      const mimeMatch = header.match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
      const binary = atob(base64);
      const array = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        array[i] = binary.charCodeAt(i);
      }

      return new Blob([array], { type: mime });
    }

    function setupPreviewSwipe() {
      previewOverlay.addEventListener("touchstart", (event) => {
        if (!event.touches || event.touches.length !== 1) return;

        previewTouchStartX = event.touches[0].clientX;
        previewTouchStartY = event.touches[0].clientY;
      }, { passive: true });

      previewOverlay.addEventListener("touchend", (event) => {
        if (!event.changedTouches || event.changedTouches.length !== 1) return;
        if (isPreviewListMode) return;

        const endX = event.changedTouches[0].clientX;
        const endY = event.changedTouches[0].clientY;

        const dx = endX - previewTouchStartX;
        const dy = endY - previewTouchStartY;

        if (Math.abs(dx) < 45) return;
        if (Math.abs(dx) < Math.abs(dy)) return;

        if (dx < 0) {
          showNextPhoto();
        } else {
          showPrevPhoto();
        }
      }, { passive: true });
    }

    /*
     * 写真プレビューの大きい画像をタップしたら、現在の写真を選択/解除する。
     * サムネイルの小さいチェックだけだと現場で押しにくいため、画像全体をチェック操作にする。
     */
    function setupPhotoCountHiddenShoot() {
      // 隠し機能：左上の「撮影済み ○枚 / 選択 ○枚」を押しても撮影する。
      // 音量ボタン撮影の代わりに、片手で押しやすいサブシャッターとして使う。
      photoCount.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopPropagation();

        // プレビュー表示中は誤作動させない。
        if (previewOverlay.classList.contains("show")) return;

        await takePhoto();
      });
    }

    function setupPreviewImageTap() {
      previewImage.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopPropagation();
        await toggleCurrentPhotoSelected();
      });
    }

    function updatePhotoCount() {
      const selectedCount = capturedPhotos.filter((photo) => photo.selected).length;
      photoCount.textContent = `撮影済み ${capturedPhotos.length}枚 / 選択 ${selectedCount}枚`;
    }

    function getStatusLabel(value) {
      if (value === SECTION_PHOTO_TYPE.value) return SECTION_PHOTO_TYPE.label;
      const found = STATUS_LIST.find(item => item.value === value);
      return found ? found.label : value;
    }

    function getCurrentPhotoType() {
      if (isSectionMode) return SECTION_PHOTO_TYPE;
      return STATUS_LIST.find((item) => item.value === selectedStatus) || STATUS_LIST[0];
    }

    function getStatusCode(value) {
      if (value === SECTION_PHOTO_TYPE.value) return SECTION_PHOTO_TYPE.code;
      const found = STATUS_LIST.find((item) => item.value === value);
      return found ? found.code : "0";
    }

    function normalizeFilePart(value) {
      const text = normalizeFullWidthText(String(value || "").trim());
      return text ? text.replace(/[^0-9A-Za-z_-]/g, "") : "1";
    }

    /*
     * 看板表示用の「試料No.」には、現場運用上「1-①」のような表記が入る想定。
     * ファイル名では丸数字を半角数字に直し、「1-①」も「1-1」も同じ 1-1 として扱う。
     */
    function parseSampleAndPoint(value) {
      const rawText = String(value || "").trim() || POINT_DISPLAY_DEFAULT;
      const normalized = normalizeFullWidthText(rawText)
        .replace(/[−ー―‐]/g, "-")
        .replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g, (char) => String("①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳".indexOf(char) + 1));

      const parts = normalized.split("-").filter(Boolean);

      return {
        sampleNo: normalizeFilePart(parts[0] || normalized || "1"),
        pointNo: normalizeFilePart(parts[1] || DEFAULT_POINT_NO)
      };
    }

    function normalizeFullWidthText(value) {
      return String(value || "").replace(/[！-～]/g, (char) => {
        return String.fromCharCode(char.charCodeAt(0) - 0xFEE0);
      }).replace(/　/g, " ");
    }

    function generatePhotoFileName(sampleNo, pointNo, statusCode) {
      const baseName = `${sampleNo}-${pointNo}-${statusCode}`;
      const sameCount = capturedPhotos.filter((photo) => {
        return photo.sampleNo === sampleNo &&
          photo.pointNo === pointNo &&
          photo.statusCode === statusCode;
      }).length;

      if (sameCount === 0) {
        return `${baseName}.jpg`;
      }

      return `${baseName}_${String(sameCount + 1).padStart(2, "0")}.jpg`;
    }

    function openPhotoDB() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          resolve(null);
          return;
        }

        if (dbInstance) {
          resolve(dbInstance);
          return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(DB_STORE_NAME)) {
            db.createObjectStore(DB_STORE_NAME, { keyPath: "id" });
          }
        };

        request.onsuccess = () => {
          dbInstance = request.result;
          resolve(dbInstance);
        };

        request.onerror = () => {
          console.error(request.error);
          reject(request.error);
        };
      });
    }

    async function loadPhotosFromIndexedDB() {
      try {
        const db = await openPhotoDB();
        if (!db) return;

        const photos = await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readonly");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.getAll();

          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });

        capturedPhotos.splice(0, capturedPhotos.length, ...photos.sort((a, b) => {
          return new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
        }));

        if (capturedPhotos.length) {
          previewIndex = capturedPhotos.length - 1;
        }

        updatePhotoCount();
      } catch (error) {
        console.error(error);
        showToast("端末内保存の読込に失敗しました");
      }
    }

    async function savePhotoToIndexedDB(photo) {
      try {
        const db = await openPhotoDB();
        if (!db) return;

        await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readwrite");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.put(photo);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      } catch (error) {
        console.error(error);
        showToast("端末内保存に失敗しました");
      }
    }

    async function deletePhotoFromIndexedDB(photoId) {
      try {
        const db = await openPhotoDB();
        if (!db) return;

        await new Promise((resolve, reject) => {
          const transaction = db.transaction(DB_STORE_NAME, "readwrite");
          const store = transaction.objectStore(DB_STORE_NAME);
          const request = store.delete(photoId);

          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      } catch (error) {
        console.error(error);
        showToast("端末内写真の削除に失敗しました");
      }
    }

    /* キャンバス上に看板を描画 */
    function drawBoardOnCanvas(ctx, x, y, w, h) {
      const data = {
        subject: subjectText.textContent || "",
        address: addressText.textContent || "",
        roomNo: roomNoInput.value.trim(),
        sampleNo: sampleNoInput.value.trim(),
        date: dateText.textContent || "",
        status: selectedStatus
      };

      const outerLine = Math.max(1.2, h * 0.0085);
      const innerLine = Math.max(0.9, h * 0.0065);
      const frameGap = Math.max(2.2, h * 0.017);
      const frameInset = outerLine + frameGap;

      const outerX = x;
      const outerY = y;
      const outerW = w;
      const outerH = h;

      // 細線二重枠の内側に、表本体を描く。
      x = outerX + frameInset;
      y = outerY + frameInset;
      w = Math.max(1, outerW - frameInset * 2);
      h = Math.max(1, outerH - frameInset * 2);

      const leftColW = w * 0.20;
      const rightW = w - leftColW;

      const row1H = h * (52 / 230);
      const row2H = h * (40 / 230);
      const row3H = h * (96 / 230);
      const row4H = h - row1H - row2H - row3H;

      const contentY = y + row1H + row2H;
      const contentH = row3H;

      // 確定設定：No.セル「少し広」+ 値位置「右」。
      // テストHTMLの 120px + 48px を、右側幅416px基準の比率でCanvasへ反映する。
      const innerLabelW = rightW * 0.404;
      const roomRowH = contentH * 0.31;
      const sampleRowH = contentH * 0.31;
      const statusRowH = contentH - roomRowH - sampleRowH;

      ctx.save();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(outerX, outerY, outerW, outerH);

      ctx.strokeStyle = "#000000";
      ctx.lineJoin = "miter";
      drawOuterBorder(ctx, outerX, outerY, outerW, outerH, outerLine);
      drawOuterBorder(ctx, x, y, w, h, innerLine);

      ctx.lineWidth = innerLine;

      drawLine(ctx, x + leftColW, y, x + leftColW, y + h);
      drawLine(ctx, x, y + row1H, x + w, y + row1H);
      drawLine(ctx, x, y + row1H + row2H, x + w, y + row1H + row2H);
      drawLine(ctx, x, y + row1H + row2H + row3H, x + w, y + row1H + row2H + row3H);

      drawLine(ctx, x + leftColW, contentY + roomRowH, x + w, contentY + roomRowH);
      drawLine(ctx, x + leftColW, contentY + roomRowH + sampleRowH, x + w, contentY + roomRowH + sampleRowH);
      // 部屋No. / 試料No. はラベルと値の間の縦線を描かない。

      const labelFont = Math.max(10, w * 0.046);
      const titleFont = Math.max(10, w * 0.047);
      const addressFont = Math.max(10, w * 0.044);
      const innerLabelFont = Math.max(9, w * 0.043);
      const innerValueFont = Math.max(11, w * 0.055);
      const statusFont = Math.max(9, w * 0.038);
      const dateFont = Math.max(12, w * 0.055);

      drawCenteredText(ctx, "件名", x, y, leftColW, row1H, labelFont);
      drawCenteredText(ctx, "採取場所", x, y + row1H, leftColW, row2H, labelFont);
      drawCenteredText(ctx, "内容", x, contentY, leftColW, contentH, labelFont);
      drawCenteredText(ctx, "日付", x, y + row1H + row2H + row3H, leftColW, row4H, labelFont);

      drawWrappedCenterText(ctx, data.subject, x + leftColW + 6, y, rightW - 12, row1H, titleFont, 1.25, 2);
      drawWrappedCenterText(ctx, data.address, x + leftColW + 6, y + row1H, rightW - 12, row2H, addressFont, 1.2, 2);

      drawLeftMiddleText(ctx, "　部屋No.", x + leftColW + 8, contentY, innerLabelW - 8, roomRowH, innerLabelFont);
      drawLeftMiddleText(ctx, "　試料No.", x + leftColW + 8, contentY + roomRowH, innerLabelW - 8, sampleRowH, innerLabelFont);

      drawLeftMiddleText(ctx, data.roomNo, x + leftColW + innerLabelW, contentY, rightW - innerLabelW, roomRowH, innerValueFont);
      drawLeftMiddleText(ctx, data.sampleNo, x + leftColW + innerLabelW, contentY + roomRowH, rightW - innerLabelW, sampleRowH, innerValueFont);

      const statusStartX = x + leftColW + 3;
      const statusWidth = rightW - 6;
      const segmentW = statusWidth / STATUS_LIST.length;
      const statusCenterY = contentY + roomRowH + sampleRowH + statusRowH / 2;

      ctx.fillStyle = "#000";
      ctx.font = `900 ${statusFont}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      STATUS_LIST.forEach((item, index) => {
        const symbol = item.value === data.status ? "■" : "□";
        const text = `${symbol}${item.label}`;
        const centerX = statusStartX + segmentW * index + segmentW / 2;
        ctx.fillText(text, centerX, statusCenterY);
      });

      drawCenteredText(ctx, data.date, x + leftColW, y + row1H + row2H + row3H, rightW, row4H, dateFont);

      // 最後に二重枠をもう一度描いて、焼き込み時の外周を安定させる。
      drawOuterBorder(ctx, outerX, outerY, outerW, outerH, outerLine);
      drawOuterBorder(ctx, x, y, w, h, innerLine);

      ctx.restore();
    }

    function drawOuterBorder(ctx, x, y, w, h, lineWidth) {
      ctx.save();
      ctx.fillStyle = "#000000";
      ctx.fillRect(x, y, w, lineWidth);
      ctx.fillRect(x, y + h - lineWidth, w, lineWidth);
      ctx.fillRect(x, y, lineWidth, h);
      ctx.fillRect(x + w - lineWidth, y, lineWidth, h);
      ctx.restore();
    }

    function drawLine(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCenteredText(ctx, text, x, y, w, h, fontSize) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "", x + w / 2, y + h / 2);
      ctx.restore();
    }

    function drawLeftMiddleText(ctx, text, x, y, w, h, fontSize) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "", x, y + h / 2);
      ctx.restore();
    }

    function drawWrappedLeftText(ctx, text, x, y, w, h, fontSize, lineRate, maxLines) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const lines = getWrappedLines(ctx, text || "", w).slice(0, maxLines);
      const lineHeight = fontSize * lineRate;
      const totalHeight = lines.length * lineHeight;
      let currentY = y + h / 2 - totalHeight / 2 + lineHeight / 2;

      lines.forEach((line) => {
        ctx.fillText(line, x, currentY);
        currentY += lineHeight;
      });

      ctx.restore();
    }

    function drawWrappedCenterText(ctx, text, x, y, w, h, fontSize, lineRate, maxLines) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const lines = getWrappedLines(ctx, text || "", w).slice(0, maxLines);
      const lineHeight = fontSize * lineRate;
      const totalHeight = lines.length * lineHeight;
      let currentY = y + h / 2 - totalHeight / 2 + lineHeight / 2;

      lines.forEach((line) => {
        ctx.fillText(line, x + w / 2, currentY);
        currentY += lineHeight;
      });

      ctx.restore();
    }

    function getWrappedLines(ctx, text, maxWidth) {
      const lines = [];
      let current = "";

      for (const char of String(text)) {
        const test = current + char;
        const testWidth = ctx.measureText(test).width;

        if (testWidth > maxWidth && current !== "") {
          lines.push(current);
          current = char;
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);
      return lines.length ? lines : [""];
    }

    function loadPhotoQuality() {
      try {
        const saved = localStorage.getItem(PHOTO_QUALITY_STORAGE_KEY);
        if (saved && PHOTO_QUALITY_SETTINGS[saved]) return saved;
      } catch (error) {}

      return "standard";
    }

    function setPhotoQuality(value) {
      if (!PHOTO_QUALITY_SETTINGS[value]) return;

      photoQuality = value;

      try {
        localStorage.setItem(PHOTO_QUALITY_STORAGE_KEY, value);
      } catch (error) {}

      renderPhotoQualitySettings();
      const setting = PHOTO_QUALITY_SETTINGS[photoQuality];
      showToast(`${setting.label}（${setting.width}×${setting.height}）にしました`);
    }

    function renderPhotoQualitySettings() {
      if (!qualityStandardButton || !qualityHighButton) return;

      qualityStandardButton.classList.toggle("active", photoQuality === "standard");
      qualityHighButton.classList.toggle("active", photoQuality === "high");
    }

    function openSettings() {
      renderPhotoQualitySettings();
      settingsOverlay.classList.add("show");
    }

    function closeSettings() {
      settingsOverlay.classList.remove("show");
    }

    async function checkAppUpdate() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("_update_check", Date.now());

        const response = await fetch(url.toString(), {
          cache: "no-store"
        });

        const html = await response.text();
        const match = html.match(/const APP_VERSION = "([^"]+)"/);

        if (!match) return;

        const latestVersion = match[1];

        if (latestVersion !== APP_VERSION) {
          const ok = window.confirm(
            `新しいバージョンがあります。\n\n現在：${APP_VERSION}\n最新：${latestVersion}\n\n更新しますか？`
          );

          if (ok) {
            const reloadUrl = new URL(window.location.href);
            reloadUrl.searchParams.set("v", latestVersion);
            window.location.href = reloadUrl.toString();
          }
        }
      } catch (error) {
        console.log("更新確認に失敗しました", error);
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1400);
    }
  </script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => console.log("Service Worker 登録完了"))
      .catch(err => console.error("Service Worker登録失敗", err));
  });
}
</script>
