<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>電子看板カメラテスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
      color: #000;
      overflow-x: hidden;
    }

    /* =========================
     * カメラ画面全体
     * ========================= */
    .camera-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* カメラ映像 */
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* カメラ未起動時の案内 */
    .camera-guide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      text-align: center;
      font-weight: 700;
      line-height: 1.7;
      background: #111;
      z-index: 1;
    }

    .camera-guide.hidden {
      display: none;
    }

    /* =========================
     * 電子看板
     * カメラ映像の上に常時表示
     * ========================= */
    .board-frame {
      position: absolute;
      left: 8px;
      bottom: 94px;
      width: min(96vw, 620px);
      background: #fff;
      border: 6px solid #000;
      padding: 6px;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .board {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .board th,
    .board td {
      border: 2.5px solid #000;
      vertical-align: middle;
      padding: 8px 10px;
    }

    .label-cell {
      width: 20%;
      text-align: center;
      font-weight: 900;
      font-size: clamp(14px, 3.6vw, 28px);
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    .value-cell {
      font-weight: 800;
      font-size: clamp(14px, 3.6vw, 30px);
    }

    .editable-text {
      width: 100%;
      min-height: 1.35em;
      outline: none;
      border: none;
      background: transparent;
      line-height: 1.3;
      word-break: break-word;
    }

    .project-name {
      min-height: 2.4em;
    }

    .address {
      font-size: clamp(14px, 3.4vw, 28px);
    }

    /* 内容欄 */
    .content-cell {
      padding: 0 !important;
    }

    .content-box {
      display: flex;
      flex-direction: column;
      min-height: 150px;
    }

    .content-row {
      display: grid;
      grid-template-columns: 105px 1fr;
      align-items: center;
      border-bottom: 2.5px solid #000;
    }

    .content-label {
      border-right: 2.5px solid #000;
      padding: 8px 8px;
      font-weight: 900;
      font-size: clamp(14px, 3.4vw, 26px);
      white-space: nowrap;
    }

    .content-input-wrap {
      padding: 8px 10px;
    }

    .content-input {
      width: 100%;
      min-height: 1.2em;
      outline: none;
      border: none;
      background: transparent;
      font-size: clamp(18px, 4.4vw, 36px);
      font-weight: 900;
      line-height: 1.15;
    }

    /* チェックボックス横並び */
    .check-row-wrap {
      padding: 9px 6px;
      display: flex;
      align-items: center;
      min-height: 44px;
    }

    .check-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
    }

    .check-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-size: clamp(12px, 3vw, 23px);
      font-weight: 900;
      text-align: center;
    }

    .check-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .check-box {
      width: clamp(14px, 3.2vw, 24px);
      height: clamp(14px, 3.2vw, 24px);
      border: 2.5px solid #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
      font-size: clamp(12px, 2.5vw, 20px);
      font-weight: 900;
    }

    .check-item input:checked + .check-box::before {
      content: "✓";
    }

    .date-text {
      text-align: center;
      font-size: clamp(17px, 4.4vw, 34px);
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    /* =========================
     * 操作ボタン
     * ========================= */
    .controls {
      position: absolute;
      left: 0;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 100%;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 10px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .btn-start {
      background: #2f80ed;
      color: #fff;
    }

    .btn-shoot {
      background: #fff;
      color: #000;
      min-width: 92px;
    }

    .btn-clear {
      background: #444;
      color: #fff;
    }

    /* =========================
     * 撮影結果
     * ========================= */
    .result-area {
      background: #1e1e1e;
      color: #fff;
      padding: 12px;
    }

    .result-title {
      font-weight: 900;
      margin-bottom: 8px;
    }

    #resultImage {
      width: 100%;
      max-width: 900px;
      display: none;
      border: 1px solid #666;
      background: #000;
    }

    .download-link {
      display: none;
      margin: 8px 0 12px 0;
      padding: 10px 14px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 900;
    }

    .memo {
      color: #ddd;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 10px;
    }

    @media (max-height: 680px) {
      .board-frame {
        bottom: 78px;
        transform: scale(0.86);
        transform-origin: left bottom;
      }

      .controls {
        bottom: calc(8px + env(safe-area-inset-bottom));
      }

      button {
        padding: 10px 13px;
        font-size: 13px;
      }
    }

    @media (max-width: 430px) {
      .board-frame {
        border-width: 5px;
        padding: 5px;
      }

      .board th,
      .board td {
        border-width: 2px;
        padding: 6px 8px;
      }

      .content-row {
        grid-template-columns: 86px 1fr;
        border-bottom-width: 2px;
      }

      .content-label {
        border-right-width: 2px;
        padding: 7px 6px;
      }

      .check-box {
        border-width: 2px;
      }
    }
  </style>
</head>

<body>
  <section class="camera-screen">
    <!-- カメラ映像 -->
    <video id="video" autoplay playsinline muted></video>

    <!-- カメラ未起動時の表示 -->
    <div id="cameraGuide" class="camera-guide">
      <div>
        「カメラ起動」を押してください。<br>
        スマホではカメラ許可が出たら「許可」を押します。
      </div>
    </div>

    <!-- 電子看板 -->
    <div id="photoBoard" class="board-frame">
      <table class="board" aria-label="電子看板">
        <tr>
          <th class="label-cell">件 名</th>
          <td class="value-cell">
            <div
              id="projectName"
              class="editable-text project-name"
              contenteditable="true"
              spellcheck="false"
            >テストビル解体に伴うアスベスト調査</div>
          </td>
        </tr>

        <tr>
          <th class="label-cell">採取場所</th>
          <td class="value-cell">
            <div
              id="address"
              class="editable-text address"
              contenteditable="true"
              spellcheck="false"
            >神奈川県小田原市小八幡2-3-6</div>
          </td>
        </tr>

        <tr>
          <th class="label-cell">内 容</th>
          <td class="content-cell">
            <div class="content-box">
              <div class="content-row">
                <div class="content-label">部屋No.</div>
                <div class="content-input-wrap">
                  <div
                    id="roomNo"
                    class="content-input"
                    contenteditable="true"
                    spellcheck="false"
                  ></div>
                </div>
              </div>

              <div class="content-row">
                <div class="content-label">試料No.</div>
                <div class="content-input-wrap">
                  <div
                    id="sampleNo"
                    class="content-input"
                    contenteditable="true"
                    spellcheck="false"
                  ></div>
                </div>
              </div>

              <div class="check-row-wrap">
                <div class="check-row">
                  <label class="check-item">
                    <input type="checkbox" id="checkVisual" checked />
                    <span class="check-box" aria-hidden="true"></span>
                    <span>目視</span>
                  </label>

                  <label class="check-item">
                    <input type="checkbox" id="checkBefore" />
                    <span class="check-box" aria-hidden="true"></span>
                    <span>施工前</span>
                  </label>

                  <label class="check-item">
                    <input type="checkbox" id="checkDuring" />
                    <span class="check-box" aria-hidden="true"></span>
                    <span>施工中</span>
                  </label>

                  <label class="check-item">
                    <input type="checkbox" id="checkAfter" />
                    <span class="check-box" aria-hidden="true"></span>
                    <span>施工後</span>
                  </label>
                </div>
              </div>
            </div>
          </td>
        </tr>

        <tr>
          <th class="label-cell">日 付</th>
          <td class="value-cell">
            <div
              id="dateText"
              class="editable-text date-text"
              contenteditable="true"
              spellcheck="false"
            ></div>
          </td>
        </tr>
      </table>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button class="btn-start" type="button" onclick="startCamera()">カメラ起動</button>
      <button class="btn-shoot" type="button" onclick="takePhoto()">撮影</button>
      <button class="btn-clear" type="button" onclick="clearResult()">結果削除</button>
    </div>
  </section>

  <section class="result-area">
    <div class="result-title">撮影結果</div>
    <a id="downloadLink" class="download-link" download="electronic-board-photo.jpg">画像を保存</a>
    <img id="resultImage" alt="撮影結果" />

    <div class="memo">
      ※ 看板内の文字はタップして編集できます。<br>
      ※ チェックボックスも撮影前に操作できます。<br>
      ※ 撮影すると、カメラ映像と看板を1枚の画像として保存できます。
    </div>
  </section>

  <script>
    const video = document.getElementById("video");
    const photoBoard = document.getElementById("photoBoard");
    const cameraGuide = document.getElementById("cameraGuide");
    const resultImage = document.getElementById("resultImage");
    const downloadLink = document.getElementById("downloadLink");

    setTodayIfEmpty();

    /**
     * カメラを起動する
     * スマホでは背面カメラを優先する
     */
    async function startCamera() {
      try {
        stopCurrentStream();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;
        cameraGuide.classList.add("hidden");
      } catch (error) {
        console.error(error);
        alert(
          "カメラを起動できませんでした。\n\n" +
          "スマホではHTTPSのURLで開く必要があります。\n" +
          "GitHub PagesのURLから開いてください。"
        );
      }
    }

    /**
     * 起動中のカメラを停止する
     */
    function stopCurrentStream() {
      if (!video.srcObject) return;

      const tracks = video.srcObject.getTracks();
      tracks.forEach(track => track.stop());
      video.srcObject = null;
    }

    /**
     * 撮影する
     * カメラ映像 + 電子看板をcanvasへ描画して画像化する
     */
    function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        alert("先にカメラを起動してください。");
        return;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // カメラ映像を描画
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 表示上の位置を取得
      const videoRect = video.getBoundingClientRect();
      const boardRect = photoBoard.getBoundingClientRect();

      const scaleX = canvas.width / videoRect.width;
      const scaleY = canvas.height / videoRect.height;

      const boardX = (boardRect.left - videoRect.left) * scaleX;
      const boardY = (boardRect.top - videoRect.top) * scaleY;
      const boardW = boardRect.width * scaleX;
      const boardH = boardRect.height * scaleY;

      drawBoardOnCanvas(ctx, boardX, boardY, boardW, boardH);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);

      resultImage.src = dataUrl;
      resultImage.style.display = "block";

      downloadLink.href = dataUrl;
      downloadLink.style.display = "inline-block";

      setTimeout(() => {
        resultImage.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    }

    /**
     * 撮影結果を消す
     */
    function clearResult() {
      resultImage.src = "";
      resultImage.style.display = "none";
      downloadLink.href = "";
      downloadLink.style.display = "none";
    }

    /**
     * canvasに看板を描画する
     * HTMLをそのまま画像化せず、同じ内容をcanvas上に描き直す
     */
    function drawBoardOnCanvas(ctx, x, y, w, h) {
      const projectName = getText("projectName");
      const address = getText("address");
      const roomNo = getText("roomNo");
      const sampleNo = getText("sampleNo");
      const dateText = getText("dateText");

      const checks = [
        { label: "目視", checked: document.getElementById("checkVisual").checked },
        { label: "施工前", checked: document.getElementById("checkBefore").checked },
        { label: "施工中", checked: document.getElementById("checkDuring").checked },
        { label: "施工後", checked: document.getElementById("checkAfter").checked }
      ];

      ctx.save();

      // 外側黒枠
      ctx.fillStyle = "#000";
      ctx.fillRect(x, y, w, h);

      const pad = Math.max(5, w * 0.012);
      const bx = x + pad;
      const by = y + pad;
      const bw = w - pad * 2;
      const bh = h - pad * 2;

      // 看板白背景
      ctx.fillStyle = "#fff";
      ctx.fillRect(bx, by, bw, bh);

      ctx.strokeStyle = "#000";
      ctx.lineWidth = Math.max(2, w * 0.006);

      // 行と列の設計
      const labelW = bw * 0.2;
      const row1H = bh * 0.24;
      const row2H = bh * 0.22;
      const row3H = bh * 0.36;
      const row4H = bh - row1H - row2H - row3H;

      // 外枠
      ctx.strokeRect(bx, by, bw, bh);

      // 横線
      drawLine(ctx, bx, by + row1H, bx + bw, by + row1H);
      drawLine(ctx, bx, by + row1H + row2H, bx + bw, by + row1H + row2H);
      drawLine(ctx, bx, by + row1H + row2H + row3H, bx + bw, by + row1H + row2H + row3H);

      // 縦線
      drawLine(ctx, bx + labelW, by, bx + labelW, by + bh);

      const labelFont = Math.max(14, bw * 0.042);
      const valueFont = Math.max(14, bw * 0.045);
      const contentFont = Math.max(13, bw * 0.04);
      const dateFont = Math.max(17, bw * 0.052);

      // 左ラベル
      drawCenter(ctx, "件 名", bx, by, labelW, row1H, labelFont);
      drawCenter(ctx, "採取場所", bx, by + row1H, labelW, row2H, labelFont);
      drawCenter(ctx, "内 容", bx, by + row1H + row2H, labelW, row3H, labelFont);
      drawCenter(ctx, "日 付", bx, by + row1H + row2H + row3H, labelW, row4H, labelFont);

      // 右テキスト
      drawFitText(ctx, projectName, bx + labelW + 10, by + row1H * 0.55, bw - labelW - 20, valueFont);
      drawFitText(ctx, address, bx + labelW + 10, by + row1H + row2H * 0.58, bw - labelW - 20, valueFont);

      // 内容欄
      const cx = bx + labelW;
      const cy = by + row1H + row2H;
      const cw = bw - labelW;

      const subRowH = row3H * 0.31;

      // 部屋No / 試料No 区切り
      drawLine(ctx, cx, cy + subRowH, bx + bw, cy + subRowH);
      drawLine(ctx, cx, cy + subRowH * 2, bx + bw, cy + subRowH * 2);

      const subLabelW = cw * 0.33;
      drawLine(ctx, cx + subLabelW, cy, cx + subLabelW, cy + subRowH * 2);

      drawLeft(ctx, "部屋No.", cx + 8, cy + subRowH * 0.62, contentFont);
      drawLeft(ctx, roomNo, cx + subLabelW + 8, cy + subRowH * 0.62, contentFont * 1.25);

      drawLeft(ctx, "試料No.", cx + 8, cy + subRowH + subRowH * 0.62, contentFont);
      drawLeft(ctx, sampleNo, cx + subLabelW + 8, cy + subRowH + subRowH * 0.62, contentFont * 1.25);

      // チェック横並び
      const checkY = cy + subRowH * 2 + (row3H - subRowH * 2) * 0.62;
      const eachW = cw / 4;

      checks.forEach((item, index) => {
        const mark = item.checked ? "☑" : "□";
        drawCenter(
          ctx,
          mark + item.label,
          cx + eachW * index,
          cy + subRowH * 2,
          eachW,
          row3H - subRowH * 2,
          contentFont * 0.95
        );
      });

      // 日付
      drawCenter(
        ctx,
        dateText,
        bx + labelW,
        by + row1H + row2H + row3H,
        bw - labelW,
        row4H,
        dateFont
      );

      ctx.restore();
    }

    function drawLine(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCenter(ctx, text, x, y, w, h, fontSize) {
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    function drawLeft(ctx, text, x, y, fontSize) {
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(text, x, y);
    }

    function drawFitText(ctx, text, x, y, maxWidth, fontSize) {
      let size = fontSize;
      ctx.fillStyle = "#000";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.font = `900 ${size}px sans-serif`;

      while (ctx.measureText(text).width > maxWidth && size > 10) {
        size -= 1;
        ctx.font = `900 ${size}px sans-serif`;
      }

      ctx.fillText(text, x, y);
    }

    function getText(id) {
      return document.getElementById(id).textContent.trim();
    }

    function setTodayIfEmpty() {
      const el = document.getElementById("dateText");
      if (!el) return;

      if (el.textContent.trim()) return;

      const now = new Date();
      el.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
    }
  </script>
</body>
</html>
