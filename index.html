<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.json" />
  <title>電子看板カメラ</title>

  <link rel="stylesheet" href="./styles/app.css" />
</head>

<body>

  <div id="launchModeOverlay" aria-label="起動方法を選択">
    <div class="launch-mode-card">
      <div class="launch-mode-title">電子看板カメラ</div>
      <div class="launch-mode-subtitle">撮影するか、既存写真へ看板を追加するか選択してください</div>
      <div class="launch-mode-actions">
        <button class="launch-mode-button launch-camera-button" type="button" onclick="chooseCameraMode()">📷 カメラを起動</button>
        <button class="launch-mode-button launch-import-button" type="button" onclick="chooseImportMode()">🖼 写真から看板を付ける</button>
      </div>
      <div id="launchResumePanel" class="launch-resume-panel">
        <div class="launch-resume-title">編集中の写真があります</div>
        <div id="launchResumeMeta" class="launch-resume-meta"></div>
        <div class="launch-resume-actions">
          <button class="resume-import-button" type="button" onclick="resumeImportSession()">編集を続ける</button>
          <button class="discard-import-button" type="button" onclick="discardImportSession()">破棄する</button>
        </div>
      </div>
      <input id="importPhotoInput" type="file" accept="image/*" multiple hidden />
    </div>
  </div>
  <div id="appOrientationShell">
  <div id="cameraScreen">
    <div class="left-panel">
      <div id="photoCount">撮影済み
0枚</div>
      <button id="landscapeFlipButton" class="panel-mini-button" type="button" onclick="toggleLandscapeFlip()">上下<br>反転</button>

      <div class="board-control-panel" aria-label="撮影補助操作">
        <div id="panelMainList" class="panel-main-list">
          <button id="panelRoomButton" class="panel-main-button" type="button" onclick="openSidePanel('room')">部屋</button>
          <button id="panelSampleButton" class="panel-main-button" type="button" onclick="openSidePanel('sample')">検体</button>
          <button id="panelBoardButton" class="panel-main-button" type="button" onclick="openSidePanel('board')">看板</button>
        </div>

        <div id="roomPanel" class="panel-expanded">
          <div class="panel-pair survey-only">
            <div class="panel-vertical" aria-label="階操作">
              <button class="panel-mini-button" type="button" onclick="changeRoomNumber('floor', 1)">▲</button>
              <button class="panel-center-button" type="button" onclick="promptRoomNo()">階</button>
              <button class="panel-mini-button" type="button" onclick="changeRoomNumber('floor', -1)">▼</button>
            </div>
            <div class="panel-vertical" aria-label="部屋操作">
              <button class="panel-mini-button" type="button" onclick="changeRoomNumber('room', 1)">▲</button>
              <button class="panel-center-button" type="button" onclick="promptRoomNo()">部屋</button>
              <button class="panel-mini-button" type="button" onclick="changeRoomNumber('room', -1)">▼</button>
            </div>
          </div>

          <div class="panel-single sampling-only" aria-label="採取箇所操作">
            <button class="panel-mini-button" type="button" onclick="changeSamplingLocation(1)">▲</button>
            <button id="samplingLocationTargetButton" class="panel-center-button" type="button" onclick="cycleSamplingLocationTarget()">箇所</button>
            <button class="panel-mini-button" type="button" onclick="changeSamplingLocation(-1)">▼</button>
          </div>

          <button class="panel-close-button" type="button" onclick="closeSidePanel()">閉じる</button>
        </div>

        <div id="samplePanel" class="panel-expanded">
          <div class="panel-pair">
            <div class="panel-vertical" aria-label="検体操作">
              <button class="panel-mini-button" type="button" onclick="changeSampleNo(1)">▲</button>
              <button class="panel-center-button" type="button" onclick="promptSampleNo()">検体</button>
              <button class="panel-mini-button" type="button" onclick="changeSampleNo(-1)">▼</button>
            </div>
            <div class="panel-vertical" aria-label="箇所操作">
              <button class="panel-mini-button" type="button" onclick="changePointNo(1)">▲</button>
              <button class="panel-center-button" type="button" onclick="promptSampleNo()">箇所</button>
              <button class="panel-mini-button" type="button" onclick="changePointNo(-1)">▼</button>
            </div>
          </div>
          <button class="panel-close-button" type="button" onclick="closeSidePanel()">閉じる</button>
        </div>

        <div id="boardPanel" class="panel-expanded">
          <div class="panel-single" aria-label="看板操作">
            <button class="panel-mini-button" type="button" onclick="increaseBoardSize()">▲</button>
            <button class="panel-center-button" type="button" onclick="cycleBoardPosition()">🪧</button>
            <button class="panel-mini-button" type="button" onclick="decreaseBoardSize()">▼</button>
          </div>
          <button class="panel-close-button" type="button" onclick="closeSidePanel()">閉じる</button>
        </div>
      </div>
    </div>

    <div id="captureFrame">
      <video id="video" playsinline muted autoplay></video>
      <img id="captureFreezeImage" alt="撮影画像" />
      <div id="cameraFlash"></div>

      <div id="cameraGuide">右側の「カメラ起動」を押してください</div>

      <div id="sectionModeBadge">断面モード：看板なし</div>

      <div class="board-layer">
      <div id="boardWrap">
        <canvas id="boardCanvasPreview" aria-hidden="true"></canvas>
        <div id="photoBoard">
          <table class="board-table">
            <tr class="row-subject">
              <td class="label-cell">件名</td>
              <td class="value-cell board-value-cell">
                <div class="textarea-center-wrap">
                  <textarea id="subjectText" class="board-editable subject-textarea" inputmode="text" rows="2"></textarea>
                </div>
              </td>
            </tr>

            <tr class="row-place">
              <td class="label-cell">採取場所</td>
              <td class="value-cell board-value-cell">
                <div class="textarea-center-wrap">
                  <textarea id="addressText" class="board-editable address-textarea" inputmode="text" rows="2"></textarea>
                </div>
              </td>
            </tr>

            <tr class="row-content">
              <td class="content-label-cell">内容</td>
              <td>
                <table class="inner-table">
                  <tr>
                    <td id="roomLabelCell" class="inner-label">　部屋No.</td>
                    <td id="roomValueCell" class="inner-value">
                      <input id="roomNoInput" class="board-input" type="text" inputmode="text" />
                    </td>
                  </tr>

                  <tr>
                    <td class="inner-label">　試料No.</td>
                    <td class="inner-value">
                      <input id="sampleNoInput" class="board-input" type="text" inputmode="text" />
                    </td>
                  </tr>

                  <tr>
                    <td colspan="2" class="status-cell">
                      <div class="status-row">
                        <button id="visualStatusButton" class="status-btn" type="button" data-value="visual">
                          <span class="status-box">■</span><span>目視</span>
                        </button>

                        <button class="status-btn" type="button" data-value="before">
                          <span class="status-box">□</span><span>施工前</span>
                        </button>

                        <button class="status-btn" type="button" data-value="during">
                          <span class="status-box">□</span><span>施工中</span>
                        </button>

                        <button class="status-btn" type="button" data-value="after">
                          <span class="status-box">□</span><span>施工後</span>
                        </button>
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr class="row-date">
              <td class="label-cell">日付</td>
              <td class="date-cell">
                <div id="dateText" class="date-text"></div>
              </td>
            </tr>
          </table>
        </div>
      </div>
      </div>
    </div>

    <div class="controls">
      <button
        id="startButton"
        class="control-button btn-start"
        type="button"
        onclick="startCamera()"
      >
        カメラ起動
      </button>

      <button
        id="viewButton"
        class="control-button btn-view hidden-control"
        type="button"
        onclick="openPreview()"
      >
        表示
      </button>

      <button
        id="shootButton"
        class="control-button btn-shoot hidden-control"
        type="button"
        onclick="takePhoto()"
      >
        撮影
      </button>

      <button
        id="sectionButton"
        class="control-button btn-section hidden-control"
        type="button"
        onclick="toggleSectionMode()"
      >
        断面
      </button>

      <button
        id="categoryToggleButton"
        class="control-button btn-mode hidden-control"
        type="button"
        onclick="cyclePhotoStatus()"
      >
        目視
      </button>
    </div>

    <div id="toast"></div>
  </div>


  <datalist id="samplingNameHistoryList"></datalist>

  <div id="captureReviewOverlay" aria-modal="true" role="dialog">
    <div class="capture-review-panel">
      <img id="captureReviewImage" alt="撮影確認" />
      <div class="capture-review-controls">
        <button class="capture-review-button capture-review-retake" type="button" onclick="rejectCaptureReview()">撮り直し</button>
        <button class="capture-review-button capture-review-ok" type="button" onclick="acceptCaptureReview()">OK</button>
      </div>
    </div>
  </div>

  <div id="photoZoomOverlay" aria-modal="true" role="dialog" aria-label="写真拡大表示">
    <img id="photoZoomImage" alt="拡大写真" />
  </div>

  <div id="previewOverlay">
    <div class="preview-topbar">
      <button id="settingsButton" class="settings-button" type="button" aria-label="設定">⚙</button>
    </div>

    <div class="preview-casebar">
      <button id="caseSelectButton" class="case-select-button" type="button" onclick="openCasePicker()">案件選択</button>
    </div>

    <div id="previewCounter">0 / 0</div>

    <div id="previewImageWrap">
      <button class="preview-arrow left" type="button" onclick="showPrevPhoto()">‹</button>
      <img id="previewImage" alt="撮影写真" />
      <button class="preview-arrow right" type="button" onclick="showNextPhoto()">›</button>
    </div>

    <div id="previewMeta"></div>
    <div id="previewThumbnails"></div>
    <div id="previewList"></div>

    <div class="preview-controls">
      <button class="preview-button btn-list-toggle" type="button" onclick="checkMissingPhotos()">チェック</button>
      <button id="previewSortButton" class="preview-button btn-list-toggle" type="button" onclick="togglePreviewSortMode()">撮影順</button>
      <button id="selectAllButton" class="preview-button btn-list-toggle" type="button" onclick="toggleSelectAllPhotos()">全選択</button>
      <button id="boardCorrectionButton" class="preview-button btn-list-toggle" type="button" onclick="startBoardCorrectionSelectMode()">看板修正</button>
      <button class="preview-button btn-save" type="button" onclick="saveCurrentPreviewPhoto()">保存</button>
      <button class="preview-button btn-delete" type="button" onclick="deleteSelectedPreviewPhotos()">削除</button>
      <button class="preview-button btn-close" type="button" onclick="closePreview()">戻る</button>
    </div>
  </div>

  <div id="casePickerOverlay">
    <div class="case-picker-panel">
      <h2 class="case-picker-title">案件を選択</h2>
      <div id="casePickerList"></div>
      <button class="settings-close" type="button" onclick="closeCasePicker()">閉じる</button>
    </div>
  </div>


  <div id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
    <div class="settings-panel">
      <h2 class="settings-title">設定</h2>

      <div class="settings-section-title">🔄 アプリ更新</div>
      <div class="settings-version-box">
        現在：<strong id="settingsVersionText">v65.6</strong>
      </div>
      <button class="settings-update-button" type="button" onclick="forceAppUpdate()">最新版を読み込み直す</button>

      <div class="settings-section-title">📷 写真画質</div>

      <button id="qualityStandardButton" class="quality-option" type="button" onclick="setPhotoQuality('standard')">
        <span class="quality-dot"></span>
        <span>標準（3024×2268）</span>
      </button>

      <button id="qualityHighButton" class="quality-option" type="button" onclick="setPhotoQuality('high')">
        <span class="quality-dot"></span>
        <span>高画質（3264×2448）</span>
      </button>

      <div class="settings-note">
        今後追加予定：ライト、ズーム、位置情報、グリッド表示、シャッター音など。
      </div>

      <button class="settings-close" type="button" onclick="closeSettings()">閉じる</button>
    </div>
  </div>

  <div id="boardEditOverlay">
    <div class="board-edit-form-panel">
      <div class="board-edit-form-header">
        <div class="board-edit-form-title">看板編集</div>
        <div id="boardEditModeBadge" class="board-edit-mode-badge mode-survey">調査</div>
        <div id="importProgressBadge"></div>
      </div>
      <div class="board-form-grid">
        <div class="board-form-field" data-board-field="subject">
          <label for="boardEditSubject">件名（改行可）</label>
          <textarea id="boardEditSubject" rows="2"></textarea>
        </div>
        <div class="board-form-field" data-board-field="address">
          <label for="boardEditAddress">住所（改行可）</label>
          <textarea id="boardEditAddress" rows="2"></textarea>
        </div>
        <div class="board-form-field" data-board-field="room">
          <label id="boardEditRoomLabel" for="boardEditRoom">部屋No.／採取箇所名（改行可）</label>
          <textarea id="boardEditRoom" rows="2"></textarea>
        </div>
        <div class="board-form-two">
          <div class="board-form-field" data-board-field="sample">
            <label for="boardEditSample">試料No.</label>
            <input id="boardEditSample" type="text" />
          </div>
          <div class="board-form-field" data-board-field="date">
            <label for="boardEditDate">日付</label>
            <input id="boardEditDate" type="text" />
          </div>
        </div>
        <div class="board-form-two">
          <div class="board-form-field">
            <label for="boardEditStatus">写真区分</label>
            <select id="boardEditStatus"></select>
          </div>
          <div class="board-form-field">
            <label for="boardEditModeSelect">看板種類</label>
            <select id="boardEditModeSelect">
              <option value="survey">調査</option>
              <option value="sampling">サンプリング</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="boardEditHost">
      <div class="board-edit-history-preview" aria-label="編集履歴操作">
        <button id="boardEditUndoButton" type="button" aria-label="戻る">↶</button>
        <button id="boardEditRedoButton" type="button" aria-label="進む">↷</button>
        <button id="boardEditResetButton" class="board-edit-reset-inline" type="button">元に戻す</button>
      </div>
      <div id="boardEditPhotoStage">
        <img id="boardEditPhotoBackdrop" alt="看板修正対象写真" />
        <div id="boardEditCanvasWrap"><canvas id="boardEditCanvas"></canvas></div>
      </div>
      <div class="board-preview-size-controls">
        <button id="boardEditSizeDownButton" type="button">A-</button>
        <span id="boardEditSelectedFieldLabel">件名</span>
        <button id="boardEditSizeUpButton" type="button">A+</button>
        <button id="boardEditSizeResetButton" type="button">リセット</button>
      </div>
      <div id="importBoardControls">
        <button type="button" onclick="decreaseImportBoardSize()">看板−</button>
        <button type="button" onclick="cycleImportBoardPosition()">位置</button>
        <span id="importBoardPositionLabel">左下</span>
        <button type="button" onclick="increaseImportBoardSize()">看板＋</button>
      </div>
    </div>

    <div class="board-edit-right">
      <button id="boardEditDoneButton" class="board-edit-done" type="button" onclick="return forceFinishBoardEdit(event)">完了</button>
      <button id="editBoardModeButton" class="edit-mode-toggle" type="button">調査</button>
    </div>
  </div>
  </div>

  <script src="./js/photo-store.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/photo-import.js"></script>
  <script src="./js/photo-viewer.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => console.log("Service Worker 登録完了"))
      .catch(err => console.error("Service Worker登録失敗", err));
  });
}
</script>
</body>
</html>
