<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <meta name="theme-color" content="#000000" />
  <title>電子看板カメラ</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    #cameraScreen {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #cameraGuide {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    .hidden,
    .hidden-control {
      display: none !important;
    }

    /* 撮影枚数表示 */
    #photoCount {
      position: absolute;
      left: 12px;
      top: calc(12px + env(safe-area-inset-top));
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      pointer-events: none;
    }

    /* 看板レイヤー */
    .board-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    #boardWrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 560px;
      transform-origin: top left;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      cursor: grab;
      will-change: transform;
    }

    #boardWrap.dragging {
      cursor: grabbing;
    }

    /* 電子看板：横長長方形 */
    #photoBoard {
      width: 100%;
      height: 300px;
      background: #fff;
      color: #000;
      border: 4px solid #000;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .board-table,
    .inner-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .board-table td,
    .inner-table td {
      border: 2px solid #000;
      vertical-align: middle;
      padding: 0;
    }

    .row-subject {
      height: 72px;
    }

    .row-place {
      height: 54px;
    }

    .row-content {
      height: 126px;
    }

    .row-date {
      height: 48px;
    }

    .label-cell {
      width: 104px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;
    }

    .content-label-cell {
      width: 104px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      white-space: nowrap;
    }

    .value-cell {
      padding: 6px 12px;
    }

    .subject-text {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.25;
      word-break: break-word;
    }

    .address-text {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-all;
    }

    .inner-label {
      width: 130px;
      padding: 6px 10px;
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    .inner-value {
      padding: 0 10px;
    }

    .board-input {
      width: 100%;
      height: 40px;
      border: none;
      outline: none;
      background: transparent;
      color: #000;
      font-size: 22px;
      font-weight: 900;
      font-family: inherit;
    }

    .status-cell {
      padding: 4px 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      height: 42px;
      flex-wrap: nowrap;
    }

    .status-btn {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      color: #000;
      font-size: 19px;
      font-weight: 900;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
    }

    .status-box {
      display: inline-block;
      min-width: 1em;
      text-align: center;
      font-size: 1.05em;
      line-height: 1;
    }

    .date-cell {
      text-align: center;
      padding: 0 12px;
    }

    .date-text {
      font-size: 25px;
      font-weight: 900;
      line-height: 1.1;
    }

    /* 右下ボタン：カメラ起動後は 表示 → 撮影 */
    .controls {
      position: absolute !important;
      right: 12px !important;
      left: auto !important;
      bottom: calc(14px + env(safe-area-inset-bottom)) !important;
      width: auto !important;
      z-index: 9999 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-end !important;
      gap: 8px !important;
      padding: 0 !important;
      margin: 0 !important;
      pointer-events: auto !important;
    }

    .control-button {
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
    }

    .btn-start {
      background: #2f80ed;
      color: #fff;
    }

    .btn-view {
      background: #f2c94c;
      color: #000;
      min-width: 80px;
    }

    .btn-shoot {
      background: #fff;
      color: #000;
      min-width: 92px;
    }

    /* プレビュー画面 */
    #previewOverlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
      touch-action: pan-y;
    }

    #previewOverlay.show {
      display: flex;
    }

    #previewCounter {
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 10px;
      min-height: 24px;
    }

    #previewImageWrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #previewImage {
      max-width: 100%;
      max-height: calc(100dvh - 145px);
      object-fit: contain;
      background: #111;
      border: 1px solid #333;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: pan-y;
    }

    .preview-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #000;
      font-size: 28px;
      font-weight: 900;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      z-index: 2;
    }

    .preview-arrow.left {
      left: 6px;
    }

    .preview-arrow.right {
      right: 6px;
    }

    .preview-controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding-top: 12px;
    }

    .preview-button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
    }

    .btn-save {
      background: #fff;
      color: #000;
    }

    .btn-close {
      background: #444;
      color: #fff;
    }

    /* トースト */
    #toast {
      position: absolute;
      left: 50%;
      top: calc(14px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 10000;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="cameraScreen">
    <video id="video" playsinline muted autoplay></video>

    <div id="cameraGuide">右下の「カメラ起動」を押してください</div>

    <div id="photoCount">撮影済み 0枚</div>

    <div class="board-layer">
      <div id="boardWrap">
        <div id="photoBoard">
          <table class="board-table">
            <tr class="row-subject">
              <td class="label-cell">件名</td>
              <td class="value-cell">
                <div id="subjectText" class="subject-text"></div>
              </td>
            </tr>

            <tr class="row-place">
              <td class="label-cell">採取場所</td>
              <td class="value-cell">
                <div id="addressText" class="address-text"></div>
              </td>
            </tr>

            <tr class="row-content">
              <td class="content-label-cell">内容</td>
              <td>
                <table class="inner-table">
                  <tr>
                    <td class="inner-label">部屋No.</td>
                    <td class="inner-value">
                      <input id="roomNoInput" class="board-input" type="text" inputmode="text" />
                    </td>
                  </tr>

                  <tr>
                    <td class="inner-label">試料No.</td>
                    <td class="inner-value">
                      <input id="sampleNoInput" class="board-input" type="text" inputmode="text" />
                    </td>
                  </tr>

                  <tr>
                    <td colspan="2" class="status-cell">
                      <div class="status-row">
                        <button class="status-btn" type="button" data-value="visual">
                          <span class="status-box">■</span><span>目視</span>
                        </button>

                        <button class="status-btn" type="button" data-value="before">
                          <span class="status-box">□</span><span>施工前</span>
                        </button>

                        <button class="status-btn" type="button" data-value="during">
                          <span class="status-box">□</span><span>施工中</span>
                        </button>

                        <button class="status-btn" type="button" data-value="after">
                          <span class="status-box">□</span><span>施工後</span>
                        </button>
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr class="row-date">
              <td class="label-cell">日付</td>
              <td class="date-cell">
                <div id="dateText" class="date-text"></div>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <div class="controls">
      <button
        id="startButton"
        class="control-button btn-start"
        type="button"
        onclick="startCamera()"
      >
        カメラ起動
      </button>

      <button
        id="viewButton"
        class="control-button btn-view hidden-control"
        type="button"
        onclick="openPreview()"
      >
        表示
      </button>

      <button
        id="shootButton"
        class="control-button btn-shoot hidden-control"
        type="button"
        onclick="takePhoto()"
      >
        撮影
      </button>
    </div>

    <div id="toast"></div>
  </div>

  <div id="previewOverlay">
    <div id="previewCounter">0 / 0</div>

    <div id="previewImageWrap">
      <button class="preview-arrow left" type="button" onclick="showPrevPhoto()">‹</button>
      <img id="previewImage" alt="撮影写真" />
      <button class="preview-arrow right" type="button" onclick="showNextPhoto()">›</button>
    </div>

    <div class="preview-controls">
      <button class="preview-button btn-save" type="button" onclick="saveCurrentPreviewPhoto()">保存/共有</button>
      <button class="preview-button btn-close" type="button" onclick="closePreview()">戻る</button>
    </div>
  </div>

  <script>
    const APP_DATA = {
      subject: "テストビル解体に伴うアスベスト調査",
      address: "神奈川県小田原市小八幡2-3-6"
    };

    const STATUS_LIST = [
      { value: "visual", label: "目視" },
      { value: "before", label: "施工前" },
      { value: "during", label: "施工中" },
      { value: "after", label: "施工後" }
    ];

    const cameraScreen = document.getElementById("cameraScreen");
    const video = document.getElementById("video");
    const cameraGuide = document.getElementById("cameraGuide");

    const boardWrap = document.getElementById("boardWrap");
    const photoBoard = document.getElementById("photoBoard");

    const subjectText = document.getElementById("subjectText");
    const addressText = document.getElementById("addressText");
    const roomNoInput = document.getElementById("roomNoInput");
    const sampleNoInput = document.getElementById("sampleNoInput");
    const dateText = document.getElementById("dateText");

    const startButton = document.getElementById("startButton");
    const viewButton = document.getElementById("viewButton");
    const shootButton = document.getElementById("shootButton");
    const statusButtons = Array.from(document.querySelectorAll(".status-btn"));

    const photoCount = document.getElementById("photoCount");
    const previewOverlay = document.getElementById("previewOverlay");
    const previewImage = document.getElementById("previewImage");
    const previewCounter = document.getElementById("previewCounter");
    const toast = document.getElementById("toast");

    let currentStream = null;
    let selectedStatus = "visual";
    let hasInitializedBoard = false;
    let toastTimer = null;

    const capturedPhotos = [];
    let previewIndex = 0;

    const boardState = {
      x: 12,
      y: 12,
      scale: 1,
      minScale: 0.35,
      maxScale: 1.8
    };

    const activePointers = new Map();

    const gestureState = {
      mode: null,
      dragStartX: 0,
      dragStartY: 0,
      originX: 0,
      originY: 0,
      startScale: 1,
      startDistance: 0,
      localMidX: 0,
      localMidY: 0
    };

    let previewTouchStartX = 0;
    let previewTouchStartY = 0;

    document.addEventListener("DOMContentLoaded", () => {
      initializeBoard();
      setupStatusButtons();
      setupBoardGesture();
      setupPreviewSwipe();

      requestAnimationFrame(() => {
        setInitialBoardLayout();
      });
    });

    window.addEventListener("resize", () => {
      handleWindowResize();
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        handleWindowResize();
      }, 200);
    });

    /*
     * iPhone / iPad のホーム画面PWA対策
     * 画面復帰時にカメラが止まることがあるため復帰を試す
     */
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && currentStream && !previewOverlay.classList.contains("show")) {
        resumeCameraAfterPreview();
      }
    });

    window.addEventListener("pageshow", () => {
      if (currentStream && !previewOverlay.classList.contains("show")) {
        resumeCameraAfterPreview();
      }
    });

    function initializeBoard() {
      subjectText.textContent = APP_DATA.subject;
      addressText.textContent = APP_DATA.address;
      updateCurrentDate();
      setStatus("visual");
      updatePhotoCount();
    }

    function updateCurrentDate() {
      dateText.textContent = formatJapaneseDate(new Date());
    }

    function formatJapaneseDate(date) {
      const y = date.getFullYear();
      const m = date.getMonth() + 1;
      const d = date.getDate();
      return `${y}年${m}月${d}日`;
    }

    function formatFileDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      const s = String(date.getSeconds()).padStart(2, "0");
      return `${y}${m}${d}_${h}${min}${s}`;
    }

    function setupStatusButtons() {
      statusButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          setStatus(button.dataset.value);
        });
      });
    }

    function setStatus(value) {
      selectedStatus = value;

      statusButtons.forEach((button) => {
        const checked = button.dataset.value === value;
        const box = button.querySelector(".status-box");

        button.setAttribute("aria-pressed", checked ? "true" : "false");

        if (box) {
          box.textContent = checked ? "■" : "□";
        }
      });
    }

    function setInitialBoardLayout() {
      const screen = getScreenSize();
      const base = getBoardBaseSize();

      const targetWidth = clamp(screen.width * 0.58, 260, 360);
      boardState.scale = targetWidth / base.width;

      const displayedHeight = base.height * boardState.scale;
      boardState.x = 8;
      boardState.y = screen.height - displayedHeight - 86;

      if (boardState.y < 8) {
        boardState.y = 8;
      }

      clampBoardWithinScreen();
      applyBoardTransform();
      hasInitializedBoard = true;
    }

    function handleWindowResize() {
      if (!hasInitializedBoard) {
        setInitialBoardLayout();
        return;
      }

      clampBoardWithinScreen();
      applyBoardTransform();
    }

    function getScreenSize() {
      return {
        width: cameraScreen.clientWidth || window.innerWidth,
        height: cameraScreen.clientHeight || window.innerHeight
      };
    }

    function getBoardBaseSize() {
      return {
        width: photoBoard.offsetWidth,
        height: photoBoard.offsetHeight
      };
    }

    function applyBoardTransform() {
      boardWrap.style.transform =
        `translate(${boardState.x}px, ${boardState.y}px) scale(${boardState.scale})`;
    }

    function clampBoardWithinScreen() {
      const screen = getScreenSize();
      const base = getBoardBaseSize();

      const boardWidth = base.width * boardState.scale;
      const boardHeight = base.height * boardState.scale;

      const maxX = Math.max(0, screen.width - boardWidth);
      const maxY = Math.max(0, screen.height - boardHeight);

      boardState.x = clamp(boardState.x, 0, maxX);
      boardState.y = clamp(boardState.y, 0, maxY);
      boardState.scale = clamp(boardState.scale, boardState.minScale, boardState.maxScale);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setupBoardGesture() {
      boardWrap.addEventListener("pointerdown", onBoardPointerDown);
      boardWrap.addEventListener("pointermove", onBoardPointerMove);
      boardWrap.addEventListener("pointerup", onBoardPointerEnd);
      boardWrap.addEventListener("pointercancel", onBoardPointerEnd);
      boardWrap.addEventListener("pointerleave", onBoardPointerEnd);
    }

    function onBoardPointerDown(event) {
      if (isInteractiveBoardTarget(event.target)) {
        return;
      }

      event.preventDefault();
      boardWrap.classList.add("dragging");

      try {
        boardWrap.setPointerCapture(event.pointerId);
      } catch (error) {}

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        gestureState.mode = "drag";
        gestureState.dragStartX = event.clientX;
        gestureState.dragStartY = event.clientY;
        gestureState.originX = boardState.x;
        gestureState.originY = boardState.y;
      } else if (activePointers.size === 2) {
        preparePinchGesture();
      }
    }

    function onBoardPointerMove(event) {
      if (!activePointers.has(event.pointerId)) return;

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size >= 2) {
        handlePinchMove();
        return;
      }

      if (activePointers.size === 1 && gestureState.mode === "drag") {
        event.preventDefault();

        const dx = event.clientX - gestureState.dragStartX;
        const dy = event.clientY - gestureState.dragStartY;

        boardState.x = gestureState.originX + dx;
        boardState.y = gestureState.originY + dy;

        clampBoardWithinScreen();
        applyBoardTransform();
      }
    }

    function onBoardPointerEnd(event) {
      if (activePointers.has(event.pointerId)) {
        activePointers.delete(event.pointerId);
      }

      try {
        boardWrap.releasePointerCapture(event.pointerId);
      } catch (error) {}

      if (activePointers.size === 1) {
        const remaining = Array.from(activePointers.values())[0];

        gestureState.mode = "drag";
        gestureState.dragStartX = remaining.x;
        gestureState.dragStartY = remaining.y;
        gestureState.originX = boardState.x;
        gestureState.originY = boardState.y;
      } else {
        gestureState.mode = null;
        boardWrap.classList.remove("dragging");
      }
    }

    function preparePinchGesture() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return;

      const p1 = points[0];
      const p2 = points[1];
      const mid = getMidpoint(p1, p2);

      gestureState.mode = "pinch";
      gestureState.startDistance = getDistance(p1, p2);
      gestureState.startScale = boardState.scale;

      gestureState.localMidX = (mid.x - boardState.x) / boardState.scale;
      gestureState.localMidY = (mid.y - boardState.y) / boardState.scale;
    }

    function handlePinchMove() {
      const points = Array.from(activePointers.values());
      if (points.length < 2) return;

      const p1 = points[0];
      const p2 = points[1];

      const newDistance = getDistance(p1, p2);
      const mid = getMidpoint(p1, p2);

      if (!gestureState.startDistance) return;

      let nextScale =
        gestureState.startScale * (newDistance / gestureState.startDistance);

      nextScale = clamp(nextScale, boardState.minScale, boardState.maxScale);

      boardState.scale = nextScale;
      boardState.x = mid.x - gestureState.localMidX * boardState.scale;
      boardState.y = mid.y - gestureState.localMidY * boardState.scale;

      clampBoardWithinScreen();
      applyBoardTransform();
    }

    function getDistance(p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getMidpoint(p1, p2) {
      return {
        x: (p1.x + p2.x) / 2,
        y: (p1.y + p2.y) / 2
      };
    }

    function isInteractiveBoardTarget(target) {
      return Boolean(
        target.closest(".board-input") || target.closest(".status-btn")
      );
    }

    async function startCamera() {
      try {
        await requestFullscreenSafe();
        stopCurrentStream();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;

        await video.play();

        showCameraButtons();
        showToast("カメラを起動しました");
      } catch (error) {
        console.error(error);
        showToast("カメラを起動できませんでした");
      }
    }

    function stopCurrentStream() {
      if (!currentStream) return;

      currentStream.getTracks().forEach((track) => track.stop());
      currentStream = null;
      video.srcObject = null;
    }

    async function requestFullscreenSafe() {
      const target = document.documentElement;

      if (!document.fullscreenElement && target.requestFullscreen) {
        try {
          await target.requestFullscreen();
        } catch (error) {}
      }
    }

    function showCameraButtons() {
      cameraGuide.classList.add("hidden");
      startButton.classList.add("hidden-control");
      viewButton.classList.remove("hidden-control");
      shootButton.classList.remove("hidden-control");
    }

    function showStartButton() {
      cameraGuide.classList.remove("hidden");
      startButton.classList.remove("hidden-control");
      viewButton.classList.add("hidden-control");
      shootButton.classList.add("hidden-control");
    }

    /*
     * プレビューから戻った後のカメラ復帰
     * iPhone / iPad のホーム画面PWAで重要
     */
    async function resumeCameraAfterPreview() {
      try {
        const hasLiveTrack =
          currentStream &&
          currentStream.getVideoTracks &&
          currentStream.getVideoTracks().some((track) => track.readyState === "live");

        if (hasLiveTrack) {
          video.srcObject = currentStream;
          await video.play();
          showCameraButtons();
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;
        await video.play();

        showCameraButtons();
      } catch (error) {
        console.error(error);
        showStartButton();
        showToast("カメラを再起動してください");
      }
    }

    async function takePhoto() {
      if (!currentStream || !video.srcObject || video.readyState < 2) {
        showToast("先にカメラを起動してください");
        return;
      }

      updateCurrentDate();

      try {
        // Canvasに文字を焼き込む前に、フォント読み込み完了を待つ
        // iPhone/iPadで日本語フォントの描画が不安定になるのを軽減する
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }

        const canvas = captureCompositedImage();

        /*
         * iPhone/iPad向けに少し軽量化
         * 0.95だと重くなりやすいので 0.82
         */
        const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
        const createdAt = new Date();

        capturedPhotos.push({
          dataUrl,
          fileName: `electronic_board_${formatFileDate(createdAt)}_${getStatusLabel(selectedStatus)}.jpg`,
          status: selectedStatus,
          createdAt
        });

        previewIndex = capturedPhotos.length - 1;
        updatePhotoCount();

        if (navigator.vibrate) {
          navigator.vibrate(50);
        }

        showToast("撮影しました");
      } catch (error) {
        console.error(error);
        showToast("撮影に失敗しました");
      }
    }

    function captureCompositedImage() {
      const screen = getScreenSize();

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      const coverScale = Math.max(
        screen.width / videoWidth,
        screen.height / videoHeight
      );

      const visibleSourceWidth = screen.width / coverScale;
      const visibleSourceHeight = screen.height / coverScale;

      const sourceX = (videoWidth - visibleSourceWidth) / 2;
      const sourceY = (videoHeight - visibleSourceHeight) / 2;

      const canvas = document.createElement("canvas");
      canvas.width = Math.round(visibleSourceWidth);
      canvas.height = Math.round(visibleSourceHeight);

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        video,
        sourceX,
        sourceY,
        visibleSourceWidth,
        visibleSourceHeight,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const boardRect = photoBoard.getBoundingClientRect();

      const boardX = (boardRect.left / screen.width) * canvas.width;
      const boardY = (boardRect.top / screen.height) * canvas.height;
      const boardW = (boardRect.width / screen.width) * canvas.width;
      const boardH = (boardRect.height / screen.height) * canvas.height;

      drawBoardOnCanvas(ctx, boardX, boardY, boardW, boardH);

      return canvas;
    }

    /* 写真ビューア */
    function openPreview() {
      if (!capturedPhotos.length) {
        showToast("撮影した写真がありません");
        return;
      }

      previewIndex = capturedPhotos.length - 1;
      renderPreview();
      previewOverlay.classList.add("show");
    }

    async function closePreview() {
      previewOverlay.classList.remove("show");

      /*
       * 戻るを押したらカメラ画面へ復帰
       * PWAでカメラが止まっていたら再取得を試す
       */
      await resumeCameraAfterPreview();
    }

    function showPrevPhoto() {
      if (!capturedPhotos.length) return;

      previewIndex -= 1;

      if (previewIndex < 0) {
        previewIndex = capturedPhotos.length - 1;
      }

      renderPreview();
    }

    function showNextPhoto() {
      if (!capturedPhotos.length) return;

      previewIndex += 1;

      if (previewIndex >= capturedPhotos.length) {
        previewIndex = 0;
      }

      renderPreview();
    }

    function renderPreview() {
      const photo = capturedPhotos[previewIndex];
      previewImage.src = photo.dataUrl;
      previewCounter.textContent = `${previewIndex + 1} / ${capturedPhotos.length}`;
    }

    async function saveCurrentPreviewPhoto() {
      if (!capturedPhotos.length) {
        showToast("撮影した写真がありません");
        return;
      }

      const photo = capturedPhotos[previewIndex];

      // iPhone / iPad のホーム画面PWAでは a[download] が効かず、
      // data: 画面に飛ぶことがあるため、まずWeb Share APIを優先する。
      if (navigator.share && navigator.canShare) {
        try {
          const blob = dataUrlToBlob(photo.dataUrl);
          const file = new File([blob], photo.fileName, { type: "image/jpeg" });

          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: photo.fileName
            });
            return;
          }
        } catch (error) {
          // ユーザーが共有シートをキャンセルした場合は何もしない
          if (error && error.name === "AbortError") {
            return;
          }

          console.error(error);
          showToast("共有できませんでした");
        }
      }

      // フォールバック：PC / Android Chromeなど download が効く環境向け
      const link = document.createElement("a");
      link.href = photo.dataUrl;
      link.download = photo.fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const header = parts[0];
      const base64 = parts[1];
      const mimeMatch = header.match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
      const binary = atob(base64);
      const array = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        array[i] = binary.charCodeAt(i);
      }

      return new Blob([array], { type: mime });
    }

    function setupPreviewSwipe() {
      previewOverlay.addEventListener("touchstart", (event) => {
        if (!event.touches || event.touches.length !== 1) return;

        previewTouchStartX = event.touches[0].clientX;
        previewTouchStartY = event.touches[0].clientY;
      }, { passive: true });

      previewOverlay.addEventListener("touchend", (event) => {
        if (!event.changedTouches || event.changedTouches.length !== 1) return;

        const endX = event.changedTouches[0].clientX;
        const endY = event.changedTouches[0].clientY;

        const dx = endX - previewTouchStartX;
        const dy = endY - previewTouchStartY;

        if (Math.abs(dx) < 45) return;
        if (Math.abs(dx) < Math.abs(dy)) return;

        if (dx < 0) {
          showNextPhoto();
        } else {
          showPrevPhoto();
        }
      }, { passive: true });
    }

    function updatePhotoCount() {
      photoCount.textContent = `撮影済み ${capturedPhotos.length}枚`;
    }

    function getStatusLabel(value) {
      const found = STATUS_LIST.find(item => item.value === value);
      return found ? found.label : value;
    }

    /* キャンバス上に看板を描画 */
    function drawBoardOnCanvas(ctx, x, y, w, h) {
      const data = {
        subject: subjectText.textContent || "",
        address: addressText.textContent || "",
        roomNo: roomNoInput.value.trim(),
        sampleNo: sampleNoInput.value.trim(),
        date: dateText.textContent || "",
        status: selectedStatus
      };

      const leftColW = w * 0.186;
      const rightW = w - leftColW;

      const row1H = h * 0.24;
      const row2H = h * 0.18;
      const row3H = h * 0.42;
      const row4H = h - row1H - row2H - row3H;

      const contentY = y + row1H + row2H;
      const contentH = row3H;

      const innerLabelW = rightW * 0.28;
      const roomRowH = contentH * 0.32;
      const sampleRowH = contentH * 0.32;
      const statusRowH = contentH - roomRowH - sampleRowH;

      const outerLine = Math.max(2, h * 0.012);
      const innerLine = Math.max(1.5, h * 0.005);

      ctx.save();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = "#000000";
      ctx.lineJoin = "miter";
      ctx.lineWidth = outerLine;
      ctx.strokeRect(x, y, w, h);

      ctx.lineWidth = innerLine;

      drawLine(ctx, x + leftColW, y, x + leftColW, y + h);
      drawLine(ctx, x, y + row1H, x + w, y + row1H);
      drawLine(ctx, x, y + row1H + row2H, x + w, y + row1H + row2H);
      drawLine(ctx, x, y + row1H + row2H + row3H, x + w, y + row1H + row2H + row3H);

      drawLine(ctx, x + leftColW, contentY + roomRowH, x + w, contentY + roomRowH);
      drawLine(ctx, x + leftColW, contentY + roomRowH + sampleRowH, x + w, contentY + roomRowH + sampleRowH);
      drawLine(ctx, x + leftColW + innerLabelW, contentY, x + leftColW + innerLabelW, contentY + roomRowH + sampleRowH);

      const labelFont = Math.max(14, h * 0.072);
      const titleFont = Math.max(14, h * 0.073);
      const addressFont = Math.max(13, h * 0.066);
      const innerLabelFont = Math.max(13, h * 0.06);
      const innerValueFont = Math.max(14, h * 0.065);
      const statusFont = Math.max(12, h * 0.058);
      const dateFont = Math.max(16, h * 0.082);

      drawCenteredText(ctx, "件名", x, y, leftColW, row1H, labelFont);
      drawCenteredText(ctx, "採取場所", x, y + row1H, leftColW, row2H, labelFont);
      drawCenteredText(ctx, "内容", x, contentY, leftColW, contentH, labelFont);
      drawCenteredText(ctx, "日付", x, y + row1H + row2H + row3H, leftColW, row4H, labelFont);

      drawWrappedLeftText(ctx, data.subject, x + leftColW + 10, y, rightW - 20, row1H, titleFont, 1.25, 2);
      drawWrappedLeftText(ctx, data.address, x + leftColW + 10, y + row1H, rightW - 20, row2H, addressFont, 1.2, 2);

      drawLeftMiddleText(ctx, "部屋No.", x + leftColW + 10, contentY, innerLabelW - 16, roomRowH, innerLabelFont);
      drawLeftMiddleText(ctx, "試料No.", x + leftColW + 10, contentY + roomRowH, innerLabelW - 16, sampleRowH, innerLabelFont);

      drawLeftMiddleText(ctx, data.roomNo, x + leftColW + innerLabelW + 12, contentY, rightW - innerLabelW - 20, roomRowH, innerValueFont);
      drawLeftMiddleText(ctx, data.sampleNo, x + leftColW + innerLabelW + 12, contentY + roomRowH, rightW - innerLabelW - 20, sampleRowH, innerValueFont);

      const statusStartX = x + leftColW + 8;
      const statusWidth = rightW - 16;
      const segmentW = statusWidth / STATUS_LIST.length;
      const statusCenterY = contentY + roomRowH + sampleRowH + statusRowH / 2;

      ctx.fillStyle = "#000";
      ctx.font = `900 ${statusFont}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      STATUS_LIST.forEach((item, index) => {
        const symbol = item.value === data.status ? "■" : "□";
        const text = `${symbol}${item.label}`;
        const centerX = statusStartX + segmentW * index + segmentW / 2;
        ctx.fillText(text, centerX, statusCenterY);
      });

      drawCenteredText(ctx, data.date, x + leftColW, y + row1H + row2H + row3H, rightW, row4H, dateFont);

      ctx.restore();
    }

    function drawLine(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCenteredText(ctx, text, x, y, w, h, fontSize) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "", x + w / 2, y + h / 2);
      ctx.restore();
    }

    function drawLeftMiddleText(ctx, text, x, y, w, h, fontSize) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "", x, y + h / 2);
      ctx.restore();
    }

    function drawWrappedLeftText(ctx, text, x, y, w, h, fontSize, lineRate, maxLines) {
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const lines = getWrappedLines(ctx, text || "", w).slice(0, maxLines);
      const lineHeight = fontSize * lineRate;
      const totalHeight = lines.length * lineHeight;
      let currentY = y + h / 2 - totalHeight / 2 + lineHeight / 2;

      lines.forEach((line) => {
        ctx.fillText(line, x, currentY);
        currentY += lineHeight;
      });

      ctx.restore();
    }

    function getWrappedLines(ctx, text, maxWidth) {
      const lines = [];
      let current = "";

      for (const char of String(text)) {
        const test = current + char;
        const testWidth = ctx.measureText(test).width;

        if (testWidth > maxWidth && current !== "") {
          lines.push(current);
          current = char;
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);
      return lines.length ? lines : [""];
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1400);
    }
  </script>
</body>
</html>
