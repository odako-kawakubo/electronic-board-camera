<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>電子看板カメラテスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
      color: #000;
      overflow-x: hidden;
      touch-action: none;
    }

    .camera-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 0;
    }

    .camera-guide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      text-align: center;
      font-weight: 700;
      line-height: 1.7;
      background: #111;
      z-index: 1;
    }

    .camera-guide.hidden {
      display: none;
    }

    /* =========================
     * 電子看板
     * 位置とサイズはJSで制御する
     * ========================= */
    .board-frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 390px;
      background: #fff;
      border: 3px solid #000;
      padding: 3px;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      transform-origin: left top;
      touch-action: none;
      user-select: none;
    }

    .board {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    .board th,
    .board td {
      border: 1.5px solid #000;
      vertical-align: middle;
      padding: 4px 5px;
    }

    .label-cell {
      width: 20%;
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .value-cell {
      font-weight: 900;
      font-size: 18px;
    }

    .editable-text {
      width: 100%;
      min-height: 1.3em;
      outline: none;
      border: none;
      background: transparent;
      line-height: 1.25;
      word-break: break-word;
      user-select: text;
    }

    .project-name {
      min-height: 2.3em;
    }

    .address {
      font-size: 17px;
    }

    .content-cell {
      padding: 0 !important;
    }

    .content-box {
      display: flex;
      flex-direction: column;
      min-height: 105px;
    }

    .content-row {
      display: grid;
      grid-template-columns: 78px 1fr;
      align-items: center;
      border-bottom: 1.5px solid #000;
    }

    .content-label {
      border-right: 1.5px solid #000;
      padding: 4px 5px;
      font-weight: 900;
      font-size: 17px;
      white-space: nowrap;
    }

    .content-input-wrap {
      padding: 4px 6px;
    }

    .content-input {
      width: 100%;
      min-height: 1.15em;
      outline: none;
      border: none;
      background: transparent;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      user-select: text;
    }

    .check-row-wrap {
      padding: 6px 3px;
      display: flex;
      align-items: center;
      min-height: 34px;
    }

    .check-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2px;
      flex-wrap: nowrap;
    }

    .type-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      padding: 2px 0;
      border-radius: 2px;
      touch-action: manipulation;
    }

    .type-mark {
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
    }

    .date-text {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .controls {
      position: absolute;
      left: 0;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 100%;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 8px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 13px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
    }

    .btn-start {
      background: #2f80ed;
      color: #fff;
    }

    .btn-shoot {
      background: #fff;
      color: #000;
      min-width: 72px;
    }

    .btn-reset {
      background: #f2c94c;
      color: #000;
    }

    .btn-clear {
      background: #444;
      color: #fff;
    }

    .result-area {
      background: #1e1e1e;
      color: #fff;
      padding: 12px;
    }

    .result-title {
      font-weight: 900;
      margin-bottom: 8px;
    }

    #resultImage {
      width: 100%;
      max-width: 900px;
      display: none;
      border: 1px solid #666;
      background: #000;
    }

    .download-link {
      display: none;
      margin: 8px 0 12px 0;
      padding: 10px 14px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 900;
    }

    .memo {
      color: #ddd;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <section id="cameraScreen" class="camera-screen">
    <video id="video" autoplay playsinline muted></video>

    <div id="cameraGuide" class="camera-guide">
      <div>
        「カメラ起動」を押してください。<br>
        スマホではカメラ許可が出たら「許可」を押します。
      </div>
    </div>

    <!-- 電子看板 -->
    <div id="photoBoard" class="board-frame">
      <table class="board" aria-label="電子看板">
        <tr>
          <th class="label-cell">件 名</th>
          <td class="value-cell">
            <div
              id="projectName"
              class="editable-text project-name"
              contenteditable="true"
              spellcheck="false"
            >テストビル解体に伴うアスベスト調査</div>
          </td>
        </tr>

        <tr>
          <th class="label-cell">採取場所</th>
          <td class="value-cell">
            <div
              id="address"
              class="editable-text address"
              contenteditable="true"
              spellcheck="false"
            >神奈川県小田原市小八幡2-3-6</div>
          </td>
        </tr>

        <tr>
          <th class="label-cell">内 容</th>
          <td class="content-cell">
            <div class="content-box">
              <div class="content-row">
                <div class="content-label">部屋No.</div>
                <div class="content-input-wrap">
                  <div
                    id="roomNo"
                    class="content-input"
                    contenteditable="true"
                    spellcheck="false"
                  ></div>
                </div>
              </div>

              <div class="content-row">
                <div class="content-label">試料No.</div>
                <div class="content-input-wrap">
                  <div
                    id="sampleNo"
                    class="content-input"
                    contenteditable="true"
                    spellcheck="false"
                  ></div>
                </div>
              </div>

              <div class="check-row-wrap">
                <div class="check-row">
                  <div class="type-item" data-type="目視">
                    <span class="type-mark">■</span><span>目視</span>
                  </div>
                  <div class="type-item" data-type="施工前">
                    <span class="type-mark">□</span><span>施工前</span>
                  </div>
                  <div class="type-item" data-type="施工中">
                    <span class="type-mark">□</span><span>施工中</span>
                  </div>
                  <div class="type-item" data-type="施工後">
                    <span class="type-mark">□</span><span>施工後</span>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>

        <tr>
          <th class="label-cell">日 付</th>
          <td class="value-cell">
            <div
              id="dateText"
              class="editable-text date-text"
              contenteditable="true"
              spellcheck="false"
            ></div>
          </td>
        </tr>
      </table>
    </div>

    <div class="controls">
      <button class="btn-start" type="button" onclick="startCamera()">カメラ起動</button>
      <button class="btn-shoot" type="button" onclick="takePhoto()">撮影</button>
      <button class="btn-reset" type="button" onclick="resetBoardPosition()">左下に戻す</button>
      <button class="btn-clear" type="button" onclick="clearResult()">結果削除</button>
    </div>
  </section>

  <section class="result-area">
    <div class="result-title">撮影結果</div>
    <a id="downloadLink" class="download-link" download="electronic-board-photo.jpg">画像を保存</a>
    <img id="resultImage" alt="撮影結果" />

    <div class="memo">
      ※ 看板は1本指で移動できます。<br>
      ※ 看板は2本指のピンチで拡大・縮小できます。<br>
      ※ 写真区分は □ / ■ 表示で、1つだけ選択できます。<br>
      ※ 撮影すると、現在の位置・サイズのまま看板を焼き込みます。
    </div>
  </section>

  <script>
    const cameraScreen = document.getElementById("cameraScreen");
    const video = document.getElementById("video");
    const photoBoard = document.getElementById("photoBoard");
    const cameraGuide = document.getElementById("cameraGuide");
    const resultImage = document.getElementById("resultImage");
    const downloadLink = document.getElementById("downloadLink");

    let selectedType = "目視";

    // 看板位置・サイズ
    let boardX = 8;
    let boardY = 0;
    let boardScale = 0.62;

    // ドラッグ / ピンチ管理
    let activePointers = new Map();
    let dragStartX = 0;
    let dragStartY = 0;
    let boardStartX = 0;
    let boardStartY = 0;

    let pinchStartDistance = 0;
    let pinchStartScale = 1;

    setTodayIfEmpty();
    setupPhotoTypeSelector();
    setupBoardTouch();
    resetBoardPosition();

    /**
     * カメラを起動する
     */
    async function startCamera() {
      try {
        stopCurrentStream();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;
        cameraGuide.classList.add("hidden");
      } catch (error) {
        console.error(error);
        alert(
          "カメラを起動できませんでした。\n\n" +
          "スマホではHTTPSのURLで開く必要があります。\n" +
          "GitHub PagesのURLから開いてください。"
        );
      }
    }

    /**
     * 起動中のカメラを停止
     */
    function stopCurrentStream() {
      if (!video.srcObject) return;

      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }

    /**
     * 写真区分を1つだけ選択する
     */
    function setupPhotoTypeSelector() {
      document.querySelectorAll(".type-item").forEach(item => {
        item.addEventListener("click", event => {
          event.stopPropagation();
          selectedType = item.dataset.type;
          updatePhotoTypeDisplay();
        });
      });

      updatePhotoTypeDisplay();
    }

    /**
     * □ / ■ 表示を更新
     */
    function updatePhotoTypeDisplay() {
      document.querySelectorAll(".type-item").forEach(item => {
        const mark = item.querySelector(".type-mark");
        mark.textContent = item.dataset.type === selectedType ? "■" : "□";
      });
    }

    /**
     * 看板のタッチ操作を設定
     */
    function setupBoardTouch() {
      photoBoard.addEventListener("pointerdown", onBoardPointerDown);
      photoBoard.addEventListener("pointermove", onBoardPointerMove);
      photoBoard.addEventListener("pointerup", onBoardPointerUp);
      photoBoard.addEventListener("pointercancel", onBoardPointerUp);
      photoBoard.addEventListener("pointerleave", onBoardPointerUp);
    }

    function onBoardPointerDown(event) {
      // 入力欄や選択項目は操作を優先する
      if (isInteractiveElement(event.target)) return;

      event.preventDefault();
      photoBoard.setPointerCapture(event.pointerId);

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        boardStartX = boardX;
        boardStartY = boardY;
      }

      if (activePointers.size === 2) {
        const points = Array.from(activePointers.values());
        pinchStartDistance = getDistance(points[0], points[1]);
        pinchStartScale = boardScale;
      }
    }

    function onBoardPointerMove(event) {
      if (!activePointers.has(event.pointerId)) return;

      event.preventDefault();

      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 1) {
        const dx = event.clientX - dragStartX;
        const dy = event.clientY - dragStartY;

        boardX = boardStartX + dx;
        boardY = boardStartY + dy;

        clampBoardPosition();
        applyBoardTransform();
      }

      if (activePointers.size === 2) {
        const points = Array.from(activePointers.values());
        const currentDistance = getDistance(points[0], points[1]);

        if (pinchStartDistance > 0) {
          const ratio = currentDistance / pinchStartDistance;
          boardScale = pinchStartScale * ratio;
          boardScale = clamp(boardScale, 0.35, 1.25);

          clampBoardPosition();
          applyBoardTransform();
        }
      }
    }

    function onBoardPointerUp(event) {
      activePointers.delete(event.pointerId);

      if (activePointers.size === 1) {
        const point = Array.from(activePointers.values())[0];

        dragStartX = point.x;
        dragStartY = point.y;
        boardStartX = boardX;
        boardStartY = boardY;
      }
    }

    /**
     * 入力欄などはドラッグ対象から外す
     */
    function isInteractiveElement(target) {
      return (
        target.closest("[contenteditable='true']") ||
        target.closest(".type-item")
      );
    }

    /**
     * 左下に戻す
     */
    function resetBoardPosition() {
      boardScale = 0.62;
      boardX = 8;

      const screenHeight = cameraScreen.clientHeight;
      const boardHeight = photoBoard.offsetHeight * boardScale;

      boardY = screenHeight - boardHeight - 82;

      clampBoardPosition();
      applyBoardTransform();
    }

    /**
     * 看板位置・サイズを反映
     */
    function applyBoardTransform() {
      photoBoard.style.transform =
        `translate(${boardX}px, ${boardY}px) scale(${boardScale})`;
    }

    /**
     * 看板が画面外へ行きすぎないようにする
     */
    function clampBoardPosition() {
      const screenW = cameraScreen.clientWidth;
      const screenH = cameraScreen.clientHeight;
      const boardW = photoBoard.offsetWidth * boardScale;
      const boardH = photoBoard.offsetHeight * boardScale;

      const minX = -boardW * 0.25;
      const minY = 0;
      const maxX = screenW - boardW * 0.25;
      const maxY = screenH - 55;

      boardX = clamp(boardX, minX, maxX);
      boardY = clamp(boardY, minY, maxY);
    }

    /**
     * 撮影する
     */
    function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        alert("先にカメラを起動してください。");
        return;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const videoRect = video.getBoundingClientRect();
      const boardRect = photoBoard.getBoundingClientRect();

      const scaleX = canvas.width / videoRect.width;
      const scaleY = canvas.height / videoRect.height;

      const drawX = (boardRect.left - videoRect.left) * scaleX;
      const drawY = (boardRect.top - videoRect.top) * scaleY;
      const drawW = boardRect.width * scaleX;
      const drawH = boardRect.height * scaleY;

      drawBoardOnCanvas(ctx, drawX, drawY, drawW, drawH);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);

      resultImage.src = dataUrl;
      resultImage.style.display = "block";

      downloadLink.href = dataUrl;
      downloadLink.style.display = "inline-block";

      setTimeout(() => {
        resultImage.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    }

    /**
     * 撮影結果を消す
     */
    function clearResult() {
      resultImage.src = "";
      resultImage.style.display = "none";
      downloadLink.href = "";
      downloadLink.style.display = "none";
    }

    /**
     * canvasへ看板を描画する
     */
    function drawBoardOnCanvas(ctx, x, y, w, h) {
      const projectName = getText("projectName");
      const address = getText("address");
      const roomNo = getText("roomNo");
      const sampleNo = getText("sampleNo");
      const dateText = getText("dateText");

      ctx.save();

      ctx.fillStyle = "#000";
      ctx.fillRect(x, y, w, h);

      const pad = Math.max(2, w * 0.008);
      const bx = x + pad;
      const by = y + pad;
      const bw = w - pad * 2;
      const bh = h - pad * 2;

      ctx.fillStyle = "#fff";
      ctx.fillRect(bx, by, bw, bh);

      ctx.strokeStyle = "#000";
      ctx.lineWidth = Math.max(1.5, w * 0.004);

      const labelW = bw * 0.2;
      const row1H = bh * 0.24;
      const row2H = bh * 0.22;
      const row3H = bh * 0.36;
      const row4H = bh - row1H - row2H - row3H;

      ctx.strokeRect(bx, by, bw, bh);

      drawLine(ctx, bx, by + row1H, bx + bw, by + row1H);
      drawLine(ctx, bx, by + row1H + row2H, bx + bw, by + row1H + row2H);
      drawLine(ctx, bx, by + row1H + row2H + row3H, bx + bw, by + row1H + row2H + row3H);
      drawLine(ctx, bx + labelW, by, bx + labelW, by + bh);

      const labelFont = Math.max(10, bw * 0.044);
      const valueFont = Math.max(10, bw * 0.047);
      const contentFont = Math.max(9, bw * 0.043);
      const dateFont = Math.max(12, bw * 0.055);

      drawCenter(ctx, "件 名", bx, by, labelW, row1H, labelFont);
      drawCenter(ctx, "採取場所", bx, by + row1H, labelW, row2H, labelFont);
      drawCenter(ctx, "内 容", bx, by + row1H + row2H, labelW, row3H, labelFont);
      drawCenter(ctx, "日 付", bx, by + row1H + row2H + row3H, labelW, row4H, labelFont);

      drawFitText(ctx, projectName, bx + labelW + 6, by + row1H * 0.56, bw - labelW - 12, valueFont);
      drawFitText(ctx, address, bx + labelW + 6, by + row1H + row2H * 0.58, bw - labelW - 12, valueFont);

      const cx = bx + labelW;
      const cy = by + row1H + row2H;
      const cw = bw - labelW;

      const subRowH = row3H * 0.31;
      drawLine(ctx, cx, cy + subRowH, bx + bw, cy + subRowH);
      drawLine(ctx, cx, cy + subRowH * 2, bx + bw, cy + subRowH * 2);

      const subLabelW = cw * 0.33;
      drawLine(ctx, cx + subLabelW, cy, cx + subLabelW, cy + subRowH * 2);

      drawLeft(ctx, "部屋No.", cx + 5, cy + subRowH * 0.62, contentFont);
      drawLeft(ctx, roomNo, cx + subLabelW + 5, cy + subRowH * 0.62, contentFont * 1.25);

      drawLeft(ctx, "試料No.", cx + 5, cy + subRowH + subRowH * 0.62, contentFont);
      drawLeft(ctx, sampleNo, cx + subLabelW + 5, cy + subRowH + subRowH * 0.62, contentFont * 1.25);

      const types = ["目視", "施工前", "施工中", "施工後"];
      const eachW = cw / 4;

      types.forEach((type, index) => {
        const mark = type === selectedType ? "■" : "□";
        drawCenter(
          ctx,
          mark + type,
          cx + eachW * index,
          cy + subRowH * 2,
          eachW,
          row3H - subRowH * 2,
          contentFont * 0.95
        );
      });

      drawCenter(
        ctx,
        dateText,
        bx + labelW,
        by + row1H + row2H + row3H,
        bw - labelW,
        row4H,
        dateFont
      );

      ctx.restore();
    }

    function drawLine(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCenter(ctx, text, x, y, w, h, fontSize) {
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    function drawLeft(ctx, text, x, y, fontSize) {
      ctx.fillStyle = "#000";
      ctx.font = `900 ${fontSize}px sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(text, x, y);
    }

    function drawFitText(ctx, text, x, y, maxWidth, fontSize) {
      let size = fontSize;
      ctx.fillStyle = "#000";
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.font = `900 ${size}px sans-serif`;

      while (ctx.measureText(text).width > maxWidth && size > 8) {
        size -= 1;
        ctx.font = `900 ${size}px sans-serif`;
      }

      ctx.fillText(text, x, y);
    }

    function getText(id) {
      return document.getElementById(id).textContent.trim();
    }

    function setTodayIfEmpty() {
      const el = document.getElementById("dateText");
      if (!el) return;
      if (el.textContent.trim()) return;

      const now = new Date();
      el.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
    }

    function getDistance(p1, p2) {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }
  </script>
</body>
</html>
